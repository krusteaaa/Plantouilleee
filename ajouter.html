<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ajouter</title>

  <style>
    :root {
      --logo-color: #2563eb;      /* <-- couleur du logo */
      --bg: #0f172a;
      --panel: #111c33;
      --text: #e5e7eb;
      --muted: #94a3b8;
      --border: #24324a;
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* ---------- Transitions de page ---------- */
    .page {
      min-height: 100vh;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 350ms ease, transform 350ms ease;
    }

    .page.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .page.is-leaving {
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
    }

    /* ---------- En-tête / logo ---------- */
    .header {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px 24px;
    }

    .logo {
      display: block;
      width: 180px;          /* <-- logo plus grand */
      height: auto;
      color: var(--logo-color);
      text-decoration: none;
      flex: 0 0 auto;
    }

    .logo svg {
      display: block;
      width: 100%;
      height: auto;
      fill: currentColor;
    }

    h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 700;
    }

    /* ---------- Formulaire ---------- */
    .form {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: 10px 24px 130px;
      display: grid;
      gap: 18px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    label {
      font-size: 0.95rem;
      color: var(--muted);
    }

    select,
    input {
      width: 100%;
      padding: 14px 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font: inherit;
      outline: none;
    }

    select:focus,
    input:focus {
      border-color: var(--logo-color);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--logo-color) 25%, transparent);
    }

    /* ---------- Barre du bas : un seul bouton ---------- */
    .bottom-bar {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 55%, transparent);
      pointer-events: none;
    }

    .save-btn {
      pointer-events: auto;
      width: 64px;
      height: 64px;
      border: 0;
      border-radius: 50%;
      background: var(--logo-color);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      box-shadow: 0 12px 30px color-mix(in srgb, var(--logo-color) 45%, transparent);
      transition: transform 120ms ease, filter 120ms ease;
    }

    .save-btn:hover { filter: brightness(1.08); }
    .save-btn:active { transform: scale(0.96); }

    .save-btn svg {
      width: 30px;
      height: 30px;
      fill: currentColor;
    }

    /* Accessibilité : réduire les animations si demandé */
    @media (prefers-reduced-motion: reduce) {
      .page {
        transition: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <main class="page" id="page">
    <header class="header">
      <!-- Remplacez ce SVG par votre logo si nécessaire.
           La couleur vient de --logo-color. -->
      <a href="index.html" class="logo" aria-label="Accueil">
        <svg viewBox="0 0 240 64" role="img" aria-hidden="true">
          <rect x="0" y="8" width="48" height="48" rx="14"></rect>
          <circle cx="24" cy="32" r="10" fill="var(--bg)"></circle>
          <text x="64" y="42" font-size="28" font-weight="700" fill="currentColor">LOGO</text>
        </svg>
      </a>

      <h1>Ajouter</h1>
    </header>

    <form id="addForm" class="form">
      <div class="field">
        <label for="substrat">Substrat</label>
        <select id="substrat" name="substrat" required>
          <option value="">— Choisir —</option>
          <option value="sable">Sable</option>
          <option value="terreau">Terreau</option>
          <option value="coco">Fibre de coco</option>
          <option value="gravier">Gravier</option>
          <option value="autre">Autre</option>
        </select>
      </div>

      <div class="field">
        <label for="nom">Nom</label>
        <input id="nom" name="nom" type="text" placeholder="Nom de l’élément" required />
      </div>
    </form>

    <!-- En bas : juste un bouton, sans texte visible -->
    <div class="bottom-bar">
      <button
        type="submit"
        form="addForm"
        class="save-btn"
        id="saveBtn"
        aria-label="Enregistrer"
        title="Enregistrer"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 3h11l3 3v15H5V3zm2 2v5h9V5H7zm5 8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/>
        </svg>
      </button>
    </div>
  </main>

  <script>
    const page = document.getElementById('page');
    const form = document.getElementById('addForm');
    const substrat = document.getElementById('substrat');

    /* ---------- Fade in à l'arrivée ---------- */
    function showPage() {
      requestAnimationFrame(() => {
        page.classList.add('is-visible');
      });
    }

    /* ---------- Fade out avant de quitter ---------- */
    function leavePage(callback) {
      page.classList.remove('is-visible');
      page.classList.add('is-leaving');

      window.setTimeout(() => {
        callback();
      }, 350); // doit correspondre à la transition CSS
    }

    window.addEventListener('DOMContentLoaded', showPage);

    /* Retour depuis le cache navigateur */
    window.addEventListener('pageshow', () => {
      page.classList.remove('is-leaving');
      showPage();
    });

    /* ---------- Fade out sur les liens internes ---------- */
    document.querySelectorAll('a[href]').forEach((link) => {
      const href = link.getAttribute('href');

      if (
        !href ||
        href.startsWith('#') ||
        href.startsWith('mailto:') ||
        href.startsWith('tel:') ||
        link.target === '_blank' ||
        link.hasAttribute('data-no-transition')
      ) {
        return;
      }

      link.addEventListener('click', (event) => {
        event.preventDefault();
        leavePage(() => {
          window.location.href = href;
        });
      });
    });

    /* ---------- Menu Substrat ---------- */
    substrat.addEventListener('change', () => {
      console.log('Substrat sélectionné :', substrat.value);
      // Ici vous pouvez ajouter votre logique si besoin.
    });

    /* ---------- Enregistrement + fade out ---------- */
    form.addEventListener('submit', (event) => {
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      leavePage(() => {
        // Remplacez cette ligne par votre vrai traitement d'enregistrement.
        // Exemple : form.submit(); ou un fetch(...)
        console.log('Enregistrement :', {
          substrat: substrat.value,
          nom: document.getElementById('nom').value
        });

        // Si vous voulez revenir à une autre page après enregistrement :
        // window.location.href = 'index.html';
      });
    });
  </script>
</body>
</html>
