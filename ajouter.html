<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    --cactus-dark: #2d4a2b;
    --cactus-hover: #4a6b3d;
    --bg: #ffffff;
    --faint: rgba(45, 74, 43, 0.4);
    --border: rgba(45, 74, 43, 0.2);
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cactus-dark);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* =====================  HEADER  ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 5rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
  }

  .brand h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.9rem;
    line-height: 1;
    letter-spacing: -0.02em;
    color: var(--cactus-dark);
    transition: color 0.35s ease;
  }

  .brand:hover h1,
  .brand:focus h1 { color: var(--cactus-hover); outline: none; }

  .brand .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--faint);
    margin-top: 0.4rem;
    letter-spacing: 0.03em;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--faint); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--cactus-dark);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--faint); font-style: italic; }

  .add-link {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--cactus-dark);
    text-decoration: none;
    letter-spacing: 0.02em;
    padding-top: 0.4rem;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .add-link .plus {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: normal;
    font-size: 1.2rem;
    margin-right: 0.3rem;
    vertical-align: -0.05em;
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .add-link:hover,
  .add-link:focus { color: var(--cactus-hover); outline: none; }

  .add-link:hover .plus,
  .add-link:focus .plus { transform: rotate(90deg); }

  /* =====================  BACK  ===================== */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--faint);
    text-decoration: none;
    letter-spacing: 0.02em;
    margin-bottom: 2.5rem;
    transition: color 0.35s ease;
    animation: fade-in 1s ease-out 0.15s both;
  }

  .back-link .arrow-back {
    display: inline-block;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: normal;
    font-size: 1rem;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .back-link:hover,
  .back-link:focus { color: var(--cactus-dark); outline: none; }

  .back-link:hover .arrow-back,
  .back-link:focus .arrow-back { transform: translateX(-4px); }

  /* =====================  TITRE  ===================== */
  .page-title {
    margin-bottom: 4rem;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  .page-title h2 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    line-height: 1;
    letter-spacing: -0.025em;
  }

  .page-title p {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--faint);
    margin-top: 0.8rem;
    letter-spacing: 0.02em;
  }

  /* =====================  FORMULAIRE  ===================== */
  .form {
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 2.5rem;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.4s both;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.7rem;
  }

  .field label {
    font-family: "Inter", sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .field input[type="text"],
  .field input[type="number"],
  .field textarea {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cactus-dark);
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 0.6rem 0;
    outline: none;
    transition: border-color 0.3s ease;
    width: 100%;
    resize: vertical;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: var(--faint);
    font-style: italic;
  }

  .field input:focus,
  .field textarea:focus {
    border-bottom-color: var(--cactus-dark);
  }

  .field textarea {
    min-height: 6rem;
    line-height: 1.5;
    font-family: "Instrument Serif", Georgia, serif;
  }

  /* ----- Exposition : radios texte ----- */
  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    padding-top: 0.3rem;
  }

  .radio {
    display: inline-flex;
    align-items: center;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--faint);
    padding: 0.2rem 0;
    border-bottom: 1px solid transparent;
    transition: color 0.3s ease, border-color 0.3s ease;
  }

  .radio input { display: none; }

  .radio:hover { color: var(--cactus-dark); }

  .radio input:checked + span {
    color: var(--cactus-dark);
    border-bottom-color: var(--cactus-dark);
  }

  .radio span {
    padding-bottom: 0.1rem;
    border-bottom: 1px solid transparent;
    transition: border-color 0.3s ease, color 0.3s ease;
  }

  /* ----- Températures : sliders ----- */
  .temp-group {
    display: flex;
    flex-direction: column;
    gap: 1.8rem;
    padding-top: 0.5rem;
  }

  .temp-slider {
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .temp-slider__header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: "Inter", sans-serif;
    font-size: 0.62rem;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
  }

  .temp-slider__value {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    letter-spacing: 0;
    text-transform: none;
    color: var(--cactus-dark);
  }

  .temp-slider input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: var(--border);
    outline: none;
    border-radius: 1px;
    cursor: pointer;
  }

  .temp-slider input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--cactus-dark);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--cactus-dark);
    transition: transform 0.2s ease;
  }

  .temp-slider input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.15);
  }

  .temp-slider input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--cactus-dark);
    cursor: pointer;
    border: 2px solid var(--bg);
    box-shadow: 0 0 0 1px var(--cactus-dark);
  }

  .temp-slider__range-legend {
    display: flex;
    justify-content: space-between;
    font-family: "Inter", sans-serif;
    font-size: 0.55rem;
    letter-spacing: 0.2em;
    color: var(--faint);
    text-transform: uppercase;
    margin-top: 0.2rem;
  }

  /* ----- Submit ----- */
  .submit-btn {
    display: inline-flex;
    align-self: flex-start;
    padding: 0.4rem 1rem;
    font-family: "Fraunces", "Instrument Serif", Georgia, serif;
    font-size: 1.5rem;
    font-style: italic;
    font-weight: 400;
    color: var(--cactus-dark);
    background: none;
    border: none;
    cursor: pointer;
    margin-top: 1rem;
    transition: color 0.35s ease;
  }

  .submit-btn:hover,
  .submit-btn:focus {
    color: var(--cactus-hover);
    outline: none;
  }

  /* =====================  RESPONSIVE  ===================== */
  @media (max-width: 640px) {
    body { padding: 2rem 1.5rem; }
    .header { margin-bottom: 4rem; gap: 1.5rem; }
    .brand h1 { font-size: 1.6rem; }
    .search { max-width: none; width: 100%; }
    .radio-group { gap: 1.2rem; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .back-link, .page-title, .form {
      animation: none !important; opacity: 1; transform: none;
    }
    .add-link:hover .plus, .add-link:focus .plus { transform: none; }
    .back-link:hover .arrow-back,
    .back-link:focus .arrow-back { transform: none; }
  }
</style>
</head>
<body>

<header class="header">
  <a href="page2.html" class="brand">
    <h1>Plantouille</h1>
    <p class="subtitle">Cabinet du Dr-Cactus</p>

    <form class="search" role="search" onsubmit="event.preventDefault();">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
      </svg>
      <input type="search" placeholder="chercher…" aria-label="Rechercher">
    </form>
  </a>

  <a href="ajouter.html" class="add-link">
    <span class="plus">+</span>Ajouter
  </a>
</header>

<a href="page2.html" class="back-link">
  <span class="arrow-back">←</span>
  <span>retour</span>
</a>

<section class="page-title">
  <h2>Ajouter un spécimen</h2>
  <p>Une fiche, quelques notes, et la plante rejoint le cabinet.</p>
</section>

<form class="form" action="#" method="post" onsubmit="event.preventDefault();">

  <!-- Genre -->
  <div class="field">
    <label for="genre">Genre</label>
    <input type="text" id="genre" name="genre" placeholder="Trichocereus">
  </div>

  <!-- Famille botanique -->
  <div class="field">
    <label for="famille">Famille botanique</label>
    <input type="text" id="famille" name="famille" placeholder="Cactaceae">
  </div>

  <!-- Exposition -->
  <div class="field">
    <label>Exposition</label>
    <div class="radio-group">
      <label class="radio">
        <input type="radio" name="exposition" value="soleil">
        <span>Plein soleil</span>
      </label>
      <label class="radio">
        <input type="radio" name="exposition" value="mi-ombre">
        <span>Mi-ombre</span>
      </label>
      <label class="radio">
        <input type="radio" name="exposition" value="ombre">
        <span>Ombre</span>
      </label>
    </div>
  </div>

  <!-- Origine géographique -->
  <div class="field">
    <label for="origine">Origine géographique</label>
    <input type="text" id="origine" name="origine" placeholder="Andes, Pérou · Argentine">
  </div>

  <!-- Températures -->
  <div class="field">
    <label>Température acceptée</label>
    <div class="temp-group">
      <div class="temp-slider">
        <div class="temp-slider__header">
          <span>Minimum</span>
          <span class="temp-slider__value">
            <span id="temp-min-display">-5</span> °C
          </span>
        </div>
        <input type="range" id="temp-min" name="temp_min"
               min="-20" max="50" value="-5" step="1">
        <div class="temp-slider__range-legend">
          <span>-20</span>
          <span>50</span>
        </div>
      </div>

      <div class="temp-slider">
        <div class="temp-slider__header">
          <span>Maximum</span>
          <span class="temp-slider__value">
            <span id="temp-max-display">40</span> °C
          </span>
        </div>
        <input type="range" id="temp-max" name="temp_max"
               min="-20" max="50" value="40" step="1">
        <div class="temp-slider__range-legend">
          <span>-20</span>
          <span>50</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Substrat -->
  <div class="field">
    <label for="substrat">Substrat</label>
    <input type="text" id="substrat" name="substrat"
           placeholder="Terreau drainant, sable grossier, pouzzolane">
  </div>

  <!-- Histoire -->
  <div class="field">
    <label for="histoire">Histoire</label>
    <textarea id="histoire" name="histoire" rows="5"
              placeholder="D'où vient cette plante, comment elle est arrivée ici, ce qu'elle a traversé…"></textarea>
  </div>

  <!-- Nombre de spécimens -->
  <div class="field">
    <label for="nombre">Nombre de spécimens</label>
    <input type="number" id="nombre" name="nombre" min="0" value="1">
  </div>

  <!-- Submit -->
  <button type="submit" class="submit-btn">
    Enregistrer
  </button>

</form>

<script>
(function () {
  // Synchronise les sliders de température avec leurs afficheurs
  var minInput   = document.getElementById('temp-min');
  var maxInput   = document.getElementById('temp-max');
  var minDisplay = document.getElementById('temp-min-display');
  var maxDisplay = document.getElementById('temp-max-display');

  function sync(input, display) {
    input.addEventListener('input', function () {
      var v = parseInt(this.value, 10);
      display.textContent = v > 0 ? '+' + v : v;
    });
    // Init
    var v = parseInt(input.value, 10);
    display.textContent = v > 0 ? '+' + v : v;
  }

  sync(minInput, minDisplay);
  sync(maxInput, maxDisplay);

  // Empêche le minimum de dépasser le maximum
  minInput.addEventListener('input', function () {
    if (parseInt(minInput.value, 10) > parseInt(maxInput.value, 10)) {
      maxInput.value = minInput.value;
      var v = parseInt(maxInput.value, 10);
      maxDisplay.textContent = v > 0 ? '+' + v : v;
    }
  });

  maxInput.addEventListener('input', function () {
    if (parseInt(maxInput.value, 10) < parseInt(minInput.value, 10)) {
      minInput.value = maxInput.value;
      var v = parseInt(minInput.value, 10);
      minDisplay.textContent = v > 0 ? '+' + v : v;
    }
  });
})();
</script>

</body>
</html>
