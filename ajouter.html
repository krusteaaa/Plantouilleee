<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Ajouter — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Montserrat:wght@400;500&family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ==================== VARIABLES & BASE ==================== */
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  :root{
    color-scheme: light; 
    --cd:#2d4a2b; 
    --ch:#4a6b3d; 
    --bg:#ffffff;
    --f:rgba(45,74,43,.4);
    --tint:rgba(45,74,43,.04);
    --btn-bg:rgba(45,74,43,.06);
    --btn-hover:rgba(45,74,43,.12);
    --yellow:#d4a373; 
  }
  body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--cd);min-height:100vh;padding:3rem;-webkit-font-smoothing:antialiased;overflow-x:hidden}

  /* ==================== ANIMATIONS DE PAGE ==================== */
  .page-content {
    max-width: 1100px;
    margin: 0 auto;
    animation: fadeSlideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .page-exit {
    animation: fadeSlideOut 0.4s cubic-bezier(0.8, 0.2, 0.8, 0.2) forwards;
  }
  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeSlideOut {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(-20px); }
  }

  /* ==================== HEADER & LOGO ==================== */
  .header{display:flex;justify-content:space-between;align-items:center;gap:2rem;margin-bottom:4rem;flex-wrap:wrap}
  
  .brand-container {
    display: flex;
    align-items: center;
    gap: 2rem;
    text-decoration: none;
    color: inherit;
  }
  
  .brand-text { display: flex; flex-direction: column; }
  
  .brand h1{
    font-family: "Playfair Display", Georgia, serif !important; 
    font-style: italic !important; 
    font-weight: 700 !important; 
    font-size: 5rem; 
    line-height: 1; 
    letter-spacing: -.02em;
    color: var(--yellow); 
    transition: color .35s;
  }
  .brand-container:hover h1{ color: #c18f59; } 
  
  .brand .subtitle{
    font-family: "Montserrat", sans-serif !important; 
    font-weight: 500 !important; 
    font-size: 1.8rem; 
    color: var(--cd); 
    margin-top: 0.5rem; 
    letter-spacing: .05em;
  }
  
  .brand-logo{
    height: 375px; 
    width: auto;
    object-fit: contain;
    mix-blend-mode: multiply; 
    transition: transform .3s ease;
    order: -1; 
    margin-left: -2rem; 
  }
  .brand-container:hover .brand-logo{transform: scale(1.02)}

  /* ==================== BOUTON RETOUR ==================== */
  .back-btn{
    display:inline-flex;align-items:center;gap:0.8rem;
    padding:0.8rem 1.5rem;background:white;border:1px solid var(--cd);
    border-radius:999px;color:var(--cd);text-decoration:none;
    font-family:"Instrument Serif",serif;font-size:1.2rem;font-style:italic;
    transition:all 0.3s ease; cursor: pointer;
  }
  .back-btn:hover{background:var(--cd);color:white;transform:translateY(-2px);box-shadow:0 4px 12px rgba(45,74,43,.15)}
  .back-btn .arrow{font-family:sans-serif;font-style:normal;font-size:1.2rem;transition:transform 0.3s ease}
  .back-btn:hover .arrow{transform:translateX(-4px)}

  /* ==================== BOUTONS ==================== */
  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.85rem;
    padding: 1rem 2rem 1rem 1.5rem;
    background: var(--btn-bg);
    border: none; 
    cursor: pointer;
    border-radius: 999px;
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--cd);
    transition: all 0.35s ease;
    box-shadow: 0 2px 8px rgba(45,74,43,0.05);
  }
  .action-btn:hover {
    background: var(--btn-hover);
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(45,74,43,0.1);
  }
  .action-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--cd);
    color: #fff;
    transition: transform 0.4s ease;
  }
  .action-btn:hover .action-icon { transform: rotate(-10deg) scale(1.1); }

  .upload-btn { animation: softBounce 2.6s cubic-bezier(.34,1.56,.64,1) infinite; }
  .upload-btn:hover { animation-play-state: paused; }
  @keyframes softBounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}50%{transform:translateY(0)}70%{transform:translateY(-3px)}85%{transform:translateY(0)}}

  .upload-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 0 auto 3rem;
    max-width: 800px;
  }
  #photoInput{display:none}
  .image-preview{display:none;margin-top:1.5rem;width:300px;height:300px;border-radius:8px;object-fit:cover;box-shadow:0 8px 24px rgba(0,0,0,0.08)}

  /* ==================== FORMULAIRE ==================== */
  .form{max-width:800px;margin:0 auto;display:flex;flex-direction:column;gap:2.5rem}
  .field{display:flex;flex-direction:column;gap:.5rem;position:relative}
  .field>label{font-family:"Inter",sans-serif;font-size:.65rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--f)}
  .field input[type=text],.field input[type=number],.field textarea{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.25rem;color:var(--cd);background:transparent;border:none;outline:none;padding:.4rem .5rem;margin:0 -.5rem;width:calc(100% + 1rem);resize:vertical;transition:background .3s}
  .field textarea{min-height:6rem;line-height:1.55}
  .field input:focus,.field textarea:focus{background:var(--tint)}

  /* DROPDOWNS */
  .dropdown{position:relative;flex:1;min-width:0}
  .dd-native{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
  .dd-trigger{display:flex;align-items:center;justify-content:flex-start;gap:.5rem;width:100%;padding:.4rem 0;background:none;border:none;outline:none;color:var(--cd);cursor:pointer;text-align:left}
  .dd-value{display:inline-flex;align-items:baseline;flex-wrap:nowrap;max-width:calc(100% - 20px);min-width:0;font-family:"Instrument Serif",serif;font-style:italic;font-size:1.25rem;color:var(--cd);overflow:hidden}
  .dd-chevron{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;color:var(--cd);opacity:.5;transition:transform .35s}
  .dropdown.is-open .dd-chevron{transform:rotate(180deg)}
  .dd-menu{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:min(400px,60vh);overflow-y:auto;overflow-x:hidden;background:#fff;border-radius:4px;z-index:50;padding:38px 0;box-shadow:0 16px 40px -20px rgba(45,74,43,.15);mask-image:linear-gradient(to bottom,transparent 0,black 30px,black calc(100% - 40px),transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,black 30px,black calc(100% - 40px),transparent 100%);opacity:0;transform:translateY(-6px) scaleY(.98);transform-origin:top center;pointer-events:none;visibility:hidden;transition:all .3s}
  .dropdown.is-open .dd-menu{opacity:1;transform:translateY(0) scaleY(1);pointer-events:auto;visibility:visible}
  .dd-group{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.1rem;color:var(--cd);padding:.8rem 1.2rem .3rem;opacity:.55;list-style:none;pointer-events:none}
  .dd-item{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.1rem;color:var(--cd);padding:.5rem 1.2rem;cursor:pointer;list-style:none;transition:background .15s,padding-left .2s;opacity:0;transform:translateY(-4px)}
  .dropdown.is-open .dd-item{opacity:1;transform:translateY(0)}
  .dd-item:hover{background:var(--tint);padding-left:1.5rem}

  /* AUTRE & RADIOS */
  .select-row{display:flex;align-items:baseline;gap:.8rem}
  .select-row .dropdown{flex:1}
  .autre-btn{background:none;border:none;cursor:pointer;font-family:"Instrument Serif",serif;font-style:italic;font-size:1rem;color:var(--f);transition:color .3s;padding-bottom:.4rem}
  .autre-btn:hover{color:var(--cd)}
  .autre-input{margin-top:.5rem;display:none}

  .radio-group{display:flex;flex-wrap:wrap;gap:2.5rem;padding-top:.3rem}
  .radio{display:inline-flex;align-items:center;cursor:pointer}
  .radio input{display:none}
  .radio-text{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.25rem;color:var(--cd);padding-bottom:.15rem;border-bottom:1px solid transparent;transition:border-color .3s}
  .radio input:checked+.radio-text{border-bottom-color:var(--cd)}

  .temp-slider{display:flex;flex-direction:column;gap:1rem;padding-top:.3rem}
  .temp-slider__header{display:flex;justify-content:space-between;align-items:baseline}
  .temp-slider__value{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:2.2rem}
  .temp-slider__qualifier{font-family:"Instrument Serif",serif;font-style:italic;font-size:1rem;color:var(--f)}
  .temp-slider input[type=range]{-webkit-appearance:none;width:100%;height:1px;background:var(--f);outline:none;padding:.8rem 0;background-clip:content-box}
  .temp-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--cd);cursor:pointer}

  /* BOUTON ENREGISTRER */
  .submit-block { 
    display: flex; 
    justify-content: center; 
    margin-top: 1rem; 
    margin-bottom: 2rem;
  }
  .submit-block .action-btn {
    font-size: 1.6rem;
    padding: 1.2rem 3rem 1.2rem 2rem;
    background: var(--cd);
    color: white;
  }
  .submit-block .action-btn:hover {
    background: var(--ch);
  }
  .submit-block .action-btn .action-icon {
    background: white;
    color: var(--cd);
  }

  .wave-text{display:inline-flex;align-items:baseline;flex-wrap:wrap}
  .wave-letter{display:inline-block;will-change:transform;white-space:pre}

  /* ==================== RESPONSIVE ==================== */
  @media(max-width:900px){
    .header{flex-direction:column;align-items:flex-start;gap:2rem}
    .brand-container{flex-direction:column;align-items:flex-start;gap:1.5rem}
    .brand h1{font-size:3.5rem}
    .brand .subtitle{font-size:1.4rem}
    .brand-logo{height:200px; margin-left: 0;}
  }
  @media(max-width:640px){
    body{padding:2rem 1.5rem}
    .brand h1 { font-size: 3rem; }
    .brand-logo { height: 150px; }
    .action-btn{width:100%; font-size: 1.2rem;}
    .back-btn{width:100%; justify-content: center;}
    .submit-block .action-btn { font-size: 1.3rem; padding: 1rem 2rem; }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <a href="#" class="brand-container" onclick="navigate('page2.html'); return false;">
      <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">
      
      <div class="brand-text">
        <h1 class="wave-text"><span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter">i</span><span class="wave-letter">l</span><span class="wave-letter">l</span><span class="wave-letter">e</span></h1>
        <p class="subtitle">Cabinet du Dr-Cactus</p>
      </div>
    </a>

    <a href="#" class="back-btn" onclick="navigate('page2.html'); return false;">
      <span class="arrow">←</span> Retour
    </a>
  </header>

  <div class="upload-block">
    <input type="file" id="photoInput" accept="image/*">
    <button type="button" class="action-btn upload-btn wave-text" id="uploadBtn">
      <span class="action-icon"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <span><span class="wave-letter">a</span><span class="wave-letter">j</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter">t</span><span class="wave-letter">e</span><span class="wave-letter">r</span><span class="wave-letter">&nbsp;</span><span class="wave-letter">u</span><span class="wave-letter">n</span><span class="wave-letter">e</span><span class="wave-letter">&nbsp;</span><span class="wave-letter">p</span><span class="wave-letter">h</span><span class="wave-letter">o</span><span class="wave-letter">t</span><span class="wave-letter">o</span></span>
    </button>
    <img id="previewImg" class="image-preview" alt="Aperçu">
  </div>

  <form class="form" id="specimenForm">

    <div class="field">
      <label>Catégorie</label>
      <div class="dropdown" data-dropdown="categorie">
        <select id="categorie" class="dd-native" required>
          <option value="">Sélectionner une catégorie…</option>
          <optgroup label="Plantes">
            <option value="cactus">Cactus</option>
            <option value="succulentes">Succulentes</option>
            <option value="caudex">À caudex</option>
            <option value="arbres">Arbres</option>
            <option value="fleurs">Fleurs</option>
            <option value="legumes">Légumes</option>
            <option value="fruitiers">Fruitiers</option>
            <option value="aromatiques">Aromatiques</option>
            <option value="carnivores">Carnivores</option>
            <option value="entheogenes">Enthéogènes</option>
            <option value="cannabis">Cannabis</option>
          </optgroup>
          <optgroup label="Bonsaïs">
            <option value="bonsais-feuillus">Feuillus</option>
            <option value="bonsais-coniferes">Conifères</option>
            <option value="bonsais-fleurs">Fleurs</option>
            <option value="bonsais-fruitiers">Fruitiers</option>
          </optgroup>
          <optgroup label="Graines">
            <option value="graines-aromatiques">Aromatiques</option>
            <option value="graines-legumes">Légumes</option>
            <option value="graines-fleurs">Fleurs</option>
            <option value="graines-fruitiers">Fruitiers</option>
            <option value="graines-cactus">Cactus</option>
            <option value="graines-arbres">Arbres</option>
          </optgroup>
          <optgroup label="Spores">
            <option value="spores-cultives">Cultivés</option>
            <option value="spores-medicinaux">Médicinaux</option>
            <option value="spores-sauvages">Sauvages</option>
            <option value="spores-psychedeliques">Psychédéliques</option>
          </optgroup>
        </select>
        <button type="button" class="dd-trigger" data-placeholder="Sélectionner une catégorie…"><span class="dd-value"></span><span class="dd-chevron"><svg viewBox="0 0 10 6" width="10" height="6" stroke="currentColor" fill="none"><path d="M1 1 L5 5 L9 1"/></svg></span></button>
        <div class="dd-menu"></div>
      </div>
    </div>

    <div class="field">
      <label>Genre / Variété</label>
      <div class="select-row">
        <div class="dropdown" data-dropdown="genre">
          <select id="genre" class="dd-native"></select>
          <button type="button" class="dd-trigger" data-placeholder="Sélectionner un genre…"><span class="dd-value"></span><span class="dd-chevron"><svg viewBox="0 0 10 6" width="10" height="6" stroke="currentColor" fill="none"><path d="M1 1 L5 5 L9 1"/></svg></span></button>
          <div class="dd-menu"></div>
        </div>
        <button type="button" class="autre-btn" data-target="genre-autre">Autre</button>
      </div>
      <input type="text" id="genre-autre" class="autre-input" placeholder="Saisir le genre">
    </div>

    <div class="field">
      <label>Famille botanique</label>
      <div class="select-row">
        <div class="dropdown" data-dropdown="famille">
          <select id="famille" class="dd-native"></select>
          <button type="button" class="dd-trigger" data-placeholder="Sélectionner une famille…"><span class="dd-value"></span><span class="dd-chevron"><svg viewBox="0 0 10 6" width="10" height="6" stroke="currentColor" fill="none"><path d="M1 1 L5 5 L9 1"/></svg></span></button>
          <div class="dd-menu"></div>
        </div>
        <button type="button" class="autre-btn" data-target="famille-autre">Autre</button>
      </div>
      <input type="text" id="famille-autre" class="autre-input" placeholder="Saisir la famille">
    </div>

    <div class="field">
      <label>Exposition</label>
      <div class="radio-group">
        <label class="radio"><input type="radio" name="exposition" value="Plein soleil"><span class="radio-text wave-text"><span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">e</span><span class="wave-letter">i</span><span class="wave-letter">n</span><span class="wave-letter">&nbsp;</span><span class="wave-letter">s</span><span class="wave-letter">o</span><span class="wave-letter">l</span><span class="wave-letter">e</span><span class="wave-letter">i</span><span class="wave-letter">l</span></span></label>
        <label class="radio"><input type="radio" name="exposition" value="Mi-ombre"><span class="radio-text wave-text"><span class="wave-letter">M</span><span class="wave-letter">i</span><span class="wave-letter">-</span><span class="wave-letter">o</span><span class="wave-letter">m</span><span class="wave-letter">b</span><span class="wave-letter">r</span><span class="wave-letter">e</span></span></label>
        <label class="radio"><input type="radio" name="exposition" value="Ombre"><span class="radio-text wave-text"><span class="wave-letter">O</span><span class="wave-letter">m</span><span class="wave-letter">b</span><span class="wave-letter">r</span><span class="wave-letter">e</span></span></label>
      </div>
    </div>

    <div class="field">
      <label>Résistance au froid</label>
      <div class="temp-slider">
        <div class="temp-slider__header">
          <span class="temp-slider__value" id="temp-display">-10 °C</span>
          <span class="temp-slider__qualifier" id="temp-qualifier">rustique</span>
        </div>
        <input type="range" id="temp" min="-25" max="20" value="-10">
      </div>
    </div>

    <div class="field">
      <label>Substrat</label>
      <div class="select-row">
        <div class="dropdown" data-dropdown="substrat">
          <select id="substrat" class="dd-native"></select>
          <button type="button" class="dd-trigger" data-placeholder="Sélectionner un substrat…"><span class="dd-value"></span><span class="dd-chevron"><svg viewBox="0 0 10 6" width="10" height="6" stroke="currentColor" fill="none"><path d="M1 1 L5 5 L9 1"/></svg></span></button>
          <div class="dd-menu"></div>
        </div>
        <button type="button" class="autre-btn" data-target="substrat-autre">Autre</button>
      </div>
      <input type="text" id="substrat-autre" class="autre-input" placeholder="Saisir le substrat">
    </div>

    <div class="field">
      <label>Histoire</label>
      <textarea id="histoire" rows="4" placeholder="D'où vient cette plante, son histoire..."></textarea>
    </div>

    <div class="submit-block">
      <button type="submit" class="action-btn wave-text">
        <span class="action-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg></span>
        <span><span class="wave-letter">E</span><span class="wave-letter">n</span><span class="wave-letter">r</span><span class="wave-letter">e</span><span class="wave-letter">g</span><span class="wave-letter">i</span><span class="wave-letter">s</span><span class="wave-letter">t</span><span class="wave-letter">r</span><span class="wave-letter">e</span><span class="wave-letter">r</span></span>
      </button>
    </div>
  </form>
</div>
<script>
// ==================== NAVIGATION ====================
function navigate(url) {
  document.querySelector('.page-content').classList.add('page-exit');
  setTimeout(() => { window.location.href = url; }, 400); 
}

// ==================== IMAGE UPLOAD ====================
let currentImageBase64 = '';
const uploadBtn = document.getElementById('uploadBtn');
const photoInput = document.getElementById('photoInput');
const previewImg = document.getElementById('previewImg');

uploadBtn.addEventListener('click', () => photoInput.click());
photoInput.addEventListener('change', function(e) {
  const file = e.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(event) {
      currentImageBase64 = event.target.result;
      previewImg.src = currentImageBase64;
      previewImg.style.display = 'block';
      uploadBtn.style.display = 'none';
    };
    reader.readAsDataURL(file);
  }
});

// ==================== LISTES EXHAUSTIVES ====================

const catSelect = document.getElementById('categorie');
const genreSelect = document.getElementById('genre');
const familleSelect = document.getElementById('famille');
const substratSelect = document.getElementById('substrat');

function unionGenres(){ const s = new Set(); Object.values(DATA).forEach(c => { if(c.genres) c.genres.forEach(g => s.add(g)); }); return [...s].sort((a,b)=>a.localeCompare(b,'fr')); }
function unionFamilles(){ const s = new Set(); Object.values(DATA).forEach(c => { if(c.familles) c.familles.forEach(f => s.add(f)); }); return [...s].sort((a,b)=>a.localeCompare(b,'fr')); }
function unionSubstrats(){ const s = new Set(); Object.values(SUBSTRATS).forEach(arr => arr.forEach(x => s.add(x))); return [...s].sort((a,b)=>a.localeCompare(b,'fr')); }

function populateGenres(c){
  genreSelect.innerHTML = '<option value="">Sélectionner un genre…</option>';
  const list = (c && DATA[c] && DATA[c].genres) ? [...DATA[c].genres] : unionGenres();
  list.sort((a,b)=>a.localeCompare(b,'fr')).forEach(g => { const o = document.createElement('option'); o.value = g; o.textContent = g; genreSelect.appendChild(o); });
}
function populateFamilles(c){
  familleSelect.innerHTML = '<option value="">Sélectionner une famille…</option>';
  const list = (c && DATA[c] && DATA[c].familles) ? [...DATA[c].familles] : unionFamilles();
  list.sort((a,b)=>a.localeCompare(b,'fr')).forEach(f => { const o = document.createElement('option'); o.value = f; o.textContent = f; familleSelect.appendChild(o); });
}
function populateSubstrats(c){
  substratSelect.innerHTML = '<option value="">Sélectionner un substrat…</option>';
  const list = (c && SUBSTRATS[c]) ? [...SUBSTRATS[c]] : unionSubstrats();
  list.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; substratSelect.appendChild(o); });
}

document.querySelectorAll('.dropdown').forEach(root => {
  const select = root.querySelector('select');
  const trigger = root.querySelector('.dd-trigger');
  const valueEl = root.querySelector('.dd-value');
  const menu = root.querySelector('.dd-menu');
  
  root.updateUI = () => {
    menu.innerHTML = '';
    Array.from(select.children).forEach(child => {
      if (child.tagName === 'OPTGROUP') {
        menu.innerHTML += `<li class="dd-group">${child.label}</li>`;
        Array.from(child.children).forEach(opt => { if(opt.value) menu.innerHTML += `<li class="dd-item" data-val="${opt.value}">${opt.textContent}</li>`; });
      } else if (child.tagName === 'OPTION' && child.value) {
        menu.innerHTML += `<li class="dd-item" data-val="${child.value}">${child.textContent}</li>`;
      }
    });
    const sel = select.options[select.selectedIndex];
    valueEl.innerHTML = '';
    const text = (sel && sel.value) ? sel.textContent : trigger.dataset.placeholder;
    for(let ch of text) valueEl.innerHTML += `<span class="wave-letter">${ch === ' ' ? '&nbsp;' : ch}</span>`;
    initWave(trigger);
  };

  trigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.dropdown').forEach(d => { if(d !== root) d.classList.remove('is-open'); });
    root.classList.toggle('is-open');
  });

  menu.addEventListener('click', (e) => {
    const item = e.target.closest('.dd-item');
    if(!item) return;
    select.value = item.dataset.val;
    root.updateUI();
    root.classList.remove('is-open');
    if (root.dataset.dropdown === 'categorie') {
      populateGenres(select.value);
      populateFamilles(select.value);
      populateSubstrats(select.value);
      document.querySelector('[data-dropdown="genre"]').updateUI();
      document.querySelector('[data-dropdown="famille"]').updateUI();
      document.querySelector('[data-dropdown="substrat"]').updateUI();
    }
  });
  root.updateUI();
});

document.addEventListener('click', () => document.querySelectorAll('.dropdown').forEach(d => d.classList.remove('is-open')));

// ==================== BOUTONS AUTRE ====================
document.querySelectorAll('.autre-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.preventDefault();
    const input = document.getElementById(btn.dataset.target);
    const isHidden = input.style.display === 'none' || input.style.display === '';
    if (isHidden) { input.style.display = 'block'; input.focus(); btn.textContent = 'Annuler'; } 
    else { input.style.display = 'none'; input.value = ''; btn.textContent = 'Autre'; }
  });
});

// ==================== TEMPÉRATURE ====================
const tempInput = document.getElementById('temp');
const tempDisplay = document.getElementById('temp-display');
const tempQualifier = document.getElementById('temp-qualifier');
function tempLabel(v){ if(v <= -15) return 'très rustique'; if(v <= -5) return 'rustique'; if(v <= 5) return 'semi-rustique'; if(v <= 12) return 'frileux'; return 'tropical'; }
function updateTemp(){ const v = parseInt(tempInput.value, 10); tempDisplay.textContent = (v > 0 ? '+' : '') + v + ' °C'; tempQualifier.textContent = tempLabel(v); }
tempInput.addEventListener('input', updateTemp); updateTemp();

document.getElementById('specimenForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const newSpecimen = {
    id: Date.now(),
    photo: currentImageBase64,
    categorie: document.getElementById('categorie').value,
    genre: document.getElementById('genre').value || document.getElementById('genre-autre').value,
    famille: document.getElementById('famille').value || document.getElementById('famille-autre').value,
    exposition: document.querySelector('input[name="exposition"]:checked')?.value || '',
    temperature: document.getElementById('temp-display').textContent,
    substrat: document.getElementById('substrat').value || document.getElementById('substrat-autre').value,
    histoire: document.getElementById('histoire').value
  };
  let savedData = JSON.parse(localStorage.getItem('plantouille_data')) || [];
  savedData.push(newSpecimen);
  localStorage.setItem('plantouille_data', JSON.stringify(savedData));
  navigate('photos.html');
});

// ==================== ANIMATION VAGUE ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if(!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20; 
  const PERIOD = 2500; 
  const STAGGER = 150; 
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;
  
  function tick(now){
    if(phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if(Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if(amplitude === 0 && targetAmplitude === 0){
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if(!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if(!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if(!rafId) rafId = requestAnimationFrame(tick); }, {passive:true});
  el.addEventListener('touchend', () => { targetAmplitude = 0; if(!rafId) rafId = requestAnimationFrame(tick); }, {passive:true});
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el.closest('button, a') || el));

populateGenres(''); populateFamilles(''); populateSubstrats('');
</script>
