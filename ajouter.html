<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajouter — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  :root{--cd:#2d4a2b;--ch:#4a6b3d;--bg:#fff;--f:rgba(45,74,43,.4);--tint:rgba(45,74,43,.04)}
  body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--cd);min-height:100vh;padding:3rem;-webkit-font-smoothing:antialiased}

  /* HEADER */
  .header{display:flex;justify-content:space-between;align-items:flex-start;gap:2rem;margin-bottom:4rem;flex-wrap:wrap}
  .brand{display:flex;flex-direction:column;text-decoration:none;color:inherit;cursor:pointer}
  
  /* NOUVEAU : Conteneur pour le titre et le logo */
  .brand-top{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
  
  /* TAILLE AUGMENTÉE */
  .brand h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:2.8rem;line-height:1;letter-spacing:-.02em;transition:color .35s}
  .brand:hover h1{color:var(--ch)}
  
  /* NOUVEAU : Style du logo */
  .brand-logo{height:75px;width:auto;object-fit:contain}
  
  /* TAILLE AUGMENTÉE */
  .brand .subtitle{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.15rem;color:var(--f);margin-top:0.6rem;letter-spacing:.03em}
  
  .search{display:flex;align-items:center;gap:.5rem;margin-top:1.4rem;max-width:250px}
  .search svg{color:var(--f);flex-shrink:0}
  .search input{flex:1;border:none;outline:none;background:none;font-family:"Instrument Serif",serif;font-style:italic;font-size:.95rem;color:var(--cd);padding:.1rem 0;min-width:0}
  .search input::placeholder{color:var(--f);font-style:italic}
  .header-right{display:flex;align-items:center;margin-top:.3rem;margin-right:2.5rem}

  /* BOUTON RETOUR */
  .back-link{display:inline-flex;align-items:center;gap:.75rem;padding:.4rem .9rem .4rem .4rem;font-family:"Instrument Serif",serif;font-style:italic;font-size:1rem;color:var(--f);text-decoration:none;border-radius:999px;transition:color .4s ease,background .4s ease}
  .back-link:hover,.back-link:focus{color:var(--cd);background:rgba(45,74,43,.05);outline:none}
  .back-link .arrow-back{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(45,74,43,.08);color:var(--cd);font-family:"Cormorant Garamond",serif;font-style:normal;font-size:.95rem;font-weight:500;transition:transform .45s cubic-bezier(.4,0,.2,1),background .35s ease,color .35s ease}
  .back-link:hover .arrow-back,.back-link:focus .arrow-back{transform:translateX(-3px);background:var(--cd);color:#fff}

  /* BOUTON UPLOAD PHOTO — animation de rebonds */
  .upload-block{display:flex;justify-content:center;margin:0 0 3rem;animation:fadeIn .6s ease .1s both}
  .upload-btn{
    display:inline-flex;align-items:center;gap:.85rem;
    padding:.9rem 1.8rem .9rem 1.4rem;
    background:none;border:none;cursor:pointer;text-decoration:none;
    border-radius:999px;font-family:"Instrument Serif",serif;font-style:italic;
    font-size:1.25rem;color:var(--cd);
    transition:background .35s ease,color .35s ease;
    animation:softBounce 2.6s cubic-bezier(.34,1.56,.64,1) infinite;
    will-change:transform;
  }
  .upload-btn:hover,.upload-btn:focus{
    background:rgba(45,74,43,.06);outline:none;animation-play-state:paused;
  }
  .upload-icon{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;
    background:var(--cd);color:#fff;flex-shrink:0;
    transition:transform .4s ease;
  }
  .upload-btn:hover .upload-icon{transform:rotate(-6deg) scale(1.05)}
  @keyframes softBounce{
    0%,100%{transform:translateY(0)}
    30%{transform:translateY(-9px)}
    50%{transform:translateY(0)}
    68%{transform:translateY(-4px)}
    82%{transform:translateY(0)}
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* FORMULAIRE */
  .form{max-width:720px;display:flex;flex-direction:column;gap:2.5rem}
  .field{display:flex;flex-direction:column;gap:.5rem;position:relative}
  .field>label,.field>.label{font-family:"Inter",sans-serif;font-size:.6rem;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:var(--f);pointer-events:none}
  .field input[type=text],.field input[type=number],.field textarea{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.15rem;line-height:1.5;color:var(--cd);background:transparent;border:none;outline:none;box-shadow:none;padding:.3rem .5rem;margin:0 -.5rem;width:calc(100% + 1rem);resize:vertical;transition:background .3s ease}
  .field input[type=text]::placeholder,.field input[type=number]::placeholder,.field textarea::placeholder{color:var(--f);font-style:italic}
  .field textarea{min-height:5.5rem;line-height:1.55}
  .field input[type=text]:focus,.field input[type=number]:focus,.field textarea:focus{background:var(--tint)}

  /* DROPDOWN */
  .dropdown{position:relative;flex:1;min-width:0}
  .dd-native{position:absolute;width:0;height:0;opacity:0;pointer-events:none}
  .dd-trigger{display:flex;align-items:center;justify-content:flex-start;gap:.4rem;width:100%;padding:.3rem 0;background:none;border:none;outline:none;color:var(--cd);cursor:pointer;text-align:left}
  .dd-trigger:focus-visible{outline:none}
  .dd-value{display:inline-flex;align-items:baseline;flex-wrap:nowrap;max-width:calc(100% - 20px);min-width:0;font-family:"Instrument Serif",serif;font-style:italic;font-size:1.15rem;color:var(--cd);overflow:hidden}
  .dd-chevron{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;width:14px;height:14px;color:var(--cd);opacity:.5;transition:transform .35s cubic-bezier(.4,0,.2,1),opacity .3s ease}
  .dd-chevron svg{display:block}
  .dd-trigger:hover .dd-chevron{opacity:1}
  .dropdown.is-open .dd-chevron{transform:rotate(180deg)}

  .dd-menu{
    position:absolute;top:calc(100% + 6px);left:0;right:0;
    max-height:min(340px,55vh);overflow-y:auto;overflow-x:hidden;
    background:#fff;border:none;outline:none;border-radius:4px;z-index:50;
    padding:38px 0;
    box-shadow:0 16px 32px -20px rgba(45,74,43,.10);
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 14px,black 30px,black calc(100% - 40px),rgba(0,0,0,.35) calc(100% - 14px),transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,rgba(0,0,0,.35) 14px,black 30px,black calc(100% - 40px),rgba(0,0,0,.35) calc(100% - 14px),transparent 100%);
    opacity:0;transform:translateY(-6px) scaleY(.98);transform-origin:top center;
    pointer-events:none;visibility:hidden;
    transition:opacity .28s ease,transform .38s cubic-bezier(.4,0,.2,1),visibility 0s linear .38s;
  }
  .dropdown.is-open .dd-menu{opacity:1;transform:translateY(0) scaleY(1);pointer-events:auto;visibility:visible;transition:opacity .28s ease,transform .38s cubic-bezier(.4,0,.2,1),visibility 0s linear 0s}
  .dd-menu{scrollbar-width:thin;scrollbar-color:rgba(45,74,43,.15) transparent}
  .dd-menu::-webkit-scrollbar{width:3px}
  .dd-menu::-webkit-scrollbar-track{background:transparent}
  .dd-menu::-webkit-scrollbar-thumb{background:rgba(45,74,43,.15);border-radius:2px}
  .dd-menu::-webkit-scrollbar-thumb:hover{background:rgba(45,74,43,.35)}

  .dd-group{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:400;font-size:1rem;letter-spacing:.02em;color:var(--cd);padding:.7rem 1rem .3rem;opacity:.55;list-style:none;user-select:none;pointer-events:none}
  .dd-item{font-family:"Instrument Serif",serif;font-style:italic;font-size:1rem;color:var(--cd);padding:.4rem 1rem;cursor:pointer;list-style:none;pointer-events:auto;transition:background .15s ease,color .15s ease,padding-left .3s ease,opacity .32s ease,transform .32s cubic-bezier(.4,0,.2,1);opacity:0;transform:translateY(-4px)}
  .dropdown.is-open .dd-item{opacity:1;transform:translateY(0)}
  .dd-item:hover{background:rgba(45,74,43,.06);padding-left:1.3rem}
  .dd-item.is-selected{color:var(--ch)}
  .dd-item.is-selected::after{content:'·';margin-left:.5rem;color:var(--ch)}

  .select-row{display:flex;align-items:baseline;gap:.5rem;justify-content:flex-start}
  .select-row .dropdown{flex:0 1 auto;min-width:0;max-width:75%}
  .autre-btn{flex-shrink:0;padding:0 0 .3rem 0;background:none;border:none;cursor:pointer;font-family:"Instrument Serif",serif;font-style:italic;font-size:.9rem;color:var(--f);letter-spacing:.02em;transition:color .3s;align-self:flex-end}
  .autre-btn:hover,.autre-btn:focus{color:var(--cd);outline:none}
  .autre-btn.is-active{color:var(--cd)}
  .autre-input[hidden]{display:none}
  .autre-input{margin-top:.5rem}

  .radio-group{display:flex;flex-wrap:wrap;gap:2rem;padding-top:.2rem}
  .radio{display:inline-flex;align-items:center;cursor:pointer;padding:.1rem 0}
  .radio input{display:none}
  .radio-text{font-family:"Instrument Serif",serif;font-style:italic;font-size:1.1rem;color:var(--cd);padding-bottom:.15rem;border-bottom:1px solid transparent;transition:border-color .3s}
  .radio:hover .radio-text{border-bottom-color:rgba(45,74,43,.3)}
  .radio input:checked+.radio-text{border-bottom-color:var(--cd)}

  .temp-slider{display:flex;flex-direction:column;gap:.8rem;padding-top:.3rem}
  .temp-slider__header{display:flex;justify-content:space-between;align-items:baseline}
  .temp-slider__value{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:2rem;line-height:1;color:var(--cd)}
  .temp-slider__qualifier{font-family:"Instrument Serif",serif;font-style:italic;font-size:.95rem;color:var(--f)}
  .temp-slider input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:1px;background:rgba(45,74,43,.25);outline:none;border:none;border-radius:0;cursor:pointer;padding:.7rem 0;background-clip:content-box}
  .temp-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--cd);cursor:pointer;border:none;box-shadow:none;transition:transform .2s}
  .temp-slider input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
  .temp-slider input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--cd);cursor:pointer;border:none;box-shadow:none}
  .temp-slider__marks{display:flex;justify-content:space-between;font-family:"Inter",sans-serif;font-size:.55rem;letter-spacing:.15em;color:var(--f);text-transform:uppercase}

  /* ACTIONS EN BAS */
  .form-actions{display:flex;justify-content:space-between;align-items:center;gap:2rem;flex-wrap:wrap;margin-top:1.5rem}
  .submit-btn{display:inline-flex;padding:.3rem .8rem;font-family:"Instrument Serif",serif;font-size:1.7rem;font-style:italic;color:var(--cd);background:none;border:none;cursor:pointer;transition:color .35s}
  .submit-btn:hover{color:var(--ch)}

  .photos-btn{display:inline-flex;align-items:center;gap:.7rem;padding:.5rem .9rem .5rem .7rem;font-family:"Instrument Serif",serif;font-style:italic;font-size:1.15rem;color:var(--f);text-decoration:none;border-radius:999px;transition:color .4s ease,background .4s ease}
  .photos-btn:hover,.photos-btn:focus{color:var(--cd);background:rgba(45,74,43,.05);outline:none}
  .photos-btn .photos-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:rgba(45,74,43,.08);color:var(--cd);transition:transform .45s cubic-bezier(.4,0,.2,1),background .35s ease,color .35s ease}
  .photos-btn:hover .photos-icon,.photos-btn:focus .photos-icon{background:var(--cd);color:#fff;transform:translateY(-2px)}

  .wave-text{display:inline-flex;align-items:baseline;flex-wrap:wrap;overflow:visible}
  .wave-letter{display:inline-block;will-change:transform;white-space:pre}

  @media(max-width:640px){
    body{padding:2rem 1.5rem}
    .header{margin-bottom:2.5rem;gap:1.2rem}
    .brand h1{font-size:2rem}
    .brand-logo{height:50px}
    .search{max-width:none;width:100%}
    .header-right{align-items:flex-start;width:100%;margin-right:0}
    .form{gap:2rem}
    .radio-group{gap:1.4rem}
    .field input[type=text],.field input[type=number],.field textarea,.dd-value{font-size:1.05rem}
    .temp-slider__value{font-size:1.7rem}
    .submit-btn{font-size:1.4rem}
    .photos-btn{font-size:1rem}
    .dd-menu{max-height:50vh}
    .autre-btn{font-size:.85rem}
    .form-actions{flex-direction:column;align-items:flex-start;gap:1rem}
    .upload-btn{font-size:1.05rem;padding:.8rem 1.4rem .8rem 1.1rem}
  }
</style>
</head>
<body>

<header class="header">
  <a href="page2.html" class="brand">
    
    <!-- NOUVEAU : Conteneur titre + logo -->
    <div class="brand-top">
      <h1 class="wave-text" aria-label="Plantouille">
        <span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter">i</span><span class="wave-letter">l</span><span class="wave-letter">l</span><span class="wave-letter">e</span>
      </h1>
      
      <!-- NOUVEAU : Image du logo -->
      <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">
    </div>

    <p class="subtitle">Cabinet du Dr-Cactus</p>
    
    <form class="search" role="search" onsubmit="event.preventDefault();">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5"/><line x1="11" y1="11" x2="14" y2="14"/></svg>
      <input type="search" placeholder="chercher…" aria-label="Rechercher">
    </form>
  </a>
  <div class="header-right">
    <a href="page2.html" class="back-link" aria-label="retour">
      <span class="arrow-back">←</span>
      <span class="back-link__text wave-text" aria-hidden="true">
        <span class="wave-letter">r</span><span class="wave-letter">e</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter">r</span>
      </span>
    </a>
  </div>
</header>

<!-- UPLOAD PHOTO — au-dessus de la catégorie -->
<div class="upload-block">
  <a href="photos.html" class="upload-btn" aria-label="Ajouter une photo">
    <span class="upload-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
    </span>
    <span class="wave-text" aria-hidden="true">
      <span class="wave-letter">a</span><span class="wave-letter">j</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter">t</span><span class="wave-letter">e</span><span class="wave-letter">r</span><span class="wave-letter">&nbsp;</span><span class="wave-letter">u</span><span class="wave-letter">n</span><span class="wave-letter">e</span><span class="wave-letter">&nbsp;</span><span class="wave-letter">p</span><span class="wave-letter">h</span><span class="wave-letter">o</span><span class="wave-letter">t</span><span class="wave-letter">o</span>
    </span>
  </a>
</div>

<form class="form" action="#" method="post" onsubmit="event.preventDefault();">

  <div class="field">
    <label>Catégorie</label>
    <div class="dropdown" data-dropdown="categorie">
      <select id="categorie" name="categorie" class="dd-native" required>
        <option value="">Sélectionner une catégorie…</option>
        <optgroup label="Plantes">
          <option value="cactus">Cactus</option>
          <option value="succulentes">Succulentes</option>
          <option value="caudex">À caudex</option>
          <option value="arbres">Arbres</option>
          <option value="fleurs">Fleurs</option>
          <option value="legumes">Légumes</option>
          <option value="fruitiers">Fruitiers</option>
          <option value="aromatiques">Aromatiques</option>
          <option value="carnivores">Carnivores</option>
          <option value="entheogenes">Enthéogènes</option>
          <option value="cannabis">Cannabis</option>
        </optgroup>
        <optgroup label="Bonsaïs">
          <option value="bonsais-feuillus">Feuillus</option>
          <option value="bonsais-coniferes">Conifères</option>
          <option value="bonsais-fleurs">Fleurs</option>
          <option value="bonsais-fruitiers">Fruitiers</option>
        </optgroup>
        <optgroup label="Graines">
          <option value="graines-aromatiques">Aromatiques</option>
          <option value="graines-legumes">Légumes</option>
          <option value="graines-fleurs">Fleurs</option>
          <option value="graines-fruitiers">Fruitiers</option>
          <option value="graines-cactus">Cactus</option>
          <option value="graines-arbres">Arbres</option>
        </optgroup>
        <optgroup label="Spores">
          <option value="spores-cultives">Cultivés</option>
          <option value="spores-medicinaux">Médicinaux</option>
          <option value="spores-sauvages">Sauvages</option>
          <option value="spores-psychedeliques">Psychédéliques</option>
        </optgroup>
      </select>
      <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" data-placeholder="Sélectionner une catégorie…">
        <span class="dd-value"></span>
        <span class="dd-chevron" aria-hidden="true"><svg viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1 L5 5 L9 1"/></svg></span>
      </button>
      <div class="dd-menu" role="listbox"></div>
    </div>
  </div>

  <div class="field">
    <label>Genre</label>
    <div class="select-row">
      <div class="dropdown" data-dropdown="genre">
        <select id="genre" name="genre" class="dd-native"></select>
        <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" data-placeholder="Sélectionner un genre…">
          <span class="dd-value"></span>
          <span class="dd-chevron" aria-hidden="true"><svg viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1 L5 5 L9 1"/></svg></span>
        </button>
        <div class="dd-menu" role="listbox"></div>
      </div>
      <button type="button" class="autre-btn wave-text" data-target="genre-autre" aria-label="Autre">
        <span class="wave-letter">A</span><span class="wave-letter">u</span><span class="wave-letter">t</span><span class="wave-letter">r</span><span class="wave-letter">e</span>
      </button>
    </div>
    <input type="text" id="genre-autre" name="genre_autre" class="autre-input" placeholder="Saisir le genre" hidden>
  </div>

  <div class="field">
    <label>Famille botanique</label>
    <div class="select-row">
      <div class="dropdown" data-dropdown="famille">
        <select id="famille" name="famille" class="dd-native"></select>
        <button type="button" class="dd-trigger" aria-haspopup="listbox" aria-expanded="false" data-placeholder="Sélectionner une famille…">
          <span class="dd-value"></span>
          <span class="dd-chevron" aria-hidden="true"><svg viewBox="0 0 10 6" width="10" height="6" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1 L5 5 L9 1"/></svg></span>
        </button>
        <div class="dd-menu" role="listbox"></div>
      </div>
      <button type="button" class="autre-btn wave-text" data-target="famille-autre" aria-label="Autre">
        <span class="wave-letter">A</span><span class="wave-letter">u</span><span class="wave-letter">t</span><span class="wave-letter">r</span><span class="wave-letter">e</span>
      </button>
    </div>
    <input type="text" id="famille-autre" name="famille_autre" class="autre-input" placeholder="Saisir la famille" hidden>
  </div>

  <div class="field">
    <span class="label">Exposition</span>
    <div class="radio-group">
      <label class="radio">
        <input type="radio" name="exposition" value="soleil">
        <span class="radio-text wave-text" aria-label="Plein soleil">
          <span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">e</span><span class="wave-letter">i</span><span class="wave-letter">n</span><span class="wave-letter">&nbsp;</span><span class="wave-letter">s</span><span class="wave-letter">o</span><span class="wave-letter">l</span><span class="wave-letter">e</span><span class="wave-letter">i</span><span class="wave-letter">l</span>
        </span>
      </label>
      <label class="radio">
        <input type="radio" name="exposition" value="mi-ombre">
        <span class="radio-text wave-text" aria-label="Mi-ombre">
          <span class="wave-letter">M</span><span class="wave-letter">i</span><span class="wave-letter">-</span><span class="wave-letter">o</span><span class="wave-letter">m</span><span class="wave-letter">b</span><span class="wave-letter">r</span><span class="wave-letter">e</span>
        </span>
      </label>
      <label class="radio">
        <input type="radio" name="exposition" value="ombre">
        <span class="radio-text wave-text" aria-label="Ombre">
          <span class="wave-letter">O</span><span class="wave-letter">m</span><span class="wave-letter">b</span><span class="wave-letter">r</span><span class="wave-letter">e</span>
        </span>

function unionGenres(){
  const s = new Set();
  Object.values(DATA).forEach(c => { if(c.genres) c.genres.forEach(g => s.add(g)); });
  return [...s].sort((a,b)=>a.localeCompare(b,'fr'));
}
function unionFamilles(){
  const s = new Set();
  Object.values(DATA).forEach(c => { if(c.familles) c.familles.forEach(f => s.add(f)); });
  return [...s].sort((a,b)=>a.localeCompare(b,'fr'));
}
function unionSubstrats(){
  const s = new Set();
  Object.values(SUBSTRATS).forEach(arr => arr.forEach(x => s.add(x)));
  return [...s].sort((a,b)=>a.localeCompare(b,'fr'));
}

function populateGenres(c){
  genreSelect.innerHTML = '<option value="">Sélectionner un genre…</option>';
  const list = (c && DATA[c] && DATA[c].genres) ? [...DATA[c].genres] : unionGenres();
  list.sort((a,b)=>a.localeCompare(b,'fr')).forEach(g => {
    const o = document.createElement('option'); o.value = g; o.textContent = g;
    genreSelect.appendChild(o);
  });
}

// ============================================================
// EFFET VAGUE
// ============================================================
const waveInstances = new WeakMap();
function initWave(el, listenerEl){
  const listener = listenerEl || el;
  if(waveInstances.has(listener)) return;
  waveInstances.set(listener, true);
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = Math.max(2.5, fontSize * 0.166);
  const PERIOD = 1200, STAGGER = 100, EASING = 0.12, EPSILON = 0.05;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now){
    if(phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * EASING;
    if(Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    const spans = el.querySelectorAll('.wave-letter');
    for(let i=0;i<spans.length;i++){
      const phase = ((elapsed - i*STAGGER) / PERIOD) * Math.PI * 2;
      spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
    }
    if(amplitude === 0 && targetAmplitude === 0){
      el.querySelectorAll('.wave-letter').forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  function ensure(){ if(rafId === null) rafId = requestAnimationFrame(tick); }
  function start(){ targetAmplitude = AMPLITUDE; ensure(); }
  function stop(){ targetAmplitude = 0; ensure(); }

  listener.addEventListener('mouseenter', start);
  listener.addEventListener('mouseleave', stop);
  listener.addEventListener('focus', start);
  listener.addEventListener('blur', stop);
  listener.addEventListener('touchstart', start, {passive:true});
  listener.addEventListener('touchend', stop, {passive:true});
}

document.querySelectorAll('.wave-text').forEach(el => {
  const listener = el.closest('a, button') || el;
  initWave(el, listener);
});

// DROPDOWN CUSTOM
// ============================================================
const dropdowns = {};
function wrapWaveText(container, text){
  container.innerHTML = '';
  for(const ch of text){
    const span = document.createElement('span');
    span.className = 'wave-letter';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    container.appendChild(span);
  }
}

class Dropdown{
  constructor(root){
    this.root = root;
    this.select = root.querySelector('.dd-native');
    this.trigger = root.querySelector('.dd-trigger');
    this.valueEl = root.querySelector('.dd-value');
    this.menu = root.querySelector('.dd-menu');
    this.items = [];
    this.isOpen = false;
    this.build();
    this.bind();
    initWave(this.valueEl, this.trigger);
  }
  build(){
    this.menu.innerHTML = '';
    this.items = [];
    const walk = (parent, ul) => {
      Array.from(parent.children).forEach(child => {
        if(child.tagName === 'OPTGROUP'){
          const li = document.createElement('li');
          li.className = 'dd-group';
          li.textContent = child.label;
          ul.appendChild(li);
          walk(child, ul);
        } else if(child.tagName === 'OPTION'){
          if(!child.value) return;
          const li = document.createElement('li');
          li.className = 'dd-item';
          li.dataset.value = child.value;
          li.textContent = child.textContent;
          li.setAttribute('role', 'option');
          if(child.selected) li.classList.add('is-selected');
          ul.appendChild(li);
          this.items.push(li);
        }
      });
    };
    walk(this.select, this.menu);
    this.updateValue();
  }
  refresh(){ this.build(); this.close(); }
  updateValue(){
    const sel = this.select.options[this.select.selectedIndex];
    const text = (sel && sel.value) ? sel.textContent : this.trigger.dataset.placeholder;
    wrapWaveText(this.valueEl, text);
  }
  open(){
    if(this.isOpen) return;
    Object.values(dropdowns).forEach(d => {if(d !== this && d.isOpen) d.close();});
    this.isOpen = true;
    this.root.classList.add('is-open');
    this.trigger.setAttribute('aria-expanded', 'true');
    this.items.forEach((item, i) => {item.style.transitionDelay = `${Math.min(i*18, 280)}ms`;});
    requestAnimationFrame(() => {
      const sel = this.menu.querySelector('.is-selected');
      if(sel){
        const mr = this.menu.getBoundingClientRect();
        const sr = sel.getBoundingClientRect();
        if(sr.top < mr.top || sr.bottom > mr.bottom){
          this.menu.scrollTop = sel.offsetTop - this.menu.clientHeight/2;
        }
      }
    });
  }
  close(){
    if(!this.isOpen) return;
    this.isOpen = false;
    this.root.classList.remove('is-open');
    this.trigger.setAttribute('aria-expanded', 'false');
    this.items.forEach(item => {item.style.transitionDelay = '0ms';});
  }
  toggle(){ this.isOpen ? this.close() : this.open(); }
  pick(item){
    this.items.forEach(i => i.classList.remove('is-selected'));
    item.classList.add('is-selected');
    this.select.value = item.dataset.value;
    this.updateValue();
    this.select.dispatchEvent(new Event('change', {bubbles:true}));
    this.close();
  }
  bind(){
    this.trigger.addEventListener('click', e => { e.stopPropagation(); this.toggle(); });
    this.menu.addEventListener('click', e => {
      const item = e.target.closest('.dd-item');
      if(item){ e.stopPropagation(); this.pick(item); }
    });
  }
}

document.querySelectorAll('.dropdown').forEach(root => {
  const key = root.dataset.dropdown;
  dropdowns[key] = new Dropdown(root);
});

document.addEventListener('click', () => Object.values(dropdowns).forEach(d => d.close()));
document.addEventListener('keydown', e => { if(e.key === 'Escape') Object.values(dropdowns).forEach(d => d.close()); });

catSelect.addEventListener('change', () => {
  populateGenres(catSelect.value);
  populateFamilles(catSelect.value);
  populateSubstrats(catSelect.value);
  dropdowns['genre'].refresh();
  dropdowns['famille'].refresh();
  dropdowns['substrat'].refresh();
  document.querySelectorAll('.autre-input').forEach(inp => {inp.hidden = true; inp.value = '';});
  document.querySelectorAll('.autre-btn').forEach(b => b.classList.remove('is-active'));
});

document.querySelectorAll('.autre-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const input = document.getElementById(btn.dataset.target);
    const wasHidden = input.hidden;
    input.hidden = !wasHidden;
    if(wasHidden){ input.focus(); btn.classList.add('is-active'); }
    else { input.value = ''; btn.classList.remove('is-active'); }
  });
});

const tempInput = document.getElementById('temp');
const tempDisplay = document.getElementById('temp-display');
const tempQualifier = document.getElementById('temp-qualifier');
function tempLabel(v){
  if(v <= -15) return 'très rustique';
  if(v <= -5)  return 'rustique';
  if(v <= 5)   return 'semi-rustique';
  if(v <= 12)  return 'frileux';
  return 'tropical';
}
function updateTemp(){
  const v = parseInt(tempInput.value, 10);
  tempDisplay.textContent = (v > 0 ? '+' : '') + v + ' °C';
  tempQualifier.textContent = tempLabel(v);
}
tempInput.addEventListener('input', updateTemp);
updateTemp();

populateFamilles('');
populateSubstrats('');
dropdowns['genre'].refresh();
dropdowns['famille'].refresh();
dropdowns['substrat'].refresh();
