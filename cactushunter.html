<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Cactus-Hunters — Plantouille</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  .leaflet-container { font-family: "Inter", sans-serif; }
  .leaflet-control-attribution { font-size: 10px !important; background: rgba(255, 255, 255, 0.72) !important; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --f-light: rgba(45, 74, 43, 0.14);
    --bronze: #b8860b;
    --parchment: #faf8f2;
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  .page-content {
    max-width: 1040px;
    margin: 0 auto;
    animation: san-pedro-fade-in 1.4s ease-out both;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter { font-style: normal; display: inline-block; }
  h1.wave-text .cactus-gold { color: var(--bronze); }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: var(--bronze) !important;
    font-style: normal !important;
  }

  /* ----- Actions en haut à droite ----- */
  .header-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
    padding-top: 0.4rem;
  }

  .back-link {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    text-decoration: none;
    letter-spacing: 0.02em;
    display: inline-block;
    transition: color 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .back-link:hover {
    color: var(--ch);
    transform: translateX(-4px);
  }

  .add-spot-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    color: var(--cd);
    letter-spacing: 0.02em;
    transition: color 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }

  .add-spot-btn .plus {
    font-style: normal;
    font-size: 1.4rem;
    color: var(--bronze);
    margin-right: 0.35rem;
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
  }

  .add-spot-btn:hover {
    color: var(--ch);
    transform: translateY(-1px);
  }

  .add-spot-btn:hover .plus {
    transform: rotate(90deg) scale(1.15);
    color: var(--cd);
  }

  .add-spot-btn:active {
    transform: scale(0.97);
  }

  /* ===================== BARRE DE FILTRE ===================== */
  .map-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1rem;
    animation: fade-up 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 260px;
    width: 100%;
    border-bottom: 1px solid transparent;
    transition: border-color 0.35s ease;
  }

  .search:focus-within {
    border-bottom-color: var(--bronze);
  }

  .search svg {
    color: var(--f);
    flex-shrink: 0;
    transition: color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .search:focus-within svg {
    color: var(--bronze);
    transform: scale(1.1);
  }

  .search input {
    flex: 1;
    border: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  .map-hint {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--f);
  }

  /* ===================== CARTE BORDS TRANSPARENTS ===================== */
  .map-stage {
    position: relative;
    width: 100%;
    height: 580px;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: grab;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 5%, #000 95%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 5%, #000 95%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 5%, #000 95%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 5%, #000 95%, transparent 100%);
    mask-composite: intersect;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.25s both;
  }

  .map-stage:active {
    cursor: grabbing;
  }

  #world-map {
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
    z-index: 1;
  }
  .leaflet-container { background: transparent; }

  /* Boutons + et - sans cadre, style du site */
  .leaflet-top.leaflet-left {
    top: 1.2rem;
    left: 1.2rem;
  }

  .leaflet-control-zoom {
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .leaflet-control-zoom a {
    width: 30px !important;
    height: 30px !important;
    line-height: 28px !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    color: var(--cd) !important;
    font-family: "Instrument Serif", Georgia, serif !important;
    font-style: italic !important;
    font-size: 1.5rem !important;
    font-weight: 400 !important;
    text-decoration: none !important;
    transition: color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
  }

  .leaflet-control-zoom a:hover {
    background: transparent !important;
    color: var(--bronze) !important;
    transform: scale(1.22) !important;
  }

  .leaflet-control-zoom a:active {
    transform: scale(0.95) !important;
  }

  /* Petite vignette au survol */
  .hover-card {
    position: fixed;
    width: 224px;
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 12px 32px rgba(45, 74, 43, 0.14);
    pointer-events: none;
    z-index: 500;
    display: none;
    animation: card-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .hover-card.is-visible {
    display: block;
  }

  .hover-card-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    background: var(--parchment);
  }

  .hover-card-body {
    padding: 0.75rem 0.9rem;
  }

  .hover-card-plant {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    line-height: 1.15;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  .hover-card-place {
    font-size: 0.78rem;
    color: var(--ch);
    margin-bottom: 0.25rem;
  }

  .hover-card-gps {
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  /* ===================== MODALES (Détails & Ajout) ===================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 1000;
    animation: fade-in 0.3s ease both;
  }

  .modal-backdrop.is-open {
    display: flex;
  }

  .modal-box {
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 24px 60px rgba(45, 74, 43, 0.12);
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 2.2rem;
    animation: modal-rise 0.38s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .modal-close {
    position: absolute;
    top: 1.2rem;
    right: 1.4rem;
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.8rem;
    line-height: 1;
    color: var(--cd);
    cursor: pointer;
    transition: color 0.3s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-close:hover {
    color: var(--bronze);
    transform: rotate(90deg) scale(1.12);
  }

  .modal-close:active {
    transform: rotate(90deg) scale(0.92);
  }

  /* ----- Modale Détails complets + Carrousel ----- */
  .gallery-stage {
    position: relative;
    width: 100%;
    height: 320px;
    background: var(--parchment);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .gallery-stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    animation: photo-reveal 0.35s ease both;
  }

  .gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--f-light);
    color: var(--cd);
    width: 36px;
    height: 36px;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .gallery-nav:hover {
    background: var(--cd);
    color: #ffffff;
    transform: translateY(-50%) scale(1.1);
  }

  .gallery-nav:active {
    transform: translateY(-50%) scale(0.95);
  }

  .gallery-prev { left: 0.8rem; }
  .gallery-next { right: 0.8rem; }

  .gallery-counter {
    position: absolute;
    bottom: 0.7rem;
    right: 0.9rem;
    background: rgba(255, 255, 255, 0.92);
    padding: 0.2rem 0.6rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--cd);
  }

  .detail-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2.2rem;
    line-height: 1.1;
    color: var(--cd);
    margin-bottom: 0.4rem;
  }

  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    font-size: 0.85rem;
    color: var(--ch);
    margin-bottom: 1.4rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--f-light);
  }

  .detail-gps {
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  .detail-story-label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--bronze);
    margin-bottom: 0.4rem;
  }

  .detail-story {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--cd);
    white-space: pre-line;
  }

  /* ----- Modale Formulaire d'ajout ----- */
  .form-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2rem;
    color: var(--cd);
    margin-bottom: 1.4rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .form-group.full {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
  }

  .form-group input,
  .form-group textarea {
    border: none;
    border-bottom: 1px solid var(--f);
    background: transparent;
    font-family: "Inter", sans-serif;
    font-size: 0.92rem;
    color: var(--cd);
    padding: 0.45rem 0;
    transition: border-color 0.3s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-bottom-color: var(--bronze);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.5;
  }

  .gps-helper {
    font-size: 0.78rem;
    color: var(--f);
  }

  .photo-upload-zone {
    border: 1px dashed var(--f);
    padding: 1.1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .photo-upload-zone:hover {
    border-color: var(--bronze);
    transform: translateY(-2px);
  }

  .photo-upload-zone:active {
    transform: scale(0.99);
  }

  .photo-upload-zone span {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--cd);
  }

  .photo-previews {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 0.7rem;
  }

  .photo-previews img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border: 1px solid var(--f-light);
    animation: card-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .form-actions {
    margin-top: 1.6rem;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .btn-submit {
    background: var(--cd);
    color: #ffffff;
    border: none;
    padding: 0.65rem 1.5rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .btn-submit:hover {
    background: var(--ch);
    transform: translateY(-2px);
  }

  .btn-submit:active {
    transform: scale(0.97);
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.2rem; }
    .map-stage { height: 360px; }
    .form-grid { grid-template-columns: 1fr; }
    .modal-box { padding: 1.5rem; }
    .gallery-stage { height: 220px; }
  }

  @keyframes san-pedro-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes modal-rise {
    from { opacity: 0; transform: translateY(14px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes card-pop {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
  @keyframes photo-reveal {
    from { opacity: 0.35; transform: scale(1.02); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <h1 class="wave-text">
        <span class="wave-letter cactus-gold">C</span><span class="wave-letter cactus-gold">a</span><span class="wave-letter cactus-gold">c</span><span class="wave-letter cactus-gold">t</span><span class="wave-letter cactus-gold">u</span><span class="wave-letter cactus-gold">s</span><span class="wave-letter">-</span><span class="wave-letter">H</span><span class="wave-letter">u</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">e</span><span class="wave-letter">r</span><span class="wave-letter">s</span>
      </h1>
      <p class="subtitle">Carnets de terrain du <span class="dr">Dr</span>-Cactus</p>
    </div>

    <div class="header-actions">
      <a href="index.html" class="back-link">← Retour à Plantouille</a>
      <button type="button" class="add-spot-btn" id="open-add-modal">
        <span class="plus">+</span>Marquer une découverte
      </button>
    </div>
  </header>

  <div class="map-toolbar">
    <form class="search" role="search" onsubmit="event.preventDefault();">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
      </svg>
      <input type="search" id="spot-search" placeholder="filtrer une espèce ou un lieu…" aria-label="Filtrer">
    </form>

    <span class="map-hint">Glisser pour déplacer · Molette pour zoomer · Survolez ou cliquez sur un repère</span>
  </div>

  <!-- Carte interactive mondiale en tuiles -->
  <div class="map-stage" id="map-stage">
    <div id="world-map" role="application" aria-label="Carte interactive des découvertes botaniques"></div>
  </div>
</div>

<!-- Vignette flottante au survol -->
<div class="hover-card" id="hover-card">
  <img class="hover-card-img" id="hover-card-img" src="" alt="">
  <div class="hover-card-body">
    <div class="hover-card-plant" id="hover-card-plant"></div>
    <div class="hover-card-place" id="hover-card-place"></div>
    <div class="hover-card-gps" id="hover-card-gps"></div>
  </div>
</div>

<!-- Modale Détails complets + Galerie -->
<div class="modal-backdrop" id="detail-modal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" id="close-detail-modal" aria-label="Fermer">×</button>

    <div class="gallery-stage">
      <img id="detail-img" src="" alt="Photo de la découverte">
      <button type="button" class="gallery-nav gallery-prev" id="gallery-prev" aria-label="Photo précédente">‹</button>
      <button type="button" class="gallery-nav gallery-next" id="gallery-next" aria-label="Photo suivante">›</button>
      <div class="gallery-counter" id="gallery-counter">1 / 1</div>
    </div>

    <h2 class="detail-title" id="detail-plant"></h2>
    <div class="detail-meta">
      <span id="detail-place"></span>
      <span class="detail-gps" id="detail-gps"></span>
    </div>

    <div class="detail-story-label">Récit d'expédition</div>
    <p class="detail-story" id="detail-story"></p>
  </div>
</div>

<!-- Modale Ajout -->
<div class="modal-backdrop" id="add-modal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" id="close-add-modal" aria-label="Fermer">×</button>

    <h2 class="form-title">Nouvelle observation</h2>

    <form id="spot-form">
      <div class="form-grid">
<div class="form-group">
          <label for="input-plant">Nom de la plante</label>
          <input type="text" id="input-plant" required placeholder="ex. Echinopsis pachanoi">
        </div>

        <div class="form-group">
          <label for="input-place">Nom du lieu</label>
          <input type="text" id="input-place" required placeholder="ex. Vallée Sacrée, Pérou">
        </div>

        <div class="form-group">
          <label for="input-lat">Latitude (GPS)</label>
          <input type="number" step="any" id="input-lat" required placeholder="ex. -13.3324">
        </div>

        <div class="form-group">
          <label for="input-lng">Longitude (GPS)</label>
          <input type="number" step="any" id="input-lng" required placeholder="ex. -72.0847">
        </div>

        <div class="form-group full">
          <span class="gps-helper">Astuce : double-cliquez sur un endroit de la carte pour pré-remplir ses coordonnées GPS.</span>
        </div>

        <div class="form-group full">
          <label for="input-photos">Photographies (une ou plusieurs)</label>
          <label class="photo-upload-zone" for="input-photos">
            <span>+ Sélectionner une ou plusieurs photos</span>
          </label>
          <input type="file" id="input-photos" accept="image/*" multiple hidden>
          <div class="photo-previews" id="photo-previews"></div>
        </div>

        <div class="form-group full">
          <label for="input-story">Histoire & notes de terrain</label>
          <textarea id="input-story" required placeholder="Racontez la découverte, l'altitude, le milieu..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Enregistrer sur la carte</button>
      </div>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== ANIMATION VAGUE (h1) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el));

// ==================== CARTE MONDIALE EN TUILES ====================
const mapStage = document.getElementById('map-stage');
if (typeof L === 'undefined') {
  document.getElementById('world-map').innerHTML =
    '<div style="padding:2rem;color:#2d4a2b;text-align:center;font-family:Georgia,serif">La bibliothèque de la carte n’a pas pu être chargée. Vérifie ta connexion internet puis recharge la page.</div>';
  throw new Error('Leaflet indisponible : la carte interactive ne peut pas être initialisée.');
}

const map = L.map('world-map', {
  center: [20, 0],
  zoom: 2,
  minZoom: 2,
  maxZoom: 19,
  worldCopyJump: true,
  zoomControl: true,
  scrollWheelZoom: true,
  doubleClickZoom: false,
  preferCanvas: true
});

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    minZoom: 2,
    maxZoom: 19,
    maxNativeZoom: 19,
    noWrap: false,
    attribution: 'Imagerie © Esri, Maxar, Earthstar Geographics et contributeurs'
  }
).addTo(map);

window.addEventListener('resize', () => map.invalidateSize());

// ==================== DONNÉES & MARQUEURS ====================
const STORAGE_KEY = 'plantouille_cactus_hunters_carte_jpeg_v1';

const defaultSpots = [
  {
    id: 'spot-1',
    plant: 'Carnegiea gigantea',
    place: 'Désert de Sonora, Arizona',
    lat: 32.2967,
    lng: -111.1666,
    photos: [
      'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1463554050456-f2ed7d3fec09?auto=format&fit=crop&w=900&q=80'
    ],
    story: "Observé à l'aube sur un versant rocailleux exposé plein sud. Ce spécimen centenaire présente six bras principaux et un sol granitique très drainant."
  },
  {
    id: 'spot-2',
    plant: 'Echinopsis atacamensis',
    place: 'Quebrada de Humahuaca, Argentine',
    lat: -23.1994,
    lng: -65.3505,
    photos: [
      'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'
    ],
    story: "Découvert à 3 100 mètres d'altitude dans une vallée aride balayée par les vents secs des Andes."
  }
];

function loadSpots() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return [...defaultSpots];

    const savedSpots = JSON.parse(saved);
    if (!Array.isArray(savedSpots)) return [...defaultSpots];

    const byId = new Map(defaultSpots.map(spot => [spot.id, spot]));
    savedSpots.forEach(spot => {
      if (spot && spot.id) byId.set(spot.id, spot);
    });
    return Array.from(byId.values());
  } catch (e) {
    return [...defaultSpots];
  }
}

function saveSpots(spots) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
  } catch (e) {}
}

let spots = loadSpots();

function formatGPS(lat, lng) {
  const latDir = lat >= 0 ? 'N' : 'S';
  const lngDir = lng >= 0 ? 'E' : 'O';
  return `${Math.abs(lat).toFixed(4)}° ${latDir}, ${Math.abs(lng).toFixed(4)}° ${lngDir}`;
}

const hoverCard = document.getElementById('hover-card');
const hoverCardImg = document.getElementById('hover-card-img');
const hoverCardPlant = document.getElementById('hover-card-plant');
const hoverCardPlace = document.getElementById('hover-card-place');
const hoverCardGps = document.getElementById('hover-card-gps');

function positionHoverCard(clientX, clientY) {
  const offset = 18;
  let left = clientX + offset;
  let top = clientY - 40;
  if (left + 235 > window.innerWidth) left = clientX - 242;
  if (top < 12) top = 12;
  if (top + 220 > window.innerHeight) top = window.innerHeight - 230;
  hoverCard.style.left = `${left}px`;
  hoverCard.style.top = `${top}px`;
}

const markersLayer = L.layerGroup().addTo(map);

function renderMarkers(filterText = '') {
  markersLayer.clearLayers();
  const q = filterText.trim().toLowerCase();

  spots.forEach(spot => {
    if (q && !spot.plant.toLowerCase().includes(q) && !spot.place.toLowerCase().includes(q)) return;

    const cover = (spot.photos && spot.photos.length)
      ? spot.photos[0]
      : 'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=600&q=80';

    const marker = L.circleMarker([spot.lat, spot.lng], {
      radius: 6,
      color: '#ffffff',
      weight: 2,
      fillColor: '#2d4a2b',
      fillOpacity: 1,
      bubblingMouseEvents: false
    });

    marker.on('mouseover', (e) => {
      marker.setStyle({ radius: 8, fillColor: '#b8860b' });
      hoverCardImg.src = cover;
      hoverCardPlant.textContent = spot.plant;
      hoverCardPlace.textContent = spot.place;
      hoverCardGps.textContent = formatGPS(spot.lat, spot.lng);
      positionHoverCard(e.originalEvent.clientX, e.originalEvent.clientY);
      hoverCard.classList.add('is-visible');
    });

    marker.on('mousemove', (e) => {
      positionHoverCard(e.originalEvent.clientX, e.originalEvent.clientY);
    });

    marker.on('mouseout', () => {
      marker.setStyle({ radius: 6, fillColor: '#2d4a2b' });
      hoverCard.classList.remove('is-visible');
    });

    marker.on('click', () => {
      hoverCard.classList.remove('is-visible');
      openDetailModal(spot);
    });

    markersLayer.addLayer(marker);
  });
}

renderMarkers();

document.getElementById('spot-search').addEventListener('input', (e) => {
  renderMarkers(e.target.value);
});

map.on('dblclick', (e) => {
  openAddModal(e.latlng.lat, e.latlng.lng);
});

// ==================== MODALE DÉTAILS & CARROUSEL ====================
const detailModal = document.getElementById('detail-modal');
const detailImg = document.getElementById('detail-img');
const detailPlant = document.getElementById('detail-plant');
const detailPlace = document.getElementById('detail-place');
const detailGps = document.getElementById('detail-gps');
const detailStory = document.getElementById('detail-story');
const galleryCounter = document.getElementById('gallery-counter');
const prevBtn = document.getElementById('gallery-prev');
const nextBtn = document.getElementById('gallery-next');

let currentPhotos = [];
let currentPhotoIndex = 0;

function updateGalleryView() {
  detailImg.style.animation = 'none';
  void detailImg.offsetWidth;
  detailImg.style.animation = '';
  detailImg.src = currentPhotos[currentPhotoIndex];
  galleryCounter.textContent = `${currentPhotoIndex + 1} / ${currentPhotos.length}`;
  const multi = currentPhotos.length > 1;
  prevBtn.style.display = multi ? 'flex' : 'none';
  nextBtn.style.display = multi ? 'flex' : 'none';
}

function openDetailModal(spot) {
  currentPhotos = (spot.photos && spot.photos.length)
    ? spot.photos
    : ['https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'];
  currentPhotoIndex = 0;
  detailPlant.textContent = spot.plant;
  detailPlace.textContent = spot.place;
  detailGps.textContent = formatGPS(spot.lat, spot.lng);
  detailStory.textContent = spot.story;
  updateGalleryView();
  detailModal.classList.add('is-open');
}

prevBtn.addEventListener('click', () => {
  currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotos.length) % currentPhotos.length;
  updateGalleryView();
});

nextBtn.addEventListener('click', () => {
  currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotos.length;
  updateGalleryView();
});

document.getElementById('close-detail-modal').addEventListener('click', () => {
  detailModal.classList.remove('is-open');
});

detailModal.addEventListener('click', (e) => {
  if (e.target === detailModal) detailModal.classList.remove('is-open');
});

// ==================== MODALE AJOUTER ====================
const addModal = document.getElementById('add-modal');
const spotForm = document.getElementById('spot-form');
const inputLat = document.getElementById('input-lat');
const inputLng = document.getElementById('input-lng');
const inputPhotos = document.getElementById('input-photos');
const photoPreviews = document.getElementById('photo-previews');

let uploadedPhotosDataUrls = [];

function openAddModal(lat = '', lng = '') {
  if (lat !== '') inputLat.value = Number(lat).toFixed(4);
  if (lng !== '') inputLng.value = Number(lng).toFixed(4);
  addModal.classList.add('is-open');
}

document.getElementById('open-add-modal').addEventListener('click', () => openAddModal());
document.getElementById('close-add-modal').addEventListener('click', () => addModal.classList.remove('is-open'));
addModal.addEventListener('click', (e) => {
  if (e.target === addModal) addModal.classList.remove('is-open');
});

function processImageFile(file, maxWidth = 1000) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

inputPhotos.addEventListener('change', async (e) => {
  for (const file of Array.from(e.target.files)) {
    const dataUrl = await processImageFile(file);
    uploadedPhotosDataUrls.push(dataUrl);
    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    photoPreviews.appendChild(thumb);
  }
});

spotForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const newSpot = {
    id: 'spot-' + Date.now(),
    plant: document.getElementById('input-plant').value.trim(),
    place: document.getElementById('input-place').value.trim(),
    lat: parseFloat(inputLat.value),
    lng: parseFloat(inputLng.value),
    photos: uploadedPhotosDataUrls.length
      ? [...uploadedPhotosDataUrls]
      : ['https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'],
    story: document.getElementById('input-story').value.trim()
  };

  spots.push(newSpot);
  saveSpots(spots);
  renderMarkers(document.getElementById('spot-search').value);

  spotForm.reset();
  uploadedPhotosDataUrls = [];
  photoPreviews.innerHTML = '';
  addModal.classList.remove('is-open');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    detailModal.classList.remove('is-open');
    addModal.classList.remove('is-open');
  }
  if (detailModal.classList.contains('is-open')) {
    if (e.key === 'ArrowLeft') prevBtn.click();
    if (e.key === 'ArrowRight') nextBtn.click();
  }
});
</script>

</body>
</html>
