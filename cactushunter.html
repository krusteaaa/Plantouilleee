<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Cactus-Hunters — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --f-light: rgba(45, 74, 43, 0.14);
    --bronze: #b8860b;
    --parchment: #faf8f2;
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  .page-content {
    max-width: 1040px;
    margin: 0 auto;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter { font-style: normal; }
  h1.wave-text .cactus-gold { color: var(--bronze); }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: var(--bronze) !important;
    font-style: normal !important;
  }

  /* ----- Actions en haut à droite ----- */
  .header-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
    padding-top: 0.4rem;
  }

  .back-link {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    text-decoration: none;
    letter-spacing: 0.02em;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .back-link:hover { color: var(--ch); }

  .add-spot-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    color: var(--cd);
    letter-spacing: 0.02em;
    transition: color 0.35s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }

  .add-spot-btn .plus {
    font-style: normal;
    font-size: 1.4rem;
    color: var(--bronze);
    margin-right: 0.35rem;
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .add-spot-btn:hover { color: var(--ch); }
  .add-spot-btn:hover .plus { transform: rotate(90deg); }

  /* ===================== BARRE DE FILTRE ===================== */
  .map-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1rem;
    animation: fade-up 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 260px;
    width: 100%;
  }

  .search svg { color: var(--f); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  .map-hint {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--f);
  }

  /* ===================== CARTE (carte.jpeg) ===================== */
  .map-stage {
    position: relative;
    width: 100%;
    height: 580px;
    background: #ffffff;
    overflow: hidden;
    user-select: none;
    cursor: grab;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.25s both;
  }

  .map-stage:active {
    cursor: grabbing;
  }

  #world-svg {
    width: 100%;
    height: 100%;
    display: block;
    background: #ffffff;
  }

  /* ===================== MARQUEURS : GROSSISSEMENT & REBOND AU SURVOL ===================== */
  .pin-group {
    cursor: pointer;
  }

  .pin-visual {
    transform-box: fill-box;
    transform-origin: center center;
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .pin-group:hover .pin-visual {
    animation: pin-bounce-grow 0.65s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }

  .pin-pulse {
    fill: rgba(184, 134, 11, 0.22);
    pointer-events: none;
    transition: fill 0.3s ease;
  }

  .pin-group:hover .pin-pulse {
    fill: rgba(184, 134, 11, 0.36);
  }

  .pin-outer {
    fill: var(--cd);
    stroke: #ffffff;
    stroke-width: 2;
    transition: fill 0.25s ease;
  }

  .pin-inner {
    fill: var(--bronze);
    pointer-events: none;
    transition: fill 0.25s ease;
  }

  .pin-group:hover .pin-outer {
    fill: var(--bronze);
  }

  .pin-group:hover .pin-inner {
    fill: #ffffff;
  }

  @keyframes pin-bounce-grow {
    0%   { transform: scale(1) translateY(0); }
    35%  { transform: scale(1.55) translateY(-6px); }
    60%  { transform: scale(1.25) translateY(1px); }
    80%  { transform: scale(1.42) translateY(-2px); }
    100% { transform: scale(1.38) translateY(0); }
  }

  /* Petite vignette au survol */
  .hover-card {
    position: fixed;
    width: 224px;
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 12px 32px rgba(45, 74, 43, 0.14);
    pointer-events: none;
    z-index: 500;
    display: none;
  }

  .hover-card.is-visible {
    display: block;
  }

  .hover-card-img {
    width: 100%;
    height: 120px;
    object-fit: cover;
    display: block;
    background: var(--parchment);
  }

  .hover-card-body {
    padding: 0.75rem 0.9rem;
  }

  .hover-card-plant {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    line-height: 1.15;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  .hover-card-place {
    font-size: 0.78rem;
    color: var(--ch);
    margin-bottom: 0.25rem;
  }

  .hover-card-gps {
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  /* ===================== MODALES (Détails & Ajout) ===================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 1000;
    animation: fade-in 0.3s ease both;
  }

  .modal-backdrop.is-open {
    display: flex;
  }

  .modal-box {
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 24px 60px rgba(45, 74, 43, 0.12);
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 2.2rem;
  }

  .modal-close {
    position: absolute;
    top: 1.2rem;
    right: 1.4rem;
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.8rem;
    line-height: 1;
    color: var(--cd);
    cursor: pointer;
    transition: color 0.3s ease, transform 0.3s ease;
  }

  .modal-close:hover {
    color: var(--bronze);
    transform: rotate(90deg);
  }

  /* ----- Modale Détails complets + Carrousel ----- */
  .gallery-stage {
    position: relative;
    width: 100%;
    height: 320px;
    background: var(--parchment);
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .gallery-stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .gallery-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--f-light);
    color: var(--cd);
    width: 36px;
    height: 36px;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.4rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease;
  }

  .gallery-nav:hover {
    background: var(--cd);
    color: #ffffff;
  }

  .gallery-prev { left: 0.8rem; }
  .gallery-next { right: 0.8rem; }

  .gallery-counter {
    position: absolute;
    bottom: 0.7rem;
    right: 0.9rem;
    background: rgba(255, 255, 255, 0.92);
    padding: 0.2rem 0.6rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--cd);
  }

  .detail-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2.2rem;
    line-height: 1.1;
    color: var(--cd);
    margin-bottom: 0.4rem;
  }

  .detail-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 1.2rem;
    font-size: 0.85rem;
    color: var(--ch);
    margin-bottom: 1.4rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--f-light);
  }

  .detail-gps {
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  .detail-story-label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--bronze);
    margin-bottom: 0.4rem;
  }

  .detail-story {
    font-size: 0.95rem;
    line-height: 1.7;
    color: var(--cd);
    white-space: pre-line;
  }

  /* ----- Modale Formulaire d'ajout ----- */
  .form-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2rem;
    color: var(--cd);
    margin-bottom: 1.4rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .form-group.full {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
  }

  .form-group input,
  .form-group textarea {
    border: none;
    border-bottom: 1px solid var(--f);
    background: transparent;
    font-family: "Inter", sans-serif;
    font-size: 0.92rem;
    color: var(--cd);
    padding: 0.45rem 0;
    transition: border-color 0.3s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-bottom-color: var(--bronze);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.5;
  }

  .gps-helper {
    font-size: 0.78rem;
    color: var(--f);
  }

  .photo-upload-zone {
    border: 1px dashed var(--f);
    padding: 1.1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s ease;
  }

  .photo-upload-zone:hover {
    border-color: var(--bronze);
  }

  .photo-upload-zone span {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--cd);
  }

  .photo-previews {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 0.7rem;
  }

  .photo-previews img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border: 1px solid var(--f-light);
  }

  .form-actions {
    margin-top: 1.6rem;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .btn-submit {
    background: var(--cd);
    color: #ffffff;
    border: none;
    padding: 0.65rem 1.5rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.3s ease;
  }

  .btn-submit:hover {
    background: var(--ch);
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.2rem; }
    .map-stage { height: 360px; }
    .form-grid { grid-template-columns: 1fr; }
    .modal-box { padding: 1.5rem; }
    .gallery-stage { height: 220px; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <h1 class="wave-text">
        <span class="wave-letter cactus-gold">C</span><span class="wave-letter cactus-gold">a</span><span class="wave-letter cactus-gold">c</span><span class="wave-letter cactus-gold">t</span><span class="wave-letter cactus-gold">u</span><span class="wave-letter cactus-gold">s</span><span class="wave-letter">-</span><span class="wave-letter">H</span><span class="wave-letter">u</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">e</span><span class="wave-letter">r</span><span class="wave-letter">s</span>
      </h1>
      <p class="subtitle">Carnets de terrain du <span class="dr">Dr</span>-Cactus</p>
    </div>

    <div class="header-actions">
      <a href="index.html" class="back-link">← Retour à Plantouille</a>
      <button type="button" class="add-spot-btn" id="open-add-modal">
        <span class="plus">+</span>Marquer une découverte
      </button>
    </div>
  </header>

  <div class="map-toolbar">
    <form class="search" role="search" onsubmit="event.preventDefault();">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
      </svg>
      <input type="search" id="spot-search" placeholder="filtrer une espèce ou un lieu…" aria-label="Filtrer">
    </form>

    <span class="map-hint">Glisser pour déplacer · Molette pour zoomer · Survolez ou cliquez sur un repère</span>
  </div>

  <!-- Carte issue de photos.html (carte.jpeg) -->
  <div class="map-stage" id="map-stage">
    <svg id="world-svg" viewBox="0 0 1000 580" preserveAspectRatio="xMidYMid meet">
      <g id="map-viewport">
        <image href="carte.jpeg" x="0" y="0" width="1000" height="580" preserveAspectRatio="xMidYMid meet"/>
        <g id="markers-layer"></g>
      </g>

</div>

<!-- Vignette flottante au survol -->
<div class="hover-card" id="hover-card">
  <img class="hover-card-img" id="hover-card-img" src="" alt="">
  <div class="hover-card-body">
    <div class="hover-card-plant" id="hover-card-plant"></div>
    <div class="hover-card-place" id="hover-card-place"></div>
    <div class="hover-card-gps" id="hover-card-gps"></div>
  </div>
</div>

<!-- Modale Détails complets + Galerie -->
<div class="modal-backdrop" id="detail-modal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" id="close-detail-modal" aria-label="Fermer">×</button>

    <div class="gallery-stage">
      <img id="detail-img" src="" alt="Photo de la découverte">
      <button type="button" class="gallery-nav gallery-prev" id="gallery-prev" aria-label="Photo précédente">‹</button>
      <button type="button" class="gallery-nav gallery-next" id="gallery-next" aria-label="Photo suivante">›</button>
      <div class="gallery-counter" id="gallery-counter">1 / 1</div>
    </div>

    <h2 class="detail-title" id="detail-plant"></h2>
    <div class="detail-meta">
      <span id="detail-place"></span>
      <span class="detail-gps" id="detail-gps"></span>
    </div>

    <div class="detail-story-label">Récit d'expédition</div>
    <p class="detail-story" id="detail-story"></p>
  </div>
</div>

<!-- Modale Ajout -->
<div class="modal-backdrop" id="add-modal" aria-hidden="true">
  <div class="modal-box" role="dialog" aria-modal="true">
    <button type="button" class="modal-close" id="close-add-modal" aria-label="Fermer">×</button>

    <h2 class="form-title">Nouvelle observation</h2>

    <form id="spot-form">
      <div class="form-grid">
        <div class="form-group full">
          <label for="input-map">Carte du monde (carte.jpeg)</label>
          <label class="photo-upload-zone" for="input-map">
            <span>+ Sélectionner carte.jpeg</span>
          </label>
          <input type="file" id="input-map" accept="image/jpeg,image/*" hidden>
        </div>

        <div class="form-group">
          <label for="input-plant">Nom de la plante</label>
          <input type="text" id="input-plant" required placeholder="ex. Echinopsis pachanoi">
        </div>

        <div class="form-group">
          <label for="input-place">Nom du lieu</label>
          <input type="text" id="input-place" required placeholder="ex. Vallée Sacrée, Pérou">
        </div>

        <div class="form-group">
          <label for="input-lat">Latitude (GPS)</label>
          <input type="number" step="any" id="input-lat" required placeholder="ex. -13.3324">
        </div>

        <div class="form-group">
          <label for="input-lng">Longitude (GPS)</label>
          <input type="number" step="any" id="input-lng" required placeholder="ex. -72.0847">
        </div>

        <div class="form-group full">
          <span class="gps-helper">Astuce : double-cliquez sur un endroit de la carte pour pré-remplir ses coordonnées GPS.</span>
        </div>

        <div class="form-group full">
          <label for="input-photos">Photographies (une ou plusieurs)</label>
          <label class="photo-upload-zone" for="input-photos">
            <span>+ Sélectionner une ou plusieurs photos</span>
          </label>
          <input type="file" id="input-photos" accept="image/*" multiple hidden>
          <div class="photo-previews" id="photo-previews"></div>
        </div>

        <div class="form-group full">
          <label for="input-story">Histoire & notes de terrain</label>
          <textarea id="input-story" required placeholder="Racontez la découverte, l'altitude, le milieu..."></textarea>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Enregistrer sur la carte</button>
      </div>
    </form>
  </div>
</div>

<script>
// ==================== ANIMATION VAGUE (h1) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el));

// ==================== CONVERSION COORDONNÉES GPS <-> CARTE (1000 x 580) ====================
const svgEl = document.getElementById('world-svg');
const viewportEl = document.getElementById('map-viewport');
const markersLayer = document.getElementById('markers-layer');
const mapStage = document.getElementById('map-stage');

function lonLatToXY(lon, lat) {
  const x = ((lon + 180) / 360) * 1000;
  const y = ((82 - lat) / 145) * 540 + 20;
  return [x, y];
}

function xyToLonLat(x, y) {
  const lon = (x / 1000) * 360 - 180;
  const lat = 82 - ((y - 20) / 540) * 145;
  return [lat, lon];
}

// ==================== PAN & ZOOM FLUIDE ====================
let scale = 1;
let tx = 0;
let ty = 0;
let isDragging = false;
let dragStartX = 0;
let dragStartY = 0;

function applyTransform() {
  viewportEl.setAttribute('transform', `translate(${tx.toFixed(1)}, ${ty.toFixed(1)}) scale(${scale.toFixed(2)})`);
}

mapStage.addEventListener('mousedown', (e) => {
  if (e.target.closest('.pin-group')) return;
  isDragging = true;
  dragStartX = e.clientX - tx;
  dragStartY = e.clientY - ty;
});

window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  tx = e.clientX - dragStartX;
  ty = e.clientY - dragStartY;
  applyTransform();
});

window.addEventListener('mouseup', () => {
  isDragging = false;
});

mapStage.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = svgEl.getBoundingClientRect();
  const svgX = ((e.clientX - rect.left) / rect.width) * 1000;
  const svgY = ((e.clientY - rect.top) / rect.height) * 580;

  const factor = e.deltaY < 0 ? 1.18 : 0.85;
  const nextScale = Math.min(6, Math.max(1, scale * factor));

  tx = svgX - ((svgX - tx) / scale) * nextScale;
  ty = svgY - ((svgY - ty) / scale) * nextScale;
  scale = nextScale;

  if (scale === 1) { tx = 0; ty = 0; }
  applyTransform();
}, { passive: false });

// ==================== DONNÉES & MARQUEURS ====================
const STORAGE_KEY = 'plantouille_cactus_hunters_carte_jpeg_v1';

const defaultSpots = [
  {
    id: 'spot-1',
    plant: 'Carnegiea gigantea',
    place: 'Désert de Sonora, Arizona',
    lat: 32.2967,
    lng: -111.1666,
    photos: [
      'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1463554050456-f2ed7d3fec09?auto=format&fit=crop&w=900&q=80'
    ],
    story: "Observé à l'aube sur un versant rocailleux exposé plein sud. Ce spécimen centenaire présente six bras principaux et un sol granitique très drainant."
  },
  {
    id: 'spot-2',
    plant: 'Echinopsis atacamensis',
    place: 'Quebrada de Humahuaca, Argentine',
    lat: -23.1994,
    lng: -65.3505,
    photos: [
      'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'
    ],
    story: "Découvert à 3 100 mètres d'altitude dans une vallée aride balayée par les vents secs des Andes."
  }
];

function loadSpots() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : defaultSpots;
  } catch (e) {
    return defaultSpots;
  }
}

function saveSpots(spots) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
  } catch (e) {}
}

let spots = loadSpots();

function formatGPS(lat, lng) {
  const latDir = lat >= 0 ? 'N' : 'S';
  const lngDir = lng >= 0 ? 'E' : 'O';
  return `${Math.abs(lat).toFixed(4)}° ${latDir}, ${Math.abs(lng).toFixed(4)}° ${lngDir}`;
}

const hoverCard = document.getElementById('hover-card');
const hoverCardImg = document.getElementById('hover-card-img');
const hoverCardPlant = document.getElementById('hover-card-plant');
const hoverCardPlace = document.getElementById('hover-card-place');
const hoverCardGps = document.getElementById('hover-card-gps');

function positionHoverCard(clientX, clientY) {
  const offset = 18;
  let left = clientX + offset;
  let top = clientY - 40;
  if (left + 235 > window.innerWidth) left = clientX - 242;
  if (top < 12) top = 12;
  if (top + 220 > window.innerHeight) top = window.innerHeight - 230;
  hoverCard.style.left = `${left}px`;
  hoverCard.style.top = `${top}px`;
}

function renderMarkers(filterText = '') {
  markersLayer.innerHTML = '';
  const q = filterText.trim().toLowerCase();

  spots.forEach(spot => {
    if (q && !spot.plant.toLowerCase().includes(q) && !spot.place.toLowerCase().includes(q)) return;

    const [cx, cy] = lonLatToXY(spot.lng, spot.lat);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'pin-group');
    g.setAttribute('transform', `translate(${cx.toFixed(1)}, ${cy.toFixed(1)})`);

    const visual = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    visual.setAttribute('class', 'pin-visual');

    const pulse = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    pulse.setAttribute('r', '10');
    pulse.setAttribute('class', 'pin-pulse');

    const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    outer.setAttribute('r', '6');
    outer.setAttribute('class', 'pin-outer');

    const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    inner.setAttribute('r', '2.2');
    inner.setAttribute('class', 'pin-inner');

    visual.appendChild(pulse);
    visual.appendChild(outer);
    visual.appendChild(inner);
    g.appendChild(visual);

    const cover = (spot.photos && spot.photos.length)
      ? spot.photos[0]
      : 'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=600&q=80';

    g.addEventListener('mouseenter', (e) => {
      hoverCardImg.src = cover;
      hoverCardPlant.textContent = spot.plant;
      hoverCardPlace.textContent = spot.place;
      hoverCardGps.textContent = formatGPS(spot.lat, spot.lng);
      positionHoverCard(e.clientX, e.clientY);
      hoverCard.classList.add('is-visible');
    });

    g.addEventListener('mousemove', (e) => {
      positionHoverCard(e.clientX, e.clientY);
    });

    g.addEventListener('mouseleave', () => {
      hoverCard.classList.remove('is-visible');
    });

    g.addEventListener('click', (e) => {
      e.stopPropagation();
      hoverCard.classList.remove('is-visible');
      openDetailModal(spot);
    });

    markersLayer.appendChild(g);
  });
}

renderMarkers();

document.getElementById('spot-search').addEventListener('input', (e) => {
  renderMarkers(e.target.value);
});

// Double-clic sur la carte pour pré-remplir les coordonnées GPS
svgEl.addEventListener('dblclick', (e) => {
  if (e.target.closest('.pin-group')) return;
  const rect = svgEl.getBoundingClientRect();
  const svgX = ((e.clientX - rect.left) / rect.width) * 1000;
  const svgY = ((e.clientY - rect.top) / rect.height) * 580;
  const worldX = (svgX - tx) / scale;
  const worldY = (svgY - ty) / scale;
  const [lat, lng] = xyToLonLat(worldX, worldY);

  if (!Number.isNaN(lat) && !Number.isNaN(lng) && lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
    openAddModal(lat, lng);
  }
});

// ==================== MODALE DÉTAILS & CARROUSEL ====================
const detailModal = document.getElementById('detail-modal');
const detailImg = document.getElementById('detail-img');
const detailPlant = document.getElementById('detail-plant');
const detailPlace = document.getElementById('detail-place');
const detailGps = document.getElementById('detail-gps');
const detailStory = document.getElementById('detail-story');
const galleryCounter = document.getElementById('gallery-counter');
const prevBtn = document.getElementById('gallery-prev');
const nextBtn = document.getElementById('gallery-next');

let currentPhotos = [];
let currentPhotoIndex = 0;

function updateGalleryView() {
  detailImg.src = currentPhotos[currentPhotoIndex];
  galleryCounter.textContent = `${currentPhotoIndex + 1} / ${currentPhotos.length}`;
  const multi = currentPhotos.length > 1;
  prevBtn.style.display = multi ? 'flex' : 'none';
  nextBtn.style.display = multi ? 'flex' : 'none';
}

function openDetailModal(spot) {
  currentPhotos = (spot.photos && spot.photos.length)
    ? spot.photos
    : ['https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'];
  currentPhotoIndex = 0;
  detailPlant.textContent = spot.plant;
  detailPlace.textContent = spot.place;
  detailGps.textContent = formatGPS(spot.lat, spot.lng);
  detailStory.textContent = spot.story;
  updateGalleryView();
  detailModal.classList.add('is-open');
}

prevBtn.addEventListener('click', () => {
  currentPhotoIndex = (currentPhotoIndex - 1 + currentPhotos.length) % currentPhotos.length;
  updateGalleryView();
});

nextBtn.addEventListener('click', () => {
  currentPhotoIndex = (currentPhotoIndex + 1) % currentPhotos.length;
  updateGalleryView();
});

document.getElementById('close-detail-modal').addEventListener('click', () => {
  detailModal.classList.remove('is-open');
});

detailModal.addEventListener('click', (e) => {
  if (e.target === detailModal) detailModal.classList.remove('is-open');
});

// ==================== MODALE AJOUTER ====================
const addModal = document.getElementById('add-modal');
const spotForm = document.getElementById('spot-form');
const inputMap = document.getElementById('input-map');
const mapImageEl = document.querySelector('#map-viewport image');
const inputLat = document.getElementById('input-lat');
const inputLng = document.getElementById('input-lng');
const inputPhotos = document.getElementById('input-photos');
const photoPreviews = document.getElementById('photo-previews');

let uploadedPhotosDataUrls = [];

function openAddModal(lat = '', lng = '') {
  if (lat !== '') inputLat.value = Number(lat).toFixed(4);
  if (lng !== '') inputLng.value = Number(lng).toFixed(4);
  addModal.classList.add('is-open');
}

document.getElementById('open-add-modal').addEventListener('click', () => openAddModal());
document.getElementById('close-add-modal').addEventListener('click', () => addModal.classList.remove('is-open'));
addModal.addEventListener('click', (e) => {
  if (e.target === addModal) addModal.classList.remove('is-open');
});

function processImageFile(file, maxWidth = 1000) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

inputMap.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const dataUrl = await processImageFile(file, 1600);
  mapImageEl.setAttribute('href', dataUrl);
});

inputPhotos.addEventListener('change', async (e) => {
  for (const file of Array.from(e.target.files)) {
    const dataUrl = await processImageFile(file);
    uploadedPhotosDataUrls.push(dataUrl);
    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    photoPreviews.appendChild(thumb);
  }
});

spotForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const newSpot = {
    id: 'spot-' + Date.now(),
    plant: document.getElementById('input-plant').value.trim(),
    place: document.getElementById('input-place').value.trim(),
    lat: parseFloat(inputLat.value),
    lng: parseFloat(inputLng.value),
    photos: uploadedPhotosDataUrls.length
      ? [...uploadedPhotosDataUrls]
      : ['https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'],
    story: document.getElementById('input-story').value.trim()
  };

  spots.push(newSpot);
  saveSpots(spots);
  renderMarkers(document.getElementById('spot-search').value);

  spotForm.reset();
  uploadedPhotosDataUrls = [];
  photoPreviews.innerHTML = '';
  addModal.classList.remove('is-open');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    detailModal.classList.remove('is-open');
    addModal.classList.remove('is-open');
  }
  if (detailModal.classList.contains('is-open')) {
    if (e.key === 'ArrowLeft') prevBtn.click();
    if (e.key === 'ArrowRight') nextBtn.click();
  }
});
</script>
