<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Cactus-Hunters — Plantouille</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  .leaflet-container { font-family: "Inter", sans-serif; }
  .leaflet-control-attribution { font-size: 10px !important; background: rgba(255, 255, 255, 0.78) !important; }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --f-light: rgba(45, 74, 43, 0.14);
    --bronze: #b8860b;
    --parchment: #faf8f2;
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  .page-content {
    max-width: 1040px;
    margin: 0 auto;
    animation: san-pedro-fade-in 1.4s ease-out both;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter { font-style: normal; display: inline-block; will-change: transform; }
  h1.wave-text .cactus-gold { color: var(--bronze); }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: var(--bronze) !important;
    font-style: normal !important;
  }

  /* ----- Actions en haut à droite ----- */
  .header-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.6rem;
    padding-top: 0.4rem;
  }

  .back-link {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    text-decoration: none;
    letter-spacing: 0.02em;
    display: inline-block;
    transition: color 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
  }

  .back-link:hover {
    color: var(--ch);
    transform: translateX(-4px);
  }

  .add-spot-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    color: var(--cd);
    letter-spacing: 0.02em;
    transition: color 0.35s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
  }

  .add-spot-btn .plus {
    font-style: normal;
    font-size: 1.4rem;
    color: var(--bronze);
    margin-right: 0.35rem;
    display: inline-block;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.3s ease;
  }

  .add-spot-btn:hover {
    color: var(--ch);
    transform: translateY(-1px);
  }

  .add-spot-btn:hover .plus {
    transform: rotate(90deg) scale(1.15);
    color: var(--cd);
  }

  .add-spot-btn:active {
    transform: scale(0.97);
  }

  /* ===================== BARRE DE FILTRE ===================== */
  .map-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1rem;
    animation: fade-up 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both;
  }

  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    max-width: 260px;
    width: 100%;
    border-bottom: 1px solid transparent;
    transition: border-color 0.35s ease;
  }

  .search:focus-within {
    border-bottom-color: var(--bronze);
  }

  .search svg {
    color: var(--f);
    flex-shrink: 0;
    transition: color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .search:focus-within svg {
    color: var(--bronze);
    transform: scale(1.1);
  }

  .search input {
    flex: 1;
    border: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  .map-hint {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--f);
  }

  /* ===================== CARTE BORDS TRANSPARENTS DOUX ===================== */
  .map-stage {
    position: relative;
    width: 100%;
    height: 580px;
    background: transparent;
    overflow: hidden;
    user-select: none;
    cursor: grab;
    -webkit-mask-image:
      linear-gradient(to right, transparent 0%, #000 1.8%, #000 98.2%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 1.8%, #000 98.2%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image:
      linear-gradient(to right, transparent 0%, #000 1.8%, #000 98.2%, transparent 100%),
      linear-gradient(to bottom, transparent 0%, #000 1.8%, #000 98.2%, transparent 100%);
    mask-composite: intersect;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.25s both;
  }

  .map-stage:active {
    cursor: grabbing;
  }

  #world-map {
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
    z-index: 1;
  }
  .leaflet-container { background: transparent; }

  /* Bouton de lieu à taille fixe (non affecté par le zoom Leaflet) */
  .spot-pin-icon {
    background: transparent !important;
    border: none !important;
  }

  .spot-pin-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--cd);
    border: 2px solid #ffffff;
    box-shadow: 0 2px 6px rgba(45, 74, 43, 0.28);
    cursor: pointer;
    transition: background 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .spot-pin-dot.is-hovered,
  .spot-pin-dot.is-active {
    background: var(--bronze);
    transform: scale(1.28);
  }

  /* Animation lente et douce de focalisation pendant le zoom */
  .zoom-focus-pulse {
    position: fixed;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    border-radius: 50%;
    border: 2px solid var(--bronze);
    background: rgba(184, 134, 11, 0.2);
    pointer-events: none;
    z-index: 450;
    will-change: transform, opacity;
    animation: spot-zoom-expand 3.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .zoom-focus-ring {
    position: fixed;
    width: 44px;
    height: 44px;
    margin-left: -22px;
    margin-top: -22px;
    border-radius: 50%;
    border: 1.5px solid rgba(45, 74, 43, 0.45);
    pointer-events: none;
    z-index: 449;
    will-change: transform, opacity;
    animation: spot-zoom-ring 3.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
  }

  @keyframes spot-zoom-expand {
    0% {
      opacity: 0.9;
      transform: scale(0.75);
      background: rgba(184, 134, 11, 0.25);
    }
    55% {
      opacity: 0.6;
      transform: scale(6.5);
      background: rgba(184, 134, 11, 0.1);
    }
    100% {
      opacity: 0;
      transform: scale(13);
      background: rgba(184, 134, 11, 0);
    }
  }

  @keyframes spot-zoom-ring {
    0% {
      opacity: 0.7;
      transform: scale(0.5);
    }
    65% {
      opacity: 0.35;
      transform: scale(4.5);
    }
    100% {
      opacity: 0;
      transform: scale(9);
    }
  }

  /* Boutons + et - sans cadre, style du site */
  .leaflet-top.leaflet-left {
    top: 1.2rem;
    left: 1.2rem;
  }

  .leaflet-control-zoom {
    border: none !important;
    background: transparent !important;
    box-shadow: none !important;
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }

  .leaflet-control-zoom a {
    width: 30px !important;
    height: 30px !important;
    line-height: 28px !important;
    background: transparent !important;
    border: none !important;
    border-radius: 0 !important;
    color: var(--cd) !important;
    font-family: "Instrument Serif", Georgia, serif !important;
    font-style: italic !important;
    font-size: 1.5rem !important;
    font-weight: 400 !important;
    text-decoration: none !important;
    transition: color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
  }

  .leaflet-control-zoom a:hover {
    background: transparent !important;
    color: var(--bronze) !important;
    transform: scale(1.22) !important;
  }

  .leaflet-control-zoom a:active {
    transform: scale(0.95) !important;
  }

  /* Petite vignette au survol uniquement */
  .hover-preview {
    position: fixed;
    width: 232px;
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 12px 32px rgba(45, 74, 43, 0.14);
    pointer-events: none;
    z-index: 500;
    display: none;
    overflow: hidden;
    opacity: 0;
    transform: translateY(4px) scale(0.97);
    transition: opacity 0.28s ease, transform 0.32s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .hover-preview.is-visible {
    display: block;
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .hover-preview-img-wrap {
    position: relative;
    width: 100%;
    height: 124px;
    background: var(--parchment);
    overflow: hidden;
  }

  .hover-preview-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .hover-preview-body {
    padding: 0.75rem 0.95rem 0.85rem;
  }

  .hover-preview-plant {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    line-height: 1.15;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  .hover-preview-place {
    font-size: 0.78rem;
    color: var(--ch);
    margin-bottom: 0.25rem;
  }

  .hover-preview-gps {
    font-size: 0.7rem;
    letter-spacing: 0.03em;
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  /* Grande fiche détaillée : visible uniquement après clic + fin du zoom */
  .detail-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 900;
    opacity: 0;
    transition: opacity 0.38s ease;
  }

  .detail-backdrop.is-open {
    display: flex;
    opacity: 1;
  }

  .detail-card {
    width: 100%;
    max-width: 640px;
    max-height: calc(100vh - 3rem);
    overflow-y: auto;
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 24px 60px rgba(45, 74, 43, 0.16);
    opacity: 0;
    transform: translateY(16px) scale(0.98);
    transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1), transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .detail-backdrop.is-open .detail-card {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .detail-img-wrap {
    position: relative;
    width: 100%;
    height: 300px;
    background: var(--parchment);
    overflow: hidden;
  }

  .detail-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    opacity: 1;
    transition: opacity 0.32s ease;
  }

  .detail-img.is-swapping {
    opacity: 0.15;
  }

  /* Bouton fermeture sans cadre, parfaitement centré */
  .detail-close {
    position: absolute;
    top: 0.75rem;
    right: 0.85rem;
    width: 34px;
    height: 34px;
    padding: 0;
    border: none;
    background: transparent;
    color: var(--cd);
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.9rem;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color 0.3s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .detail-close span {
    display: block;
    line-height: 1;
    transform: translateY(-1px);
  }

  .detail-close:hover {
    color: var(--bronze);
    transform: rotate(90deg) scale(1.12);
  }

  .detail-close:active {
    transform: rotate(90deg) scale(0.92);
  }

  .detail-nav {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(255, 255, 255, 0.9);
    border: 1px solid var(--f-light);
    color: var(--cd);
    width: 34px;
    height: 34px;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.35rem;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    transition: background 0.25s ease, color 0.25s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .detail-nav.has-multi {
    display: flex;
  }

  .detail-nav:hover {
    background: var(--cd);
    color: #ffffff;
    transform: translateY(-50%) scale(1.1);
  }

  .detail-prev { left: 0.7rem; }
  .detail-next { right: 0.7rem; }

  .detail-counter {
    position: absolute;
    bottom: 0.65rem;
    right: 0.8rem;
    background: rgba(255, 255, 255, 0.92);
    padding: 0.18rem 0.55rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.92rem;
    color: var(--cd);
  }

  .detail-body {
    padding: 1.35rem 1.65rem 1.6rem;
  }

  .detail-plant {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 2.05rem;
    line-height: 1.15;
    color: var(--cd);
    margin-bottom: 0.35rem;
  }

  .detail-meta-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 1rem;
    padding-bottom: 1rem;
    margin-bottom: 1.1rem;
    border-bottom: 1px solid var(--f-light);
  }

  .detail-place {
    font-size: 0.88rem;
    color: var(--ch);
  }

  .detail-gps {
    font-size: 0.82rem;
    letter-spacing: 0.03em;
    color: var(--bronze);
    font-variant-numeric: tabular-nums;
  }

  .detail-story-label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--bronze);
    margin-bottom: 0.35rem;
  }

  .detail-story {
    font-size: 0.92rem;
    line-height: 1.68;
    color: var(--cd);
    white-space: pre-line;
  }

  /* ===================== MODALE AJOUT ===================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.32s ease;
  }

  .modal-backdrop.is-open {
    display: flex;
    opacity: 1;
  }

  .modal-box {
    background: #ffffff;
    border: 1px solid var(--f-light);
    box-shadow: 0 24px 60px rgba(45, 74, 43, 0.12);
    width: 100%;
    max-width: 680px;
    max-height: 90vh;
    overflow-y: auto;
    position: relative;
    padding: 2.2rem;
    opacity: 0;
    transform: translateY(14px) scale(0.98);
    transition: opacity 0.35s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-backdrop.is-open .modal-box {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  .modal-close {
    position: absolute;
    top: 1.2rem;
    right: 1.4rem;
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.8rem;
    line-height: 1;
    color: var(--cd);
    cursor: pointer;
    transition: color 0.3s ease, transform 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .modal-close:hover {
    color: var(--bronze);
    transform: rotate(90deg) scale(1.12);
  }

  .modal-close:active {
    transform: rotate(90deg) scale(0.92);
  }

  .form-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 2rem;
    color: var(--cd);
    margin-bottom: 1.4rem;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .form-group.full {
    grid-column: 1 / -1;
  }

  .form-group label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
  }

  .form-group input,
  .form-group textarea {
    border: none;
    border-bottom: 1px solid var(--f);
    background: transparent;
    font-family: "Inter", sans-serif;
    font-size: 0.92rem;
    color: var(--cd);
    padding: 0.45rem 0;
    transition: border-color 0.3s ease;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-bottom-color: var(--bronze);
  }

  .form-group textarea {
    resize: vertical;
    min-height: 90px;
    line-height: 1.5;
  }

  .gps-helper {
    font-size: 0.78rem;
    color: var(--f);
  }

  .photo-upload-zone {
    border: 1px dashed var(--f);
    padding: 1.1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .photo-upload-zone:hover {
    border-color: var(--bronze);
    transform: translateY(-2px);
  }

  .photo-upload-zone:active {
    transform: scale(0.99);
  }

  .photo-upload-zone span {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--cd);
  }

  .photo-previews {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    margin-top: 0.7rem;
  }

  .photo-previews img {
    width: 64px;
    height: 64px;
    object-fit: cover;
    border: 1px solid var(--f-light);
    animation: card-pop 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  .form-actions {
    margin-top: 1.6rem;
    display: flex;
    justify-content: flex-end;
    align-items: center;
  }

  .btn-submit {
    background: var(--cd);
    color: #ffffff;
    border: none;
    padding: 0.65rem 1.5rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: background 0.3s ease, transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .btn-submit:hover {
    background: var(--ch);
    transform: translateY(-2px);
  }

  .btn-submit:active {
    transform: scale(0.97);
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.2rem; }
    .map-stage { height: 360px; }
    .form-grid { grid-template-columns: 1fr; }
    .modal-box { padding: 1.5rem; }
    .detail-img-wrap { height: 220px; }
    .detail-body { padding: 1.1rem 1.2rem 1.3rem; }
  }

  @keyframes san-pedro-fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes card-pop {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <h1 class="wave-text">

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ==================== ANIMATION VAGUE (h1) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el));

// ==================== CARTE MONDIALE EN TUILES ====================
const mapStage = document.getElementById('map-stage');
if (typeof L === 'undefined') {
  document.getElementById('world-map').innerHTML =
    '<div style="padding:2rem;color:#2d4a2b;text-align:center;font-family:Georgia,serif">La bibliothèque de la carte n’a pas pu être chargée. Vérifie ta connexion internet puis recharge la page.</div>';
  throw new Error('Leaflet indisponible : la carte interactive ne peut pas être initialisée.');
}

const map = L.map('world-map', {
  center: [20, 0],
  zoom: 2,
  minZoom: 2,
  maxZoom: 19,
  worldCopyJump: true,
  zoomControl: true,
  scrollWheelZoom: true,
  doubleClickZoom: false,
  preferCanvas: true
});

L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    minZoom: 2,
    maxZoom: 19,
    maxNativeZoom: 19,
    noWrap: false,
    attribution: 'Imagerie © Esri, Maxar, Earthstar Geographics et contributeurs'
  }
).addTo(map);

window.addEventListener('resize', () => map.invalidateSize());

// ==================== DONNÉES & MARQUEURS ====================
const STORAGE_KEY = 'plantouille_cactus_hunters_carte_jpeg_v1';
const FALLBACK_PHOTO = 'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80';

const defaultSpots = [
  {
    id: 'spot-1',
    plant: 'Carnegiea gigantea',
    place: 'Désert de Sonora, Arizona',
    lat: 32.2967,
    lng: -111.1666,
    photos: [
      'https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1463554050456-f2ed7d3fec09?auto=format&fit=crop&w=900&q=80'
    ],
    story: "Observé à l'aube sur un versant rocailleux exposé plein sud. Ce spécimen centenaire présente six bras principaux et un sol granitique très drainant."
  },
  {
    id: 'spot-2',
    plant: 'Echinopsis atacamensis',
    place: 'Quebrada de Humahuaca, Argentine',
    lat: -23.1994,
    lng: -65.3505,
    photos: [
      'https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=900&q=80',
      'https://images.unsplash.com/photo-1459411552884-841db9b3cc2a?auto=format&fit=crop&w=900&q=80'
    ],
    story: "Découvert à 3 100 mètres d'altitude dans une vallée aride balayée par les vents secs des Andes."
  }
];

function loadSpots() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return [...defaultSpots];

    const savedSpots = JSON.parse(saved);
    if (!Array.isArray(savedSpots)) return [...defaultSpots];

    const byId = new Map(defaultSpots.map(spot => [spot.id, spot]));
    savedSpots.forEach(spot => {
      if (spot && spot.id) byId.set(spot.id, spot);
    });
    return Array.from(byId.values());
  } catch (e) {
    return [...defaultSpots];
  }
}

function saveSpots(spots) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(spots));
  } catch (e) {}
}

let spots = loadSpots();

function formatGPS(lat, lng) {
  const latDir = lat >= 0 ? 'N' : 'S';
  const lngDir = lng >= 0 ? 'E' : 'O';
  return `${Math.abs(lat).toFixed(4)}° ${latDir}, ${Math.abs(lng).toFixed(4)}° ${lngDir}`;
}

function getSpotPhotos(spot) {
  return (spot.photos && spot.photos.length) ? spot.photos : [FALLBACK_PHOTO];
}

// ==================== VIGNETTE SURVOL & GRANDE FICHE CLIC ====================
const hoverPreview = document.getElementById('hover-preview');
const hoverPreviewImg = document.getElementById('hover-preview-img');
const hoverPreviewPlant = document.getElementById('hover-preview-plant');
const hoverPreviewPlace = document.getElementById('hover-preview-place');
const hoverPreviewGps = document.getElementById('hover-preview-gps');

const detailBackdrop = document.getElementById('detail-backdrop');
const detailImg = document.getElementById('detail-img');
const detailPlant = document.getElementById('detail-plant');
const detailPlace = document.getElementById('detail-place');
const detailGps = document.getElementById('detail-gps');
const detailStory = document.getElementById('detail-story');
const detailCloseBtn = document.getElementById('detail-close');
const detailPrevBtn = document.getElementById('detail-prev');
const detailNextBtn = document.getElementById('detail-next');
const detailCounter = document.getElementById('detail-counter');

let activeDotEl = null;
let detailPhotos = [];
let detailPhotoIndex = 0;
let isDetailOpen = false;
let isZoomingToSpot = false;
let previewHideTimer = null;

function setActiveDot(dotEl) {
  if (activeDotEl && activeDotEl !== dotEl) {
    activeDotEl.classList.remove('is-active');
  }
  activeDotEl = dotEl || null;
  if (activeDotEl) {
    activeDotEl.classList.add('is-active');
  }
}

function clearActiveDot() {
  if (activeDotEl) {
    activeDotEl.classList.remove('is-active', 'is-hovered');
    activeDotEl = null;
  }
}

function positionHoverPreview(clientX, clientY) {
  const offset = 18;
  let left = clientX + offset;
  let top = clientY - 36;
  if (left + 244 > window.innerWidth) left = clientX - 250;
  if (top < 12) top = 12;
  if (top + 240 > window.innerHeight) top = window.innerHeight - 252;
  hoverPreview.style.left = `${left}px`;
  hoverPreview.style.top = `${top}px`;
}

function showHoverPreview(spot, clientX, clientY, dotEl = null) {
  if (isDetailOpen || isZoomingToSpot) return;
  clearTimeout(previewHideTimer);
  if (dotEl) setActiveDot(dotEl);
  const photos = getSpotPhotos(spot);
  hoverPreviewImg.src = photos[0];
  hoverPreviewPlant.textContent = spot.plant;
  hoverPreviewPlace.textContent = spot.place;
  hoverPreviewGps.textContent = formatGPS(spot.lat, spot.lng);
  positionHoverPreview(clientX, clientY);
  hoverPreview.classList.add('is-visible');
}

function hideHoverPreview() {
  clearTimeout(previewHideTimer);
  hoverPreview.classList.remove('is-visible');
  previewHideTimer = setTimeout(() => {
    if (!hoverPreview.classList.contains('is-visible')) {
      hoverPreview.style.display = 'none';
    }
  }, 300);
}

function showHoverPreviewImmediate(spot, clientX, clientY, dotEl = null) {
  if (isDetailOpen || isZoomingToSpot) return;
  clearTimeout(previewHideTimer);
  hoverPreview.style.display = 'block';
  void hoverPreview.offsetWidth;
  showHoverPreview(spot, clientX, clientY, dotEl);
}

function hideHoverPreviewImmediate() {
  clearTimeout(previewHideTimer);
  hoverPreview.classList.remove('is-visible');
  hoverPreview.style.display = 'none';
}

function renderDetailPhoto(smooth = false) {
  if (!detailPhotos.length) return;
  const nextSrc = detailPhotos[detailPhotoIndex];
  if (smooth && detailImg.src !== nextSrc) {
    detailImg.classList.add('is-swapping');
    setTimeout(() => {
      detailImg.src = nextSrc;
      detailImg.onload = () => detailImg.classList.remove('is-swapping');
      if (detailImg.complete) detailImg.classList.remove('is-swapping');
    }, 110);
  } else {
    detailImg.classList.remove('is-swapping');
    detailImg.src = nextSrc;
  }
  detailCounter.textContent = `${detailPhotoIndex + 1} / ${detailPhotos.length}`;
  const multi = detailPhotos.length > 1;
  detailPrevBtn.classList.toggle('has-multi', multi);
  detailNextBtn.classList.toggle('has-multi', multi);
}

function openDetailCard(spot, dotEl = null) {
  if (!spot || isDetailOpen) return;
  hideHoverPreviewImmediate();
  if (dotEl) setActiveDot(dotEl);

  detailPhotos = getSpotPhotos(spot);
  detailPhotoIndex = 0;
  renderDetailPhoto(false);
  detailPlant.textContent = spot.plant;
  detailPlace.textContent = spot.place;
  detailGps.textContent = formatGPS(spot.lat, spot.lng);
  detailStory.textContent = spot.story;

  detailBackdrop.style.display = 'flex';
  detailBackdrop.setAttribute('aria-hidden', 'false');
  void detailBackdrop.offsetWidth;
  detailBackdrop.classList.add('is-open');
  isDetailOpen = true;
}

function closeDetailCard() {
  if (!isDetailOpen) return;
  isDetailOpen = false;
  detailBackdrop.classList.remove('is-open');
  detailBackdrop.setAttribute('aria-hidden', 'true');
  hideHoverPreviewImmediate();
  clearActiveDot();
  setTimeout(() => {
    if (!isDetailOpen) {
      detailBackdrop.style.display = 'none';
    }
  }, 420);
}

detailCloseBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  closeDetailCard();
});

detailBackdrop.addEventListener('click', (e) => {
  if (e.target === detailBackdrop) {
    closeDetailCard();
  }
});

detailPrevBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!detailPhotos.length) return;
  detailPhotoIndex = (detailPhotoIndex - 1 + detailPhotos.length) % detailPhotos.length;
  renderDetailPhoto(true);
});

detailNextBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  if (!detailPhotos.length) return;
  detailPhotoIndex = (detailPhotoIndex + 1) % detailPhotos.length;
  renderDetailPhoto(true);
});

// ==================== ZOOM LENT ET FLUIDE AU CLIC ====================
let zoomSequenceTimer = null;
let zoomPulseEl = null;
let zoomRingEl = null;
let pendingMoveEndHandler = null;

function cleanupZoomEffect() {
  clearTimeout(zoomSequenceTimer);
  zoomSequenceTimer = null;
  if (pendingMoveEndHandler) {
    map.off('moveend', pendingMoveEndHandler);
    pendingMoveEndHandler = null;
  }
  if (zoomPulseEl) {
    zoomPulseEl.remove();
    zoomPulseEl = null;
  }
  if (zoomRingEl) {
    zoomRingEl.remove();
    zoomRingEl = null;
  }
}

function spawnZoomPulse(latlng) {
  const pt = map.latLngToContainerPoint(latlng);
  const rect = mapStage.getBoundingClientRect();
  const x = rect.left + pt.x;
  const y = rect.top + pt.y;

  const ring = document.createElement('div');
  ring.className = 'zoom-focus-ring';
  ring.style.left = `${x}px`;
  ring.style.top = `${y}px`;
  document.body.appendChild(ring);
  zoomRingEl = ring;

  const pulse = document.createElement('div');
  pulse.className = 'zoom-focus-pulse';
  pulse.style.left = `${x}px`;
  pulse.style.top = `${y}px`;
  document.body.appendChild(pulse);
  zoomPulseEl = pulse;

  pulse.addEventListener('animationend', () => {
    if (pulse.parentNode) pulse.remove();
    if (zoomPulseEl === pulse) zoomPulseEl = null;
  }, { once: true });

  ring.addEventListener('animationend', () => {
    if (ring.parentNode) ring.remove();
    if (zoomRingEl === ring) zoomRingEl = null;
  }, { once: true });
}

function focusSpotThenOpenDetail(spot, latlng, dotEl = null) {
  cleanupZoomEffect();
  if (isDetailOpen) {
    isDetailOpen = false;
    detailBackdrop.classList.remove('is-open');
    detailBackdrop.style.display = 'none';
  }
  hideHoverPreviewImmediate();
  isZoomingToSpot = true;
  if (dotEl) setActiveDot(dotEl);
  spawnZoomPulse(latlng);

  const maxZoom = map.getMaxZoom();
  const targetLatLng = L.latLng(spot.lat, spot.lng);

  const revealDetailAfterZoom = () => {
    cleanupZoomEffect();
    isZoomingToSpot = false;
    openDetailCard(spot, dotEl);
  };

  if (map.getZoom() === maxZoom && map.getCenter().distanceTo(targetLatLng) < 1) {
    zoomSequenceTimer = setTimeout(revealDetailAfterZoom, 700);
    return;
  }

  pendingMoveEndHandler = revealDetailAfterZoom;
  map.once('moveend', pendingMoveEndHandler);

  map.flyTo(targetLatLng, maxZoom, {
    animate: true,
    duration: 4.2,
    easeLinearity: 0.08
  });

  zoomSequenceTimer = setTimeout(revealDetailAfterZoom, 4650);
}

const markersLayer = L.layerGroup().addTo(map);

function renderMarkers(filterText = '') {
  markersLayer.clearLayers();
  const q = filterText.trim().toLowerCase();

  spots.forEach(spot => {
    if (q && !spot.plant.toLowerCase().includes(q) && !spot.place.toLowerCase().includes(q)) return;

    const icon = L.divIcon({
      className: 'spot-pin-icon',
      html: '<div class="spot-pin-dot"></div>',
      iconSize: [14, 14],
      iconAnchor: [7, 7]
    });

    const marker = L.marker([spot.lat, spot.lng], {
      icon,
      bubblingMouseEvents: false
    });

    marker.on('add', () => {
      const el = marker.getElement();
      const dot = el ? el.querySelector('.spot-pin-dot') : null;
      if (!dot) return;

      dot.addEventListener('mouseenter', (e) => {
        dot.classList.add('is-hovered');
        if (isDetailOpen || isZoomingToSpot) return;
        showHoverPreviewImmediate(spot, e.clientX, e.clientY, dot);
      });

      dot.addEventListener('mousemove', (e) => {
        if (isDetailOpen || isZoomingToSpot) return;
        if (!hoverPreview.classList.contains('is-visible')) {
          showHoverPreviewImmediate(spot, e.clientX, e.clientY, dot);
        } else {
          positionHoverPreview(e.clientX, e.clientY);
        }
      });

      dot.addEventListener('mouseleave', () => {
        dot.classList.remove('is-hovered');
        hideHoverPreview();
        if (!isDetailOpen && !isZoomingToSpot && activeDotEl === dot) {
          dot.classList.remove('is-active');
          activeDotEl = null;
        }
      });

      dot.addEventListener('click', (e) => {
        e.stopPropagation();
        focusSpotThenOpenDetail(spot, marker.getLatLng(), dot);
      });
    });

    markersLayer.addLayer(marker);
  });
}

renderMarkers();

document.getElementById('spot-search').addEventListener('input', (e) => {
  renderMarkers(e.target.value);
});

map.on('dblclick', (e) => {
  openAddModal(e.latlng.lat, e.latlng.lng);
});

// ==================== MODALE AJOUTER ====================
const addModal = document.getElementById('add-modal');
const spotForm = document.getElementById('spot-form');
const inputLat = document.getElementById('input-lat');
const inputLng = document.getElementById('input-lng');
const inputPhotos = document.getElementById('input-photos');
const photoPreviews = document.getElementById('photo-previews');

let uploadedPhotosDataUrls = [];

function openAddModal(lat = '', lng = '') {
  closeDetailCard();
  hideHoverPreviewImmediate();
  if (lat !== '') inputLat.value = Number(lat).toFixed(4);
  if (lng !== '') inputLng.value = Number(lng).toFixed(4);
  addModal.style.display = 'flex';
  addModal.setAttribute('aria-hidden', 'false');
  void addModal.offsetWidth;
  addModal.classList.add('is-open');
}

function closeAddModal() {
  addModal.classList.remove('is-open');
  addModal.setAttribute('aria-hidden', 'true');
  setTimeout(() => {
    if (!addModal.classList.contains('is-open')) {
      addModal.style.display = 'none';
    }
  }, 360);
}

document.getElementById('open-add-modal').addEventListener('click', () => openAddModal());
document.getElementById('close-add-modal').addEventListener('click', () => closeAddModal());
addModal.addEventListener('click', (e) => {
  if (e.target === addModal) closeAddModal();
});

function processImageFile(file, maxWidth = 1000) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });
}

inputPhotos.addEventListener('change', async (e) => {
  for (const file of Array.from(e.target.files)) {
    const dataUrl = await processImageFile(file);
    uploadedPhotosDataUrls.push(dataUrl);
    const thumb = document.createElement('img');
    thumb.src = dataUrl;
    photoPreviews.appendChild(thumb);
  }
});

spotForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const newSpot = {
    id: 'spot-' + Date.now(),
    plant: document.getElementById('input-plant').value.trim(),
    place: document.getElementById('input-place').value.trim(),
    lat: parseFloat(inputLat.value),
    lng: parseFloat(inputLng.value),
    photos: uploadedPhotosDataUrls.length
      ? [...uploadedPhotosDataUrls]
      : [FALLBACK_PHOTO],
    story: document.getElementById('input-story').value.trim()
  };

  spots.push(newSpot);
  saveSpots(spots);
  renderMarkers(document.getElementById('spot-search').value);

  spotForm.reset();
  uploadedPhotosDataUrls = [];
  photoPreviews.innerHTML = '';
  closeAddModal();
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeDetailCard();
    closeAddModal();
  }
  if (isDetailOpen) {
    if (e.key === 'ArrowLeft') detailPrevBtn.click();
    if (e.key === 'ArrowRight') detailNextBtn.click();
  }
});
</script>

</body>
</html>
