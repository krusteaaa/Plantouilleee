<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Galerie — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --bronze: #b8860b;
    --hairline: rgba(45, 74, 43, 0.16);
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  .page-content {
    max-width: 800px;
    margin: 0 auto;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .brand-title-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter {
    display: inline-block;
    font-style: normal;
    will-change: transform;
  }

  h1.wave-text .l-bronze {
    color: #b8860b;
    -webkit-text-fill-color: #b8860b;
  }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: #b8860b !important;
    -webkit-text-fill-color: #b8860b !important;
    background: transparent !important;
    font-style: normal !important;
  }

  /* ----- Barre de recherche ----- */
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--f); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  /* ----- Actions en haut à droite + Menu + absolu ----- */
  .header-actions {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
    padding-top: 0.4rem;
  }

  .plus-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    cursor: pointer;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    padding: 0;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .plus-btn .plus {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-size: 1.3rem;
    margin-right: 0.3rem;
    vertical-align: -0.05em;
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .plus-btn:hover,
  .plus-btn:focus {
    color: var(--ch);
  }

  .plus-btn[aria-expanded="true"] .plus {
    transform: rotate(45deg);
  }

  .plus-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 0.5rem;
    background: var(--bg);
    border: 1px solid var(--hairline);
    padding: 0.65rem 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
    min-width: 165px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .plus-menu.is-open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .menu-item-link {
    display: inline-block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--cd);
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.35s ease, opacity 0.8s ease, transform 0.8s ease;
  }

  .menu-item-link:hover,
  .menu-item-link:focus {
    color: var(--ch);
  }

  .menu-item-link .word {
    display: inline-flex;
    align-items: baseline;
  }

  .menu-item-link .word > span {
    display: inline-block;
    will-change: transform;
  }

  .menu-item-link.is-fading {
    opacity: 0;
    pointer-events: none;
  }

  .menu-item-link.is-leaving {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-14px);
  }

  /* ===================== LOGO ===================== */
  .brand-logo {
    display: block;
    margin: 1rem auto 2.5rem;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 600px;
    object-fit: contain;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  /* ===================== GALERIE ANNÉES & VIGNETTES ===================== */
  .gallery-section {
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  }

  .gallery-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 2rem;
  }

  .year-buttons {
    display: flex;
    align-items: baseline;
    gap: 1.75rem;
    flex-wrap: wrap;
  }

  .year-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 4.5vw, 2.85rem);
    line-height: 1.1;
    color: var(--f);
    cursor: pointer;
    padding: 0;
    transition: color 0.35s ease, transform 0.35s ease;
  }

  .year-btn:hover,
  .year-btn:focus,
  .year-btn.is-active {
    color: var(--cd);
  }

  .year-btn.is-active {
    text-decoration: underline;
    text-underline-offset: 6px;
    text-decoration-thickness: 1px;
  }

  .gallery-controls {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
  }

  .action-text-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--cd);
    cursor: pointer;
    padding: 0;
    transition: color 0.3s ease;
  }

  .action-text-btn:hover,
  .action-text-btn:focus {
    color: var(--ch);
  }

  .action-text-btn.is-unlocked {
    color: var(--bronze);
  }

  .thumb-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 2rem;
  }

  .thumb-card {
    position: relative;
    border: 1px solid var(--hairline);
    background: var(--bg);
    overflow: hidden;
    transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.35s ease;
  }

  .thumb-card:hover {
    transform: translateY(-4px);
    border-color: var(--cd);
    box-shadow: 0 14px 32px rgba(45, 74, 43, 0.08);
  }

  .thumb-open-btn {
    display: block;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }

  .thumb-frame {
    aspect-ratio: 4 / 3;
    width: 100%;
    overflow: hidden;
    background: rgba(45, 74, 43, 0.03);
  }

  .thumb-frame img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.65s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .thumb-card:hover .thumb-frame img {
    transform: scale(1.035);
  }

  .thumb-caption {
    padding: 0.75rem 0.9rem;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    border-top: 1px solid var(--hairline);
  }

  .thumb-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.25rem;
    color: var(--cd);
  }

  .thumb-year {
    font-size: 0.78rem;
    color: var(--f);
    white-space: nowrap;
  }

  .thumb-delete-btn {
    display: none;
    position: absolute;
    top: 0.75rem;
    right: 0.75rem;
    z-index: 5;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid var(--bronze);
    color: var(--bronze);
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    padding: 0.2rem 0.65rem;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .thumb-delete-btn:hover {
    background: var(--bronze);
    color: var(--bg);
  }

  body.is-unlocked .thumb-delete-btn {
    display: inline-block;
  }

  .empty-gallery {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.35rem;
    color: var(--f);
    padding: 1.5rem 0;
  }

  /* ===================== VISIONNEUSE GRAND FORMAT ===================== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.97);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 4.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lightbox.is-open {
    opacity: 1;
    pointer-events: auto;
  }

  .lightbox-close {
    position: fixed;
    top: 1.75rem;
    right: 2.25rem;
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--cd);
    cursor: pointer;
    z-index: 110;
    transition: color 0.3s ease, transform 0.3s ease;
  }

  .lightbox-close:hover {
    color: var(--ch);
    transform: scale(1.06);
  }

  .lightbox-nav {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: 1px solid var(--hairline);
    width: 48px;
    height: 48px;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.6rem;
    color: var(--cd);
    cursor: pointer;
    z-index: 110;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
  }

  .lightbox-nav:hover {
    border-color: var(--cd);
    color: var(--ch);
  }

  .lightbox-prev { left: 1.5rem; }
  .lightbox-next { right: 1.5rem; }

  .lightbox-stage {
    max-width: 920px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }

  .lightbox-media-wrap {
    width: 100%;
    max-height: 76vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .lightbox-img {
    max-width: 100%;
    max-height: 75vh;
    object-fit: contain;
    display: block;
    transition: opacity 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lightbox-img.is-swapping-next {
    opacity: 0;
    transform: translateX(28px) scale(0.985);
  }

  .lightbox-img.is-swapping-prev {
    opacity: 0;
    transform: translateX(-28px) scale(0.985);
  }

  .lightbox-caption {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.4rem;
    color: var(--cd);
    text-align: center;
    transition: opacity 0.3s ease;
  }

  .lightbox-counter {
    font-size: 0.8rem;
    color: var(--f);
    letter-spacing: 0.05em;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 768px) {
    .brand-logo {
      display: block;
      width: 150vw;
      max-width: none;
      max-height: none;
      height: auto;
      margin-left: calc(50% - 75vw);
      margin-right: calc(50% - 75vw);
      object-fit: contain;
    }
    .thumb-grid {
      grid-template-columns: 1fr;
    }
    .lightbox {
      padding: 4rem 1.25rem 2rem;
    }
    .lightbox-nav {
      top: auto;
      bottom: 1.25rem;
      transform: none;
    }
    .lightbox-prev { left: 1.25rem; }
    .lightbox-next { right: 1.25rem; }
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.5rem; }
    .header { margin-bottom: 1.5rem; gap: 1.5rem; }
    h1.wave-text { font-size: 2.75rem; }
    .subtitle { font-size: 1.1rem; }
    .search { max-width: none; width: 100%; }
    .plus-btn { font-size: 1rem; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .gallery-section, .brand-logo { animation: none !important; opacity: 1; transform: none; }
    .plus-menu, .menu-item-link, .thumb-card, .thumb-frame img, .lightbox, .lightbox-img { transition: none; }
    .plus-btn[aria-expanded="true"] .plus { transform: none; }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <a href="page2.html" class="brand-title-link" aria-label="Retour à Plantouille (page2.html)">
        <h1 class="wave-text"><span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter l-bronze">l</span><span class="wave-letter">l</span><span class="wave-letter">e</span></h1>

        </a>
        <a href="livre.html" class="menu-item-link">
          <span class="word" aria-label="Livre d'or">
            <span>L</span><span>i</span><span>v</span><span>r</span><span>e</span><span> </span><span>d</span><span>'</span><span>o</span><span>r</span>

  <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">

  <div class="lightbox-stage">
    <div class="lightbox-media-wrap">
      <img src="" alt="" class="lightbox-img" id="lightboxImg">
    </div>
    <p class="lightbox-caption" id="lightboxCaption"></p>
    <span class="lightbox-counter" id="lightboxCounter"></span>
  </div>
</div>

<script>
// ==================== ANIMATION VAGUE TITRE (h1) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el.closest('button, a') || el));

// ==================== MENU + ET LIENS ====================
(function () {
  var plusToggle = document.getElementById('plusToggle');
  var plusMenu = document.getElementById('plusMenu');

  function setMenuOpen(open) {
    plusToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    plusMenu.classList.toggle('is-open', open);
  }

  plusToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = plusToggle.getAttribute('aria-expanded') === 'true';
    setMenuOpen(!isOpen);
  });

  document.addEventListener('click', function (e) {
    if (!plusMenu.contains(e.target) && !plusToggle.contains(e.target)) {
      setMenuOpen(false);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setMenuOpen(false);
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var PERIOD = 1600, STAGGER = 110, EASING = 0.12, EPSILON = 0.05;
  var animItems = document.querySelectorAll('.menu-item-link');

  animItems.forEach(function (item) {
    var spans = item.querySelectorAll('.word > span');
    var fontSize = parseFloat(getComputedStyle(item).fontSize) || 17;
    var maxAmplitude = fontSize * 0.18;
    var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

    function tick(now) {
      if (phaseStart === null) phaseStart = now;
      amplitude += (targetAmplitude - amplitude) * EASING;
      if (Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;

      var elapsed = now - phaseStart;
      for (var i = 0; i < spans.length; i++) {
        var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
        spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
      }
      if (amplitude === 0 && targetAmplitude === 0) {
        for (var j = 0; j < spans.length; j++) spans[j].style.transform = '';
        phaseStart = null;
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function ensureRunning() { if (rafId === null) rafId = requestAnimationFrame(tick); }
    function start() { targetAmplitude = maxAmplitude; ensureRunning(); }
    function stop() { targetAmplitude = 0; ensureRunning(); }

    item.addEventListener('mouseenter', start);
    item.addEventListener('mouseleave', stop);
    item.addEventListener('focus', start);
    item.addEventListener('blur', stop);
    item.addEventListener('touchstart', start, { passive: true });
    item.addEventListener('touchend', stop, { passive: true });
  });

  var navigating = false;
  animItems.forEach(function (item) {
    item.addEventListener('click', function (e) {
      if (navigating) { e.preventDefault(); return; }
      var href = item.getAttribute('href');
      if (!href || href === '#') return;
      navigating = true;
      e.preventDefault();

      animItems.forEach(function (other) {
        if (other !== item) other.classList.add('is-fading');
      });

      setTimeout(function () {
        item.classList.add('is-leaving');
      }, 450);

      setTimeout(function () {
        window.location.href = href;
      }, 1150);
    });
  });
})();

// ==================== GALERIE, AJOUT PHOTOS, VERROU & VISIONNEUSE ====================
(function () {
  var STORAGE_KEY = 'plantouille_galerie_photos_v1';

  function makePlaceholderSvg(label, year, accent) {
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="675" viewBox="0 0 900 675">' +
        '<rect width="900" height="675" fill="#f7f9f6"/>' +
        '<rect x="36" y="36" width="828" height="603" fill="none" stroke="#2d4a2b" stroke-opacity="0.18"/>' +
        '<circle cx="450" cy="300" r="110" fill="' + accent + '" fill-opacity="0.12"/>' +
        '<path d="M450 420 V220 M450 320 C410 320 390 295 390 265 M450 345 C490 345 510 320 510 290" stroke="#2d4a2b" stroke-width="6" stroke-linecap="round" fill="none"/>' +
        '<text x="450" y="485" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="34" fill="#2d4a2b">' + label + '</text>' +
        '<text x="450" y="525" text-anchor="middle" font-family="sans-serif" font-size="16" letter-spacing="2" fill="#2d4a2b" fill-opacity="0.5">' + year + '</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  var defaultPhotos = [
    {
      id: 'g-26-1',
      year: '2026-2027',
      title: 'Planche d’observation — matin clair',
      src: makePlaceholderSvg('Planche d’observation — matin clair', '2026-2027', '#2d4a2b')
    },
    {
      id: 'g-26-2',
      year: '2026-2027',
      title: 'Substrat minéral & lumière rasante',
      src: makePlaceholderSvg('Substrat minéral & lumière rasante', '2026-2027', '#b8860b')
    },
    {
      id: 'g-27-1',
      year: '2027-2028',
      title: 'Campagne d’hiver — serre calme',
      src: makePlaceholderSvg('Campagne d’hiver — serre calme', '2027-2028', '#2d4a2b')
    },
    {
      id: 'g-27-2',
      year: '2027-2028',
      title: 'Étude de silhouette & coupe basse',
      src: makePlaceholderSvg('Étude de silhouette & coupe basse', '2027-2028', '#b8860b')
    }
  ];

  function loadPhotos() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return defaultPhotos.slice();
  }

  function savePhotos(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  var photos = loadPhotos();
  var activeYear = '2026-2027';
  var searchTerm = '';
  var currentVisibleList = [];
  var currentLightboxIndex = 0;
  var isSwapping = false;

  var yearButtons = document.querySelectorAll('.year-btn');
  var addPhotosBtn = document.getElementById('addPhotosBtn');
  var photoFileInput = document.getElementById('photoFileInput');
  var lockBtn = document.getElementById('lockBtn');
  var thumbGrid = document.getElementById('thumbGrid');
  var searchInput = document.getElementById('gallerySearch');

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxCaption = document.getElementById('lightboxCaption');
  var lightboxCounter = document.getElementById('lightboxCounter');
  var lightboxClose = document.getElementById('lightboxClose');
  var lightboxPrev = document.getElementById('lightboxPrev');
  var lightboxNext = document.getElementById('lightboxNext');

  function getFilteredPhotos() {
    var q = searchTerm.trim().toLowerCase();
    return photos.filter(function (item) {
      var matchYear = item.year === activeYear;
      var matchSearch = !q || item.title.toLowerCase().indexOf(q) !== -1;
      return matchYear && matchSearch;
    });
  }

  function renderGallery() {
    currentVisibleList = getFilteredPhotos();
    if (!currentVisibleList.length) {
      thumbGrid.innerHTML = '<p class="empty-gallery">Aucune vignette pour ' + escapeHtml(activeYear) + '.</p>';
      return;
    }

    thumbGrid.innerHTML = currentVisibleList.map(function (item, idx) {
      return (
        '<article class="thumb-card" data-id="' + escapeHtml(item.id) + '">' +
          '<button type="button" class="thumb-delete-btn" data-delete="' + escapeHtml(item.id) + '" aria-label="Supprimer ' + escapeHtml(item.title) + '">Supprimer</button>' +
          '<button type="button" class="thumb-open-btn" data-index="' + idx + '">' +
            '<div class="thumb-frame">' +
              '<img src="' + item.src + '" alt="' + escapeHtml(item.title) + '">' +
            '</div>' +
            '<div class="thumb-caption">' +
              '<span class="thumb-title">' + escapeHtml(item.title) + '</span>' +
              '<span class="thumb-year">' + escapeHtml(item.year) + '</span>' +
            '</div>' +
          '</button>' +
        '</article>'
      );
    }).join('');
  }

  yearButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      yearButtons.forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      activeYear = btn.getAttribute('data-year');
      renderGallery();
    });
  });

  searchInput.addEventListener('input', function () {
    searchTerm = searchInput.value;
    renderGallery();
  });

  addPhotosBtn.addEventListener('click', function () {
    photoFileInput.click();
  });

  photoFileInput.addEventListener('change', function (e) {
    var files = Array.prototype.slice.call(e.target.files || []);
    if (!files.length) return;

    files.forEach(function (file) {
      if (!file.type || file.type.indexOf('image/') !== 0) return;
      var reader = new FileReader();
      reader.onload = function (ev) {
        var cleanName = file.name.replace(/\.[^/.]+$/, '').replace(/[-_]+/g, ' ') || 'Nouvelle vignette';
        photos.unshift({
          id: 'g-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
          year: activeYear,
          title: cleanName,
          src: ev.target.result
        });
        savePhotos(photos);
        renderGallery();
      };
      reader.readAsDataURL(file);
    });

    photoFileInput.value = '';
  });

  lockBtn.addEventListener('click', function () {
    var unlocked = document.body.classList.toggle('is-unlocked');
    lockBtn.classList.toggle('is-unlocked', unlocked);
    lockBtn.setAttribute('aria-pressed', unlocked ? 'true' : 'false');
    lockBtn.textContent = unlocked ? 'Déverrouillé' : 'Verrou';
  });

  thumbGrid.addEventListener('click', function (e) {
    var delId = e.target.getAttribute('data-delete');
    if (delId) {
      if (!document.body.classList.contains('is-unlocked')) return;
      if (window.confirm('Supprimer cette vignette de la galerie ?')) {
        photos = photos.filter(function (item) { return item.id !== delId; });
        savePhotos(photos);
        renderGallery();
      }
      return;
    }

    var openTrigger = e.target.closest('.thumb-open-btn');
    if (openTrigger) {
      var idx = parseInt(openTrigger.getAttribute('data-index'), 10);
      if (!isNaN(idx)) openLightbox(idx);
    }
  });

  function updateLightboxContent(index) {
    var item = currentVisibleList[index];
    if (!item) return;
    currentLightboxIndex = index;
    lightboxImg.src = item.src;
    lightboxImg.alt = item.title;
    lightboxCaption.textContent = item.title;
    lightboxCounter.textContent = (index + 1) + ' / ' + currentVisibleList.length + ' · ' + item.year;
  }

  function openLightbox(index) {
    if (!currentVisibleList.length) return;
    updateLightboxContent(index);
    lightbox.hidden = false;
    requestAnimationFrame(function () {
      lightbox.classList.add('is-open');
    });
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    setTimeout(function () {
      if (!lightbox.classList.contains('is-open')) {
        lightbox.hidden = true;
      }
    }, 380);
  }

  function stepLightbox(direction) {
    if (!currentVisibleList.length || isSwapping) return;
    var nextIndex = (currentLightboxIndex + direction + currentVisibleList.length) % currentVisibleList.length;

    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      updateLightboxContent(nextIndex);
      return;
    }

    isSwapping = true;
    var outClass = direction > 0 ? 'is-swapping-next' : 'is-swapping-prev';
    lightboxImg.classList.add(outClass);
    lightboxCaption.style.opacity = '0';

    setTimeout(function () {
      updateLightboxContent(nextIndex);
      lightboxImg.classList.remove(outClass);
      lightboxCaption.style.opacity = '1';
      isSwapping = false;
    }, 260);
  }

  lightboxClose.addEventListener('click', closeLightbox);
  lightboxPrev.addEventListener('click', function () { stepLightbox(-1); });
  lightboxNext.addEventListener('click', function () { stepLightbox(1); });

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  document.addEventListener('keydown', function (e) {
    if (lightbox.hidden) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowRight') stepLightbox(1);
    else if (e.key === 'ArrowLeft') stepLightbox(-1);
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&')
      .replace(/</g, '<')
      .replace(/>/g, '>')
      .replace(/"/g, '"');
  }

  renderGallery();
})();
</script>
