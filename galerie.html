<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Galerie — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --bronze: #b8860b;
    --surface: #f7f9f6;
    --border: rgba(45, 74, 43, 0.14);
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ===================== INITIAL "SAN PEDRO" FADE-IN ===================== */
  .san-pedro-splash {
    position: fixed;
    inset: 0;
    z-index: 120;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    pointer-events: none;
    animation: san-pedro-overlay-out 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .san-pedro-splash__label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: var(--cd);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: san-pedro-text-in-out 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes san-pedro-text-in-out {
    0% { opacity: 0; transform: translateY(10px); }
    35% { opacity: 1; transform: translateY(0); }
    70% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-8px); }
  }

  @keyframes san-pedro-overlay-out {
    0%, 72% { opacity: 1; visibility: visible; }
    100% { opacity: 0; visibility: hidden; }
  }

  .page-content {
    max-width: 800px;
    margin: 0 auto;
    opacity: 0;
    animation: page-settle-in 1.1s cubic-bezier(0.4, 0, 0.2, 1) 1.05s forwards;
  }

  @keyframes page-settle-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  a.brand-link.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: 0.01em;
    color: var(--cd);
    text-decoration: none;
    margin-bottom: 0.2rem;
    transition: color 0.35s ease;
  }

  a.brand-link.wave-text:hover,
  a.brand-link.wave-text:focus {
    color: var(--ch);
  }

  .wave-letter {
    display: inline-block;
    font-style: normal;
    will-change: transform;
  }

  .brand-l {
    color: var(--bronze) !important;
    -webkit-text-fill-color: var(--bronze) !important;
  }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: #b8860b !important;
    -webkit-text-fill-color: #b8860b !important;
    background: transparent !important;
    font-style: normal !important;
  }

  /* ----- Barre de recherche ----- */
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--f); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  /* ----- Actions en haut à droite (+ Menu fixe, sans décalage) ----- */
  .header-actions {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
    padding-top: 0.4rem;
    z-index: 30;
  }

  .plus-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-size: 1.75rem;
    line-height: 1;
    color: var(--cd);
    padding: 0.15rem 0.35rem;
    transition: color 0.35s ease, transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .plus-trigger:hover,
  .plus-trigger:focus {
    color: var(--ch);
  }

  .plus-trigger.is-open {
    transform: rotate(45deg);
    color: var(--ch);
  }

  .plus-menu {
    position: absolute;
    top: 100%;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
    padding: 0.55rem 0.85rem;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 14px 32px rgba(45, 74, 43, 0.08);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.28s ease;
  }

  .plus-menu.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  .add-link,
  .plus-sublink,
  .dr-link {
    display: inline-block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--cd);
    text-decoration: none;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .add-link:hover,
  .add-link:focus,
  .plus-sublink:hover,
  .plus-sublink:focus,
  .dr-link:hover,
  .dr-link:focus {
    color: var(--ch);
  }

  .dr-link .cactus-word {
    color: #b8860b;
    -webkit-text-fill-color: #b8860b;
  }

  /* ===================== LOGO ===================== */
  .brand-logo {
    display: block;
    margin: 1rem auto 2.5rem;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 460px;
    object-fit: contain;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  /* ===================== GALLERY CONTROLS ===================== */
  .gallery-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1.25rem 2rem;
    padding-bottom: 1.35rem;
    border-bottom: 1px solid var(--border);
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  }

  .years-nav {
    display: flex;
    align-items: baseline;
    gap: 2rem;
    flex-wrap: wrap;
  }

  .year-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 4.5vw, 2.9rem);
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: rgba(45, 74, 43, 0.58);
    padding: 0.15rem 0;
    position: relative;
    transition: color 0.35s ease;
  }

  .year-btn::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 1.5px;
    background: var(--cd);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .year-btn:hover,
  .year-btn:focus,
  .year-btn.is-active {
    color: var(--cd);
  }

  .year-btn.is-active::after,
  .year-btn:hover::after {
    transform: scaleX(1);
  }

  .toolbar-actions {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    flex-wrap: wrap;
  }

  .action-pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    background: var(--surface);
    color: var(--cd);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.52rem 1.15rem;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.2;
    transition: background-color 0.25s ease,
                border-color 0.25s ease,
                color 0.25s ease,
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .action-pill-btn:hover,
  .action-pill-btn:focus {
    background: rgba(45, 74, 43, 0.08);
    border-color: rgba(45, 74, 43, 0.28);
    color: var(--ch);
    transform: translateY(-1px);
  }

  .lock-btn.is-unlocked {
    background: rgba(184, 134, 11, 0.12);
    border-color: rgba(184, 134, 11, 0.45);
    color: #7c5804;
  }

  .status-line {
    margin-top: 0.95rem;
    min-height: 1.25rem;
    font-size: 0.85rem;
    color: var(--ch);
  }

  /* ===================== LARGE EDITORIAL VIGNETTES GRID ===================== */
  .vignettes-section {
    margin-top: 1.5rem;
  }

  .vignettes-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .vignettes-heading {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.65rem, 3.5vw, 2.25rem);
    color: var(--cd);
  }

  .vignettes-count {
    font-size: 0.85rem;
    color: var(--f);
  }

  .vignettes-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1.75rem;
  }

  .vignette-tile {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    opacity: 0;
    transform: translateY(18px) scale(0.985);
    animation: tileReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    animation-delay: var(--tile-delay, 0ms);
    transition: transform 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                box-shadow 0.38s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.3s ease,
                background-color 0.3s ease;
  }

  @keyframes tileReveal {
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  .vignette-tile:hover {
    transform: translateY(-5px);
    background: #ffffff;
    border-color: rgba(45, 74, 43, 0.28);
    box-shadow: 0 22px 46px rgba(45, 74, 43, 0.09);
  }

  .vignette-open-btn {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    width: 100%;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-align: left;
    color: var(--cd);
  }

  .vignette-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 4 / 3;
    border-radius: 16px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid rgba(45, 74, 43, 0.09);
  }

  .vignette-thumb-wrap::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 58%, rgba(45, 74, 43, 0.14) 100%);
    opacity: 0.65;
    transition: opacity 0.35s ease;
    pointer-events: none;
  }

  .vignette-tile:hover .vignette-thumb-wrap::after {
    opacity: 0.25;
  }

  .vignette-thumb-wrap img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .vignette-tile:hover .vignette-thumb-wrap img {
    transform: scale(1.045);
  }

  .vignette-tile-meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 0.75rem;
    padding: 0 0.25rem;
  }

  .vignette-tile-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.55rem;
    line-height: 1.15;
    color: var(--cd);
  }

  .vignette-tile-date {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--bronze);
    white-space: nowrap;
  }

  .vignette-tile-caption {
    font-size: 0.85rem;
    line-height: 1.45;
    color: var(--ch);
    padding: 0 0.25rem 0.25rem;
  }

  .delete-vignette-btn {
    display: none;
    align-self: flex-end;
    align-items: center;
    gap: 0.35rem;
    background: #fff5f3;
    color: #8b2615;
    border: 1px solid rgba(139, 38, 21, 0.25);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    transition: background-color 0.22s ease, transform 0.22s ease, border-color 0.22s ease;
  }

  .vignettes-section.is-unlocked .delete-vignette-btn {
    display: inline-flex;
  }

  .delete-vignette-btn:hover,
  .delete-vignette-btn:focus {
    background: #fde8e4;
    border-color: rgba(139, 38, 21, 0.45);
    transform: translateY(-1px);
  }

  .empty-state {
    grid-column: 1 / -1;
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 20px;
    padding: 2.25rem 1.5rem;
    text-align: center;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.35rem;
    color: var(--ch);
  }

  /* ===================== LIGHTBOX VIEWER ===================== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px);
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 1.5rem 2.25rem 2rem;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.38s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.38s ease;
  }

  .lightbox.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .lightbox-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
  }

  .lightbox-info {
    display: flex;
    align-items: baseline;
    gap: 1rem;
  }

  .lightbox-year {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.75rem;
    color: var(--cd);
  }

  .lightbox-counter {
    font-size: 0.88rem;
    color: var(--f);
    letter-spacing: 0.04em;
  }

  .lightbox-close {
    background: var(--surface);
    color: var(--cd);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.5rem 1.25rem;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    transition: background-color 0.25s ease, color 0.25s ease, transform 0.25s ease;
  }

  .lightbox-close:hover,
  .lightbox-close:focus {
    background: rgba(45, 74, 43, 0.1);
    color: var(--ch);
    transform: translateY(-1px);
  }

  .lightbox-stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    max-width: 1240px;
    width: 100%;
    margin: 1rem auto;
  }

  .lightbox-arrow {
    position: relative;
    z-index: 4;
    flex-shrink: 0;
    width: 52px;
    height: 52px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(247, 249, 246, 0.92);
    color: var(--cd);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.28s ease,
                border-color 0.28s ease,
                color 0.28s ease,
                transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .lightbox-arrow:hover,
  .lightbox-arrow:focus {
    background: var(--cd);
    border-color: var(--cd);
    color: var(--bg);
    transform: scale(1.05);
  }

  .lightbox-viewport {
    flex: 1;
    height: 100%;
    max-height: 75vh;
    margin: 0 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .lightbox-panel {
    width: 100%;
    height: 100%;
    max-width: 980px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 1.45rem;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 1rem;
    box-shadow: 0 26px 68px rgba(45, 74, 43, 0.1);
    will-change: transform, opacity;
  }

  .lightbox-frame {
    flex: 1;
    min-height: 0;
    width: 100%;
    border-radius: 15px;
    overflow: hidden;
    background: var(--bg);
    border: 1px solid rgba(45, 74, 43, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .lightbox-frame img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  .lightbox-meta {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 1.5rem;
    padding: 0 0.2rem;
  }

  .lightbox-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    line-height: 1.1;
    color: var(--cd);
  }

  .lightbox-caption {
    font-size: 0.92rem;
    color: var(--ch);
    margin-top: 0.25rem;
  }

  .lightbox-date {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--bronze);
    white-space: nowrap;
  }

  /* Smooth cross-fade + gentle scale/slide transitions between vignettes */
  @keyframes panelOutNext {
    0% { opacity: 1; transform: translateX(0) scale(1); }
    100% { opacity: 0; transform: translateX(-24px) scale(0.985); }
  }

  @keyframes panelInNext {
    0% { opacity: 0; transform: translateX(26px) scale(0.985); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes panelOutPrev {
    0% { opacity: 1; transform: translateX(0) scale(1); }
    100% { opacity: 0; transform: translateX(24px) scale(0.985); }
  }

  @keyframes panelInPrev {
    0% { opacity: 0; transform: translateX(-26px) scale(0.985); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  .lightbox-panel.is-out-next {
    animation: panelOutNext 0.24s cubic-bezier(0.4, 0, 0.8, 0.5) forwards;
  }

  .lightbox-panel.is-in-next {
    animation: panelInNext 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .lightbox-panel.is-out-prev {
    animation: panelOutPrev 0.24s cubic-bezier(0.4, 0, 0.8, 0.5) forwards;
  }

  .lightbox-panel.is-in-prev {
    animation: panelInPrev 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  .lightbox-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 0.5rem;
    max-width: 1240px;
    width: 100%;
    margin: 0 auto;
  }

  .lightbox-dot {
    width: 8px;
    height: 8px;
    border-radius: 999px;
    border: none;
    background: rgba(45, 74, 43, 0.22);
    cursor: pointer;
    padding: 0;
    transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.3s ease;
  }

  .lightbox-dot.is-active {
    width: 22px;
    background: var(--cd);
  }

  /* ===================== UPLOAD MODAL ===================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    z-index: 110;
    background: rgba(45, 74, 43, 0.28);
    backdrop-filter: blur(6px);
    display: flex;

// ==================== WAVE ANIMATION ON PLANTOUILLE BRAND LINK ====================
(function () {
  var brandLink = document.querySelector('.brand-link.wave-text');
  if (!brandLink) return;
  var spans = brandLink.querySelectorAll('.wave-letter');
  if (!spans.length) return;

  var fontSize = parseFloat(getComputedStyle(brandLink).fontSize) || 48;
  var AMPLITUDE = fontSize * 0.20;
  var PERIOD = 2500;
  var STAGGER = 150;
  var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    var elapsed = now - phaseStart;
    spans.forEach(function (span, i) {
      var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(function (s) { s.style.transform = ''; });
      phaseStart = null;
      rafId = null;
      return;
    }
    rafId = requestAnimationFrame(tick);
  }

  function startWave() {
    targetAmplitude = AMPLITUDE;
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  function stopWave() {
    targetAmplitude = 0;
    if (!rafId) rafId = requestAnimationFrame(tick);
  }

  brandLink.addEventListener('mouseenter', startWave);
  brandLink.addEventListener('mouseleave', stopWave);
  brandLink.addEventListener('focus', startWave);
  brandLink.addEventListener('blur', stopWave);
  brandLink.addEventListener('touchstart', startWave, { passive: true });
  brandLink.addEventListener('touchend', stopWave, { passive: true });
})();

// ==================== FIXED TOP-RIGHT + DROPDOWN MENU ====================
(function () {
  var trigger = document.getElementById('plusTrigger');
  var menu = document.getElementById('plusMenu');
  var container = document.getElementById('headerActions');
  if (!trigger || !menu || !container) return;

  function setOpen(open) {
    trigger.classList.toggle('is-open', open);
    menu.classList.toggle('is-open', open);
    trigger.setAttribute('aria-expanded', String(open));
  }

  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    setOpen(!menu.classList.contains('is-open'));
  });

  document.addEventListener('click', function (e) {
    if (menu.classList.contains('is-open') && !container.contains(e.target)) {
      setOpen(false);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('is-open')) {
      setOpen(false);
    }
  });
})();

// ==================== GALLERY YEARS, UPLOAD, LOCK/DELETE & LIGHTBOX ====================
(function () {
  var STORAGE_KEY = 'plantouille_galerie_store_v2';

  function createIllustration(title, yearTag, tone) {
    var bg = tone === 'alt' ? '#eef3ec' : '#f7f9f6';
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">' +
      '<rect width="1200" height="900" fill="' + bg + '"/>' +
      '<circle cx="600" cy="430" r="275" fill="none" stroke="#2d4a2b" stroke-opacity="0.12" stroke-width="2"/>' +
      '<path d="M600 675 L600 225" stroke="#2d4a2b" stroke-width="18" stroke-linecap="round"/>' +
      '<path d="M600 500 C515 500 475 435 475 355" fill="none" stroke="#2d4a2b" stroke-width="14" stroke-linecap="round"/>' +
      '<path d="M600 440 C690 440 730 375 730 295" fill="none" stroke="#2d4a2b" stroke-width="14" stroke-linecap="round"/>' +
      '<text x="600" y="760" text-anchor="middle" fill="#2d4a2b" font-family="Georgia, serif" font-style="italic" font-size="40">' + title + '</text>' +
      '<text x="600" y="805" text-anchor="middle" fill="#b8860b" font-family="Georgia, serif" font-style="italic" font-size="24">' + yearTag + '</text>' +
      '</svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  var INITIAL_DATA = {
    '2026-2027': [
      {
        id: 'g-2627-1',
        year: '2026-2027',
        title: 'Trichocereus pachanoi',
        caption: 'Réveil végétatif de printemps en substrat minéral aéré.',
        date: 'Avril 2026',
        src: createIllustration('Trichocereus pachanoi', '2026-2027', 'main')
      },
      {
        id: 'g-2627-2',
        year: '2026-2027',
        title: 'Echinopsis peruviana',
        caption: 'Teinte glauque et aréoles nettes sous lumière franche.',
        date: 'Juillet 2026',
        src: createIllustration('Echinopsis peruviana', '2026-2027', 'alt')
      },
      {
        id: 'g-2627-3',
        year: '2026-2027',
        title: 'Boutures d’automne',
        caption: 'Sélection des têtes saines avant la période de repos.',
        date: 'Octobre 2026',
        src: createIllustration('Boutures d’automne', '2026-2027', 'main')
      }
    ],
    '2027-2028': [
      {
        id: 'g-2728-1',
        year: '2027-2028',
        title: 'San Pedro — Nouveau cycle',
        caption: 'Observation de la reprise et du rythme de croissance.',
        date: 'Mars 2027',
        src: createIllustration('San Pedro — Nouveau cycle', '2027-2028', 'main')
      },
      {
        id: 'g-2728-2',
        year: '2027-2028',
        title: 'Étude d’apex colonnaire',
        caption: 'Équilibre des côtes et vigueur du point végétatif.',
        date: 'Juin 2027',
        src: createIllustration('Étude d’apex colonnaire', '2027-2028', 'alt')
      }
    ]
  };

  function readStore() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        return {
          '2026-2027': INITIAL_DATA['2026-2027'].slice(),
          '2027-2028': INITIAL_DATA['2027-2028'].slice()
        };
      }
      var parsed = JSON.parse(raw);
      return {
        '2026-2027': Array.isArray(parsed['2026-2027']) ? parsed['2026-2027'] : [],
        '2027-2028': Array.isArray(parsed['2027-2028']) ? parsed['2027-2028'] : []
      };
    } catch (err) {
      return {
        '2026-2027': INITIAL_DATA['2026-2027'].slice(),
        '2027-2028': INITIAL_DATA['2027-2028'].slice()
      };
    }
  }

  function writeStore(data) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (err) {
      return false;
    }
  }

  var store = readStore();
  var currentYear = '2026-2027';
  var isUnlocked = false;
  var filteredItems = [];
  var currentLightboxIdx = 0;
  var isAnimatingLightbox = false;
  var pendingImageDataUrl = '';

  // DOM refs
  var yearButtons = document.querySelectorAll('.year-btn');
  var lockBtn = document.getElementById('lockBtn');
  var lockLabel = document.getElementById('lockLabel');
  var lockIcon = document.getElementById('lockIcon');
  var statusLine = document.getElementById('statusLine');
  var vignettesSection = document.getElementById('vignettesSection');
  var vignettesHeading = document.getElementById('vignettesHeading');
  var vignettesCount = document.getElementById('vignettesCount');
  var vignettesGrid = document.getElementById('vignettesGrid');
  var searchInput = document.getElementById('searchInput');
  var searchForm = document.getElementById('searchForm');

  // Lightbox refs

  var lightboxCounter = document.getElementById('lightboxCounter');
  var closeLightboxBtn = document.getElementById('closeLightboxBtn');
  var prevLightboxBtn = document.getElementById('prevLightboxBtn');
  var nextLightboxBtn = document.getElementById('nextLightboxBtn');
  var lightboxPanel = document.getElementById('lightboxPanel');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxTitle = document.getElementById('lightboxTitle');
  var lightboxCaption = document.getElementById('lightboxCaption');

  // Upload modal refs

  var cancelUploadBtn = document.getElementById('cancelUploadBtn');

  function updateLockIcon() {
    if (isUnlocked) {
      lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>';
      lockLabel.textContent = 'Déverrouillé';
      lockBtn.classList.add('is-unlocked');
      lockBtn.setAttribute('aria-pressed', 'true');
      vignettesSection.classList.add('is-unlocked');
    } else {
      lockIcon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>';
      lockLabel.textContent = 'Verrou';
      lockBtn.classList.remove('is-unlocked');
      lockBtn.setAttribute('aria-pressed', 'false');
      vignettesSection.classList.remove('is-unlocked');
    }
  }

  function getItemsForYear(year) {
    var list = Array.isArray(store[year]) ? store[year] : [];
    var query = (searchInput && searchInput.value ? searchInput.value : '').trim().toLowerCase();
    if (!query) return list.slice();
    return list.filter(function (item) {
      return (item.title && item.title.toLowerCase().indexOf(query) !== -1) ||
             (item.caption && item.caption.toLowerCase().indexOf(query) !== -1) ||
             (item.date && item.date.toLowerCase().indexOf(query) !== -1);
    });
  }

  function deleteVignetteById(photoId) {
    var list = Array.isArray(store[currentYear]) ? store[currentYear] : [];
    var nextList = list.filter(function (entry) { return entry.id !== photoId; });
    if (nextList.length === list.length) return;
    store[currentYear] = nextList;
    var persisted = writeStore(store);
    renderGallery();
    statusLine.textContent = persisted
      ? 'Vignette supprimée de ' + currentYear + '.'
      : 'Vignette retirée pour cette session (' + currentYear + ').';
  }

  function renderGallery() {
    yearButtons.forEach(function (btn) {
      var isSel = btn.getAttribute('data-year') === currentYear;
      btn.classList.toggle('is-active', isSel);
      btn.setAttribute('aria-pressed', String(isSel));
    });

    vignettesHeading.textContent = currentYear;
    filteredItems = getItemsForYear(currentYear);
    vignettesCount.textContent = filteredItems.length + (filteredItems.length > 1 ? ' vignettes' : ' vignette');
    vignettesGrid.innerHTML = '';

    if (!filteredItems.length) {
      var emptyDiv = document.createElement('div');
      emptyDiv.className = 'empty-state';
      emptyDiv.textContent = 'Aucune vignette disponible pour ' + currentYear + '.';
      vignettesGrid.appendChild(emptyDiv);
      return;
    }

    filteredItems.forEach(function (item, idx) {
      var tile = document.createElement('article');
      tile.className = 'vignette-tile';
      tile.style.setProperty('--tile-delay', Math.min(idx * 70, 350) + 'ms');

      var openBtn = document.createElement('button');
      openBtn.type = 'button';
      openBtn.className = 'vignette-open-btn';
      openBtn.setAttribute('aria-label', 'Afficher en grand : ' + (item.title || 'Vignette'));

      var thumbWrap = document.createElement('div');
      thumbWrap.className = 'vignette-thumb-wrap';

      var img = document.createElement('img');
      img.src = item.src;
      img.alt = item.title || 'Vignette botanique';
      thumbWrap.appendChild(img);

      var meta = document.createElement('div');
      meta.className = 'vignette-tile-meta';

      var titleSpan = document.createElement('span');
      titleSpan.className = 'vignette-tile-title';
      titleSpan.textContent = item.title || 'Planche botanique';

      var dateSpan = document.createElement('span');
      dateSpan.className = 'vignette-tile-date';
      dateSpan.textContent = item.date || currentYear;

      meta.appendChild(titleSpan);
      meta.appendChild(dateSpan);

      openBtn.appendChild(thumbWrap);
      openBtn.appendChild(meta);

      if (item.caption) {
        var capP = document.createElement('p');
        capP.className = 'vignette-tile-caption';
        capP.textContent = item.caption;
        openBtn.appendChild(capP);
      }

      openBtn.addEventListener('click', function () {
        openLightbox(idx);
      });

      var delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'delete-vignette-btn';
      delBtn.setAttribute('aria-label', 'Supprimer la vignette ' + (item.title || ''));
      delBtn.textContent = 'Supprimer';
      delBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        deleteVignetteById(item.id);
      });

      tile.appendChild(openBtn);
      tile.appendChild(delBtn);
      vignettesGrid.appendChild(tile);
    });
  }

  // Lightbox rendering & smooth cross-fade + slide/scale transition
  function renderLightboxItem(item) {
    lightboxImg.src = item.src;
    lightboxImg.alt = item.title || 'Vignette botanique';
    lightboxTitle.textContent = item.title || 'Planche botanique';
    lightboxCaption.textContent = item.caption || '';
    lightboxCaption.style.display = item.caption ? 'block' : 'none';
    lightboxDate.textContent = item.date || currentYear;
    lightboxCounter.textContent = (currentLightboxIdx + 1) + ' / ' + filteredItems.length;

    var dots = lightboxDots.querySelectorAll('.lightbox-dot');
    dots.forEach(function (dot, i) {
      dot.classList.toggle('is-active', i === currentLightboxIdx);
      dot.setAttribute('aria-pressed', String(i === currentLightboxIdx));
    });
  }

  function buildLightboxDots() {
    lightboxDots.innerHTML = '';
    filteredItems.forEach(function (_, i) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'lightbox-dot' + (i === currentLightboxIdx ? ' is-active' : '');
      dot.setAttribute('aria-label', 'Vignette ' + (i + 1));
      dot.setAttribute('aria-pressed', String(i === currentLightboxIdx));
      dot.addEventListener('click', function () {
        if (i === currentLightboxIdx || isAnimatingLightbox) return;
        navigateLightbox(i, i > currentLightboxIdx ? 'next' : 'prev');
      });
      lightboxDots.appendChild(dot);
    });
  }

  function openLightbox(index) {
    if (!filteredItems.length) return;
    currentLightboxIdx = Math.max(0, Math.min(index, filteredItems.length - 1));
    lightboxYear.textContent = currentYear;
    lightboxPanel.classList.remove('is-out-next', 'is-in-next', 'is-out-prev', 'is-in-prev');
    buildLightboxDots();
    renderLightboxItem(filteredItems[currentLightboxIdx]);
    lightbox.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    closeLightboxBtn.focus();
  }

  function closeLightbox() {
    lightbox.classList.remove('is-open');
    if (!uploadModal.classList.contains('is-open')) {
      document.body.style.overflow = '';
    }
    isAnimatingLightbox = false;
  }

  function navigateLightbox(targetIndex, dir) {
    if (!filteredItems.length || isAnimatingLightbox) return;
    var wrapped = (targetIndex + filteredItems.length) % filteredItems.length;
    if (wrapped === currentLightboxIdx) return;

    var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduced) {
      currentLightboxIdx = wrapped;
      renderLightboxItem(filteredItems[currentLightboxIdx]);
      return;
    }

    isAnimatingLightbox = true;
    var outClass = dir === 'prev' ? 'is-out-prev' : 'is-out-next';
    var inClass = dir === 'prev' ? 'is-in-prev' : 'is-in-next';

    lightboxPanel.classList.remove('is-out-next', 'is-in-next', 'is-out-prev', 'is-in-prev');
    void lightboxPanel.offsetWidth;
    lightboxPanel.classList.add(outClass);

    setTimeout(function () {
      currentLightboxIdx = wrapped;
      renderLightboxItem(filteredItems[currentLightboxIdx]);
      lightboxPanel.classList.remove(outClass);
      void lightboxPanel.offsetWidth;
      lightboxPanel.classList.add(inClass);

      setTimeout(function () {
        lightboxPanel.classList.remove(inClass);
        isAnimatingLightbox = false;
      }, 420);
    }, 235);
  }

  // Year button events
  yearButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      currentYear = btn.getAttribute('data-year');
      statusLine.textContent = '';
      renderGallery();
    });
  });

  // Lock button event
  lockBtn.addEventListener('click', function () {
    isUnlocked = !isUnlocked;
    updateLockIcon();
    statusLine.textContent = isUnlocked
      ? 'Verrou levé : cliquez sur « Supprimer » sous une vignette pour la retirer.'
      : 'Verrou activé : suppression protégée.';
  });

  // Lightbox controls
  prevLightboxBtn.addEventListener('click', function () {
    navigateLightbox(currentLightboxIdx - 1, 'prev');
  });

  nextLightboxBtn.addEventListener('click', function () {
    navigateLightbox(currentLightboxIdx + 1, 'next');
  });

  closeLightboxBtn.addEventListener('click', closeLightbox);

  lightbox.addEventListener('click', function (e) {
    if (e.target === lightbox) closeLightbox();
  });

  // Upload modal controls
  function resetUploadModal() {
    uploadForm.reset();
    pendingImageDataUrl = '';
    uploadError.textContent = '';
    uploadPreview.src = '';
    uploadPreview.classList.remove('is-visible');
  }

  function openUploadModal() {
    resetUploadModal();
    uploadYear.value = currentYear;
    uploadModal.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    uploadFile.focus();
  }

  function closeUploadModal() {
    uploadModal.classList.remove('is-open');
    if (!lightbox.classList.contains('is-open')) {
      document.body.style.overflow = '';
    }
  }

  openUploadBtn.addEventListener('click', openUploadModal);
  closeUploadBtn.addEventListener('click', closeUploadModal);
  cancelUploadBtn.addEventListener('click', closeUploadModal);

  uploadModal.addEventListener('click', function (e) {
    if (e.target === uploadModal) closeUploadModal();
  });

  uploadFile.addEventListener('change', function () {
    uploadError.textContent = '';
    var file = uploadFile.files && uploadFile.files[0];
    if (!file) {
      pendingImageDataUrl = '';
      uploadPreview.src = '';
      uploadPreview.classList.remove('is-visible');
      return;
    }
    if (!file.type || file.type.indexOf('image/') !== 0) {
      uploadError.textContent = 'Veuillez choisir un fichier image valide.';
      uploadFile.value = '';
      return;
    }

    var reader = new FileReader();
    reader.onload = function (ev) {
      pendingImageDataUrl = String(ev.target && ev.target.result ? ev.target.result : '');
      if (pendingImageDataUrl) {
        uploadPreview.src = pendingImageDataUrl;
        uploadPreview.classList.add('is-visible');
      }
    };
    reader.onerror = function () {
      uploadError.textContent = 'Erreur lors de la lecture du fichier.';
    };
    reader.readAsDataURL(file);
  });

  uploadForm.addEventListener('submit', function (e) {
    e.preventDefault();
    uploadError.textContent = '';

    if (!pendingImageDataUrl) {
      uploadError.textContent = 'Sélectionnez une image avant d’ajouter.';
      return;
    }

    var targetYear = uploadYear.value === '2027-2028' ? '2027-2028' : '2026-2027';
    var titleVal = uploadTitle.value.trim();
    var captionVal = uploadCaption.value.trim();
    var dateStr = new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

    var newPhoto = {
      id: 'g-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      year: targetYear,
      title: titleVal || ('Planche ' + targetYear),
      caption: captionVal,
      date: dateStr.charAt(0).toUpperCase() + dateStr.slice(1),
      src: pendingImageDataUrl
    };

    if (!Array.isArray(store[targetYear])) store[targetYear] = [];
    store[targetYear].push(newPhoto);

    var saved = writeStore(store);
    currentYear = targetYear;
    closeUploadModal();
    renderGallery();
    statusLine.textContent = saved
      ? 'Photo ajoutée à ' + targetYear + '.'
      : 'Photo ajoutée en mémoire pour ' + targetYear + '.';
  });

  // Keyboard shortcuts
  document.addEventListener('keydown', function (e) {
    if (lightbox.classList.contains('is-open')) {
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        navigateLightbox(currentLightboxIdx + 1, 'next');
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        navigateLightbox(currentLightboxIdx - 1, 'prev');
      } else if (e.key === 'Escape') {
        e.preventDefault();
        closeLightbox();
      }
    } else if (uploadModal.classList.contains('is-open') && e.key === 'Escape') {
      e.preventDefault();
      closeUploadModal();
    }
  });

  // Swipe gestures on lightbox panel
  var touchStartX = 0;
  lightboxPanel.addEventListener('touchstart', function (e) {
    if (!e.touches || !e.touches.length) return;
    touchStartX = e.touches[0].clientX;
  }, { passive: true });

  lightboxPanel.addEventListener('touchend', function (e) {
    if (!e.changedTouches || !e.changedTouches.length) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 48) {
      if (dx < 0) navigateLightbox(currentLightboxIdx + 1, 'next');
      else navigateLightbox(currentLightboxIdx - 1, 'prev');
    }
  }, { passive: true });

  if (searchForm) {
    searchForm.addEventListener('submit', function (e) {
      e.preventDefault();
      renderGallery();
    });
  }

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      renderGallery();
    });
  }

  updateLockIcon();
  renderGallery();
})();
</script>

</body>
</html>
