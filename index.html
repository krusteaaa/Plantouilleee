<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  /* ==================== VARIABLES & BASE ==================== */
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  :root{
    color-scheme: light; 
    --cd:#2d4a2b; 
    --bg:#ffffff;
    --btn-bg:rgba(45,74,43,.06);
    --btn-hover:var(--cd);
  }
  body{
    font-family:"Inter",sans-serif;
    background:var(--bg);
    color:var(--cd);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:2rem 1.5rem;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }

  /* Suppression des contours / carrés bleus de focus et de tap */
  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}
  button::-moz-focus-inner,input::-moz-focus-inner{border:0}

  /* ==================== ANIMATIONS DE PAGE ==================== */
  .page-content {
    width: 100%;
    max-width: 800px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    animation: fadeSlideIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
  }
  .page-exit { animation: fadeSlideOut 0.4s cubic-bezier(0.8, 0.2, 0.8, 0.2) forwards; }
  @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeSlideOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-20px); } }

  /* ==================== LOGO (identique à la page d'origine) ==================== */
  .brand-logo{
    display: block;
    margin: 0 auto;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 600px;
    object-fit: contain;
  }

  /* ==================== BOUTON ACTION ==================== */
  .action-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.8rem;
    padding: 1rem 3rem 1rem 2rem;
    background: var(--btn-bg);
    border: none; 
    cursor: pointer;
    border-radius: 999px;
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-size: 1.5rem;
    color: var(--cd);
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 4px 15px rgba(45,74,43,0.05);
  }
  .action-btn:hover {
    background: var(--btn-hover);
    color: white;
    transform: translateY(-3px);
    box-shadow: 0 8px 25px rgba(45,74,43,0.2);
  }
  .action-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--cd);
    color: #fff;
    transition: all 0.4s ease;
  }
  .action-btn:hover .action-icon { 
    background: #fff;
    color: var(--cd);
    transform: rotate(-10deg) scale(1.1); 
  }

  /* Animation de départ (softBounce) : le bouton respire doucement,
     puis se met en pause quand on le survole pour laisser place
     au hover "classique" (fond vert + remontée). */
  .enter-btn { animation: softBounce 2.6s cubic-bezier(.34,1.56,.64,1) infinite; }
  .enter-btn:hover { animation-play-state: paused; }
  @keyframes softBounce{
    0%,100%{transform:translateY(0)}
    30%{transform:translateY(-6px)}
    50%{transform:translateY(0)}
    70%{transform:translateY(-2px)}
    85%{transform:translateY(0)}
  }

  /* ==================== EFFET VAGUE SUR LES LETTRES ==================== */
  .wave-text{display:inline-flex;align-items:baseline;flex-wrap:wrap}
  .wave-letter{display:inline-block;will-change:transform;white-space:pre}

  /* ==================== RESPONSIVE (identique à la page d'origine) ==================== */
  @media(max-width:768px){
    .brand-logo{
      display: block;
      width: 150vw;
      max-width: none;
      max-height: none;
      height: auto;
      margin-left: calc(50% - 75vw);
      margin-right: calc(50% - 75vw);
      object-fit: contain;
    }
  }
  @media(max-width:640px){
    body{padding:1.5rem 1rem}
    .brand-logo {
      display: block;
      width: 150vw;
      max-width: none;
      max-height: none;
      height: auto;
      margin-left: calc(50% - 75vw);
      margin-right: calc(50% - 75vw);
      object-fit: contain;
    }
    .action-btn{width:100%; font-size: 1.3rem; padding: 1rem 2rem;}
  }
</style>
</head>
<body>

<div class="page-content">

  <!-- Le logo, exactement comme sur la page d'origine -->
  <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">

  <!-- Le bouton "Entrée" avec l'animation de départ + effet vague -->
  <button type="button" class="action-btn enter-btn wave-text" onclick="navigate('page2.html')">
    <span class="action-icon">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </span>
    <span>
      <span class="wave-letter">E</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">r</span><span class="wave-letter">é</span><span class="wave-letter">e</span>
    </span>
  </button>

</div>

<script>
// ==================== NAVIGATION ====================
function navigate(url) {
  document.querySelector('.page-content').classList.add('page-exit');
  setTimeout(() => { window.location.href = url; }, 400);
}

// ==================== ANIMATION VAGUE (fonctionnement de départ) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if(!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20; 
  const PERIOD = 2500; 
  const STAGGER = 150; 
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;
  
  function tick(now){
    if(phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if(Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if(amplitude === 0 && targetAmplitude === 0){
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if(!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if(!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if(!rafId) rafId = requestAnimationFrame(tick); }, {passive:true});
  el.addEventListener('touchend', () => { targetAmplitude = 0; if(!rafId) rafId = requestAnimationFrame(tick); }, {passive:true});
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el.closest('button, a') || el));
</script>

</body>
</html>
