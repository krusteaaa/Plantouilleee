<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Instrument+Serif:ital@0;1&family=Fraunces:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    --cactus-dark: #2d4a2b;
    --cactus-hover: #4a6b3d;
    --bg: #ffffff;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --cactus-dark: #a8bd9d;
      --cactus-hover: #c4d4b9;
      --bg: #17170f;
    }
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cactus-dark);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 2rem;
    text-align: center;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background 0.4s ease;
  }

  /* ----- Bloc titre + sous-titre ----- */
  .title-block {
    animation: fade-in 1.4s ease-out 0.2s both;
  }

  h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(3.2rem, 10vw, 6rem);
    line-height: 0.92;
    letter-spacing: -0.025em;
    color: var(--cactus-dark);
    margin: 0;
  }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2.4vw, 1.25rem);
    letter-spacing: 0.04em;
    color: var(--cactus-dark);
    opacity: 0.72;
    margin-top: 1rem;
  }

  /* ----- Cactus logo ----- */
  .logo {
    display: block;
    width: 44px;
    height: auto;
    margin: 2.2rem auto;
    animation: fade-in 1.2s ease-out 0.7s both;
  }

  .logo rect,
  .logo circle {
    fill: var(--cactus-dark);
  }

  /* ----- Lien "entrer" ----- */
  .btn {
    display: inline-flex;
    padding: 0.4rem 1rem;
    font-family: "Fraunces", Georgia, serif;
    font-size: 1.7rem;
    font-style: italic;
    font-weight: 400;
    letter-spacing: 0.01em;
    color: var(--cactus-dark);
    text-decoration: none;
    background: none;
    border: none;
    animation: fade-up 1.1s cubic-bezier(0.4, 0, 0.2, 1) 1s both;
    transition: color 0.35s ease;
  }

  .btn:hover,
  .btn:focus {
    color: var(--cactus-hover);
    outline: none;
  }

  .btn .word {
    display: inline-flex;
    align-items: baseline;
  }

  .btn .word > span {
    display: inline-block;
    will-change: transform;
  }

  /* ----- Animations d'entrée ----- */
  @keyframes fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .title-block, .logo, .btn {
      animation: none !important;
      opacity: 1;
      transform: none;
    }
  }
</style>
</head>
<body>

  <div class="title-block">
    <h1>Plantouille</h1>
    <p class="subtitle">Cabinet du Dr-Cactus</p>
  </div>

  <svg class="logo" viewBox="0 0 40 56" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <rect x="15" y="10" width="10" height="44" rx="5"/>
    <rect x="4" y="26" width="6" height="14" rx="3"/>
    <rect x="4" y="36" width="14" height="6" rx="3"/>
    <rect x="30" y="20" width="6" height="14" rx="3"/>
    <rect x="22" y="30" width="14" height="6" rx="3"/>
    <circle cx="20" cy="7" r="4"/>
  </svg>

  <a href="page2.html" class="btn">
    <span class="word" aria-label="entrer">
      <span>e</span><span>n</span><span>t</span><span>r</span><span>e</span><span>r</span>
    </span>
  </a>

<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var AMPLITUDE = 8, PERIOD = 1200, STAGGER = 100, EASING = 0.12, EPSILON = 0.05;

  document.querySelectorAll('.btn').forEach(function (btn) {
    var spans = btn.querySelectorAll('.word > span');
    var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

    function tick(now) {
      if (phaseStart === null) phaseStart = now;
      amplitude += (targetAmplitude - amplitude) * EASING;
      if (Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;

      var elapsed = now - phaseStart;
      for (var i = 0; i < spans.length; i++) {
        var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
        spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
      }
      if (amplitude === 0 && targetAmplitude === 0) {
        for (var j = 0; j < spans.length; j++) spans[j].style.transform = '';
        phaseStart = null;
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function ensureRunning() { if (rafId === null) rafId = requestAnimationFrame(tick); }
    function start() { targetAmplitude = AMPLITUDE; ensureRunning(); }
    function stop() { targetAmplitude = 0; ensureRunning(); }

    btn.addEventListener('mouseenter', start);
    btn.addEventListener('mouseleave', stop);
    btn.addEventListener('focus', start);
    btn.addEventListener('blur', stop);
    btn.addEventListener('touchstart', start, { passive: true });
    btn.addEventListener('touchend', stop, { passive: true });
  });
})();
</script>

</body>
</html>
