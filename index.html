<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Plantouille — Cabinet Botanique</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cormorant+Garamond:ital,wght@1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper: '#ffffff',
          surface: '#ffffff',
          ink: '#0f0f0f',
          muted: '#888888',
          border: '#f0f0f0',
          brand: '#153424',
        },
        fontFamily: {
          serif: ['"Bodoni Moda"', 'Georgia', 'serif'],
          sans: ['Jost', 'system-ui', 'sans-serif'],
          hand: ['"Cormorant Garamond"', 'Georgia', 'serif'],
        },
      },
    },
  };
</script>

<style>
  * { 
    -webkit-tap-highlight-color: transparent; 
    box-sizing: border-box; 
  }
  html { scroll-behavior: smooth; height: 100%; }
  body { 
    background: #ffffff; color: #0f0f0f; overflow-x: hidden; 
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    opacity: 0;
    animation: appFadeIn 0.8s ease forwards;
  }

  @keyframes appFadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  ::selection { background: #153424; color: #ffffff; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #ffffff; }
  ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }

  /* ===== TRAIT D'EN-TÊTE : RACCOURCI + DÉGRADÉ ===== */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 40;
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .site-header::after {
    content: '';
    position: absolute;
    left: 8%;
    right: 8%;
    bottom: 0;
    height: 1px;
    background: linear-gradient(
      to right,
      transparent 0%,
      rgba(21, 52, 36, 0.10) 20%,
      rgba(21, 52, 36, 0.15) 50%,
      rgba(21, 52, 36, 0.10) 80%,
      transparent 100%
    );
    pointer-events: none;
  }

  .btn-minimal, .chip, .cat-option, .card-delete {
    -webkit-backface-visibility: hidden;
    backface-visibility: hidden;
    transform: translateZ(0);
    -webkit-font-smoothing: subpixel-antialiased;
  }

  /* ===== BLOC MARQUE : masthead éditorial ===== */
  .brand-group {
    display: inline-flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1;
    gap: 6px;
    padding: 2px 0;
  }

  .brand-title {
    font-family: 'Bodoni Moda', Georgia, serif;
    font-weight: 500;
    font-size: 33px;
    letter-spacing: -0.014em;
    color: #153424;
    line-height: 0.92;
    font-variation-settings: 'opsz' 96;
    transition: color 0.25s ease;
  }
  .brand-group:hover .brand-title {
    color: #1c4531;
  }

  .brand-tagline {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'Jost', sans-serif;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.34em;
    color: #888888;
    line-height: 1;
    padding-left: 1px;
    transition: color 0.25s ease;
  }
  .brand-tagline::before {
    content: '';
    display: block;
    width: 14px;
    height: 1px;
    background: rgba(21, 52, 36, 0.35);
    transition: width 0.3s ease, background-color 0.25s ease;
  }
  .brand-group:hover .brand-tagline {
    color: #555555;
  }
  .brand-group:hover .brand-tagline::before {
    width: 20px;
    background: rgba(21, 52, 36, 0.55);
  }

  .btn-minimal {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 24px; border-radius: 9999px;
    background: #153424; color: #ffffff;
    font-family: 'Jost', sans-serif; font-weight: 500; font-size: 13px;
    letter-spacing: 0.04em; cursor: pointer; border: 1px solid #153424;
    transition: background-color 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
    box-shadow: 0 2px 8px rgba(21, 52, 36, 0.08);
  }
  .btn-minimal:hover {
    background: #1c4531;
    border-color: #1c4531;
    box-shadow: 0 4px 12px rgba(21, 52, 36, 0.16);
  }
  .btn-minimal:active { opacity: 0.85; transition-duration: 0.05s; }
  .btn-minimal:disabled { opacity: 0.4; cursor: wait; box-shadow: none; }

  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 18px; border: 1px solid #e8e8e8; border-radius: 9999px;
    background: #ffffff; color: #555555;
    font-family: 'Jost', sans-serif; font-weight: 500; font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer; white-space: nowrap; flex-shrink: 0;
    transition: border-color 0.18s ease, color 0.18s ease, background-color 0.18s ease, box-shadow 0.18s ease;
  }
  .chip svg { width: 16px; height: 16px; color: #888888; transition: color 0.18s ease; flex-shrink: 0; }
  .chip:hover { border-color: #153424; color: #153424; }
  .chip:hover svg { color: #153424; }
  .chip:active { background: #f7f7f7; transition-duration: 0.05s; }
  .chip.active { background: #153424; border-color: #153424; color: #ffffff; }
  .chip.active svg { color: #ffffff; }

  .cat-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border: 1px solid #e8e8e8; border-radius: 14px;
    background: #ffffff; color: #0f0f0f;
    font-family: 'Jost', sans-serif; font-size: 13px; font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer; width: 100%;
    transition: border-color 0.18s ease, background-color 0.18s ease, color 0.18s ease;
  }
  .cat-option svg { width: 20px; height: 20px; color: #888888; transition: color 0.18s ease; }
  .cat-option:hover { border-color: #153424; }
  .cat-option:active { background: #f7f7f7; transition-duration: 0.05s; }
  .cat-option.active { border-color: #153424; background: #153424; color: #ffffff; }
  .cat-option.active svg { color: #ffffff; }

  .card-delete {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.95); color: #0f0f0f;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e5e5e5; cursor: pointer;
    z-index: 10; box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease;
  }
  .card-delete:hover { border-color: #153424; color: #153424; }
  .card-delete:active { background: #e11d48; color: #ffffff; border-color: #e11d48; transition-duration: 0.05s; }
  .card-delete.confirming {
    background: #e11d48 !important; color: #ffffff !important; border-color: #e11d48 !important;
  }
  .card-delete .icon-x, .card-delete .icon-check { position: absolute; width: 14px; height: 14px; }
  .card-delete .icon-check { opacity: 0; }
  .card-delete.confirming .icon-x { opacity: 0; }
  .card-delete.confirming .icon-check { opacity: 1; }

  .card { 
    opacity: 0; transform: translateY(12px); 
    transition: opacity 0.4s ease, transform 0.4s ease; 
  }
  .card.revealed { opacity: 1; transform: translateY(0); }
  
  .drawer-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.25); backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 420px; z-index: 100;
    background: #ffffff; border-left: 1px solid #f0f0f0;
    transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: translateX(0); }

  .field-label { 
    display: block; font-family: 'Jost', sans-serif; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.1em; color: #0f0f0f; margin-bottom: 6px; 
  }
  .field-input { 
    width: 100%; padding: 12px 16px; background: #ffffff;
    border: 1px solid #e5e5e5; border-radius: 12px; color: #0f0f0f;
    font-size: 15px; font-family: 'Jost', sans-serif;
    transition: border-color 0.18s ease, box-shadow 0.18s ease; 
  }
  .field-input:focus { outline: none; border-color: #153424; box-shadow: 0 0 0 3px rgba(21,52,36,0.05); }

  input[type="search"]::-webkit-search-cancel-button,
  input[type="search"]::-webkit-search-decoration { -webkit-appearance: none; appearance: none; }

  .search-minimal {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    background: transparent;
    position: relative;
    min-width: 0;
  }
  .search-minimal > svg {
    color: #888888;
    transition: color 0.18s ease;
    flex-shrink: 0;
  }
  .search-minimal:hover > svg,
  .search-minimal:focus-within > svg {
    color: #153424;
  }
  .search-minimal input {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    box-shadow: none;
    font-family: 'Jost', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: #0f0f0f;
    padding: 0;
    transition: color 0.18s ease;
  }
  .search-minimal input::placeholder {
    color: #888888;
    font-weight: 400;
    transition: color 0.18s ease;
  }
  .search-minimal input:hover::placeholder,
  .search-minimal input:focus::placeholder {
    color: #153424;
  }
  .search-clear {
    flex-shrink: 0;
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%;
    color: #888888;
    background: transparent;
    border: none;
    cursor: pointer;
    transition: color 0.18s ease, background-color 0.18s ease;
  }
  .search-clear:hover { color: #153424; background: rgba(21,52,36,0.06); }
  .search-clear:active { transition-duration: 0.05s; }

  .file-drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 16px; border: 1px dashed #dcdcdc; border-radius: 12px;
    background: #ffffff; cursor: pointer; transition: border-color 0.18s ease; text-align: center;
  }
  .file-drop:hover { border-color: #153424; }
  .file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .photo-preview { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; border: 1px solid #e5e5e5; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-preview-clear {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: #ffffff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; border: none; transition: background-color 0.18s ease;
  }
  .photo-preview-clear:hover { background: rgba(0,0,0,0.85); }

  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>

<body class="font-sans antialiased bg-white text-ink">

<header class="site-header">
  <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between gap-4">
    <a href="#" class="brand-group group">
      <span class="brand-title">Plantouille</span>
      <span class="brand-tagline">Cabinet Botanique</span>
    </a>

    <button id="open-drawer-btn" type="button" class="btn-minimal">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
      <span>Ajouter</span>
    </button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-6 w-full flex-1 pb-16">
  <section class="pt-5 pb-1 flex items-center justify-end">
    <div class="flex items-baseline gap-2 text-muted">
      <span id="stat-total" class="font-serif text-2xl text-brand font-medium">0</span>
      <span class="text-[11px] font-medium tracking-wider uppercase">spécimens</span>
    </div>
  </section>

  <!-- ===== RECHERCHE (seule, sans menu déroulant) ===== -->
  <section class="pb-4">
    <div class="search-minimal">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="plant-search" type="search" aria-label="Rechercher une plante" placeholder="Rechercher une plante…" autocomplete="off">
      <button type="button" id="clear-search" aria-label="Effacer la recherche" class="hidden search-clear">
        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
  </section>

  <section class="pb-6 overflow-x-auto no-scrollbar">
    <div class="flex flex-nowrap items-center gap-2.5 min-w-max">
      <button type="button" data-category="all" class="chip active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/></svg>
        <span>Toutes</span>
      </button>
      <button type="button" data-category="Cactus" class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 22V2"/><path d="M12 10H9a2 2 0 0 1-2-2V6"/><path d="M12 14h3a2 2 0 0 0 2-2v-2"/></svg>
        <span>Cactus</span>
      </button>

      <button type="button" data-category="Succulentes" class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z"/>
          <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(-30 12 21)"/>
          <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(30 12 21)"/>
          <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(-60 12 21)"/>
          <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(60 12 21)"/>
        </svg>
        <span>Succulentes</span>
      </button>

      <button type="button" data-category="Mesembryanthemum" class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="12" cy="14" rx="6" ry="5"/><path d="M12 9V6M9 6c1-1 5-1 6 0"/></svg>
        <span>Mesembryanthemum</span>
      </button>
      <button type="button" data-category="Tropicales" class="chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19c0-7 6-13 14-14-1 8-7 14-14 14zM5 19l8-8"/></svg>
        <span>Tropicales</span>
      </button>
    </div>
  </section>

  <section class="pb-12">
    <div id="plant-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" aria-live="polite"></div>
  </section>
</main>

<div id="drawer-backdrop" class="drawer-backdrop" aria-hidden="true"></div>

<aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="flex items-center justify-between p-5 border-b border-border">
    <h2 class="font-serif text-2xl text-brand font-medium">Nouveau Spécimen</h2>
    <button id="close-drawer-btn" type="button" aria-label="Fermer" class="text-muted hover:text-ink p-2 cursor-pointer transition-colors duration-150">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <form id="plant-form" class="flex-1 flex flex-col overflow-hidden" novalidate>
    <div class="flex-1 overflow-y-auto p-5 space-y-5">
      <div>
        <label for="plant-name" class="field-label">Nom de la plante</label>
        <input type="text" id="plant-name" required maxlength="120" placeholder="ex: Trichocereus pachanoi" class="field-input">
      </div>

      <div>
        <label class="field-label">Rubrique</label>
        <div id="category-picker" class="grid grid-cols-2 gap-2.5">
          <button type="button" class="cat-option" data-category="Cactus">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22V2"/><path d="M12 10H9a2 2 0 0 1-2-2V6"/><path d="M12 14h3a2 2 0 0 0 2-2v-2"/></svg>
            <span>Cactus</span>
          </button>

          <button type="button" class="cat-option" data-category="Succulentes">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z"/>
              <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(-30 12 21)"/>
              <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(30 12 21)"/>
              <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(-60 12 21)"/>
              <path d="M12 21 C 10.5 16 10.5 9 12 4 C 13.5 9 13.5 16 12 21 Z" transform="rotate(60 12 21)"/>
            </svg>
            <span>Succulentes</span>
          </button>

          <button type="button" class="cat-option" data-category="Mesembryanthemum">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><ellipse cx="12" cy="14" rx="6" ry="5"/><path d="M12 9V6M9 6c1-1 5-1 6 0"/></svg>
            <span>Mesemb</span>
          </button>
          <button type="button" class="cat-option" data-category="Tropicales">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 19c0-7 6-13 14-14-1 8-7 14-14 14zM5 19l8-8"/></svg>
            <span>Tropicales</span>
          </button>
        </div>
        <input type="hidden" id="plant-category" value="" required>
      </div>

      <div>
        <label class="field-label">Photographie</label>
        <div id="file-drop" class="file-drop relative">
          <svg class="w-6 h-6 text-muted mb-2 stroke-[1.2]" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 16V4M6 10l6-6 6 6M4 20h16"/></svg>
          <span class="text-xs text-ink font-medium">Sélectionner ou prendre une photo</span>
          <span class="text-[11px] text-muted mt-1">Appareil photo ou galerie</span>
          <input type="file" id="plant-photo" accept="image/*" required>
        </div>
        <div id="photo-preview" class="photo-preview hidden">
          <img id="photo-preview-img" alt="Aperçu">
          <button type="button" id="clear-photo" class="photo-preview-clear" aria-label="Retirer">×</button>
        </div>
      </div>

      <div>
        <label for="plant-details" class="field-label">Notes de culture</label>
        <textarea id="plant-details" rows="3" maxlength="500" placeholder="Exposition, substrat, remarques..." class="field-input resize-none"></textarea>
      </div>
    </div>

    <div class="p-5 border-t border-border bg-white">
      <button type="submit" id="submit-btn" class="btn-minimal w-full py-3.5">
        <span>Enregistrer le spécimen</span>
      </button>
    </div>
  </form>
</aside>

<div id="toast-container" class="fixed bottom-6 inset-x-4 flex flex-col items-center gap-2 z-[110] pointer-events-none"></div>

<script>
(function () {
  'use strict';

  const DB_NAME = 'plantouille-db';
  const DB_VERSION = 2;
  const STORE = 'plants';
  const MAX_WIDTH = 800;
  const QUALITY = 0.8;
  const $ = (id) => document.getElementById(id);

  const drawer = $('drawer');
  const drawerBackdrop = $('drawer-backdrop');
  const openDrawerBtn = $('open-drawer-btn');
  const closeDrawerBtn = $('close-drawer-btn');
  const form = $('plant-form');
  const grid = $('plant-grid');
  const toastContainer = $('toast-container');
  const submitBtn = $('submit-btn');

  const plantNameInput = $('plant-name');
  const plantCategoryInput = $('plant-category');
  const plantPhotoInput = $('plant-photo');
  const plantDetailsInput = $('plant-details');
  const fileDrop = $('file-drop');
  const photoPreview = $('photo-preview');
  const photoPreviewImg = $('photo-preview-img');
  const clearPhotoBtn = $('clear-photo');

  const categoryPicker = $('category-picker');
  const categoryButtons = Array.from(categoryPicker.querySelectorAll('.cat-option'));
  const chipButtons = Array.from(document.querySelectorAll('.chip'));

  const searchInput = $('plant-search');
  const clearSearchBtn = $('clear-search');

  let plants = [];
  let memFallback = false;
  let currentFilter = 'all';

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function normalize(str) {
    return String(str ?? '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toLowerCase();
  }

  function idbOpenRaw() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB indisponible'));
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('Erreur ouverture DB'));
    });
  }
  async function getDB() {
    if (memFallback) return null;
    try { return await idbOpenRaw(); }
    catch (err) { memFallback = true; return null; }
  }
  async function dbGetAll() {
    const db = await getDB();
    if (!db) return plants.slice();
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res(plants.slice());
      } catch (e) { res(plants.slice()); }
    });
  }
  async function dbPut(plant) {
    const db = await getDB();
    if (!db) return;
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(plant);
        tx.oncomplete = () => res();
      } catch (e) { res(); }
    });
  }
  async function dbDelete(id) {
    const db = await getDB();
    if (!db) return;
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => res();
      } catch (e) { res(); }
    });
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'pointer-events-auto px-4 py-2.5 bg-ink text-white text-xs font-normal rounded-full shadow-lg transition-all duration-200';
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function resizeImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > MAX_WIDTH) {
            h = Math.round((h * MAX_WIDTH) / w);
            w = MAX_WIDTH;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', QUALITY));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function openDrawer() {
    drawer.classList.add('open');
    drawerBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
    plantNameInput.focus();
  }

  function closeDrawer() {
    drawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
    document.body.style.overflow = '';
  }

  function clearPhotoSelection() {
    plantPhotoInput.value = '';
    photoPreviewImg.src = '';
    photoPreview.classList.add('hidden');
    fileDrop.classList.remove('hidden');
  }

  ['click', 'pointerdown', 'touchstart'].forEach(eventType => {
    if (openDrawerBtn) {
      openDrawerBtn.addEventListener(eventType, (e) => {
        e.preventDefault();
        openDrawer();
      }, { passive: false });
    }
    if (closeDrawerBtn) {
      closeDrawerBtn.addEventListener(eventType, (e) => {
        e.preventDefault();
        closeDrawer();
      }, { passive: false });
    }
    if (drawerBackdrop) {
      drawerBackdrop.addEventListener(eventType, (e) => {
        e.preventDefault();
        closeDrawer();
      }, { passive: false });
    }
  });

  categoryButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      categoryButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      plantCategoryInput.value = btn.getAttribute('data-category');
    });
  });

  chipButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      chipButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-category');
      renderGrid();
    });
  });

  function updateSearchClear() {
    clearSearchBtn.classList.toggle('hidden', searchInput.value.length === 0);
  }

  function getFilteredPlants() {
    const term = normalize(searchInput.value.trim());

    return plants.filter(p => {
      if (currentFilter !== 'all' && p.category !== currentFilter) return false;
      if (term) {
        const haystack = normalize(`${p.name} ${p.details || ''} ${p.category || ''}`);
        if (!haystack.includes(term)) return false;
      }
      return true;
    });
  }

  searchInput.addEventListener('input', () => {
    updateSearchClear();
    renderGrid();
  });

  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = '';
    updateSearchClear();
    searchInput.focus();
    renderGrid();
  });

  plantPhotoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const compressed = await resizeImage(file);
      photoPreviewImg.src = compressed;
      fileDrop.classList.add('hidden');
      photoPreview.classList.remove('hidden');
    } catch (err) {
      showToast("Erreur d'image");
    }
  });

  clearPhotoBtn.addEventListener('click', clearPhotoSelection);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = plantNameInput.value.trim();
    const category = plantCategoryInput.value;
    const details = plantDetailsInput.value.trim();
    const photoSrc = photoPreviewImg.src;

    if (!name || !category || !photoSrc) {
      showToast("Veuillez remplir les champs obligatoires");
      return;
    }

    submitBtn.disabled = true;
    try {
      const newPlant = {
        id: 'p_' + Date.now(),
        name,
        category,
        photo: photoSrc,
        details,
        date: Date.now()
      };

      await dbPut(newPlant);
      plants.unshift(newPlant);

      searchInput.value = '';
      updateSearchClear();
      currentFilter = 'all';
      chipButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-category') === 'all'));

      renderGrid();
      updateStats();
      closeDrawer();
      form.reset();
      clearPhotoSelection();
      categoryButtons.forEach(btn => btn.classList.remove('active'));
      plantCategoryInput.value = '';
      showToast("Spécimen enregistré");
    } catch (err) {
      showToast("Erreur d'enregistrement");
    } finally {
      submitBtn.disabled = false;
    }
  });

  function updateStats() {
    $('stat-total').textContent = plants.length;
  }

  async function deletePlant(id) {
    await dbDelete(id);
    plants = plants.filter(p => p.id !== id);
    renderGrid();
    updateStats();
    showToast("Spécimen retiré");
  }

  function renderGrid() {
    const filtered = getFilteredPlants();
    grid.innerHTML = '';

    if (filtered.length === 0) {
      const message = plants.length === 0
        ? "Aucun spécimen pour l'instant — ajoutez votre première plante."
        : "Aucun spécimen ne correspond à votre recherche.";
      grid.innerHTML = `
        <div class="col-span-full flex flex-col items-center text-center py-20 gap-3">
          <svg class="w-9 h-9 text-muted/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21V11"/>
            <path d="M12 13c-3.5 0-6-2.5-6-6 3.5 0 6 2.5 6 6z"/>
            <path d="M12 15c3.5 0 6-2.5 6-6-3.5 0-6 2.5-6 6z"/>
          </svg>
          <p class="text-sm text-muted font-light">${message}</p>
        </div>`;
      return;
    }

    filtered.forEach((plant) => {
      const card = document.createElement('article');
      card.className = 'card border border-border rounded-2xl overflow-hidden bg-white flex flex-col relative group shadow-sm';

      card.innerHTML = `
        <div class="relative aspect-[4/3] bg-white overflow-hidden border-b border-border">
          <img src="${escapeHtml(plant.photo)}" alt="${escapeHtml(plant.name)}" class="w-full h-full object-cover">
          <button type="button" class="card-delete" aria-label="Supprimer">
            <svg class="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
        </div>
        <div class="p-5 flex flex-col flex-1 justify-between">
          <div>
            <span class="text-[10px] uppercase tracking-wider text-brand font-semibold">${escapeHtml(plant.category)}</span>
            <h3 class="font-serif text-xl font-normal text-ink leading-tight mt-1">${escapeHtml(plant.name)}</h3>
          </div>
          ${plant.details ? `<p class="text-xs text-muted font-light mt-3 line-clamp-2 leading-relaxed">${escapeHtml(plant.details)}</p>` : ''}
        </div>
      `;

      const delBtn = card.querySelector('.card-delete');
      let confirmTimeout = null;
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!delBtn.classList.contains('confirming')) {
          delBtn.classList.add('confirming');
          clearTimeout(confirmTimeout);
          confirmTimeout = setTimeout(() => delBtn.classList.remove('confirming'), 2500);
        } else {
          deletePlant(plant.id);
        }
      });

      grid.appendChild(card);
      requestAnimationFrame(() => card.classList.add('revealed'));
    });
  }

  async function init() {
    try {
      plants = await dbGetAll();
      plants.sort((a, b) => b.date - a.date);
    } catch (e) { plants = []; }
    updateSearchClear();
    renderGrid();
    updateStats();
  }

  init();
})();
</script>

</body>
</html>
