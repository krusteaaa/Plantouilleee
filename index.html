<head>

<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
  html { scroll-behavior: smooth; height: 100%; }
  body { 
    background: #ffffff; color: #0f0f0f; overflow-x: hidden; 
    text-rendering: optimizeLegibility;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex;
    flex-direction: column;
  }

  ::selection { background: #153424; color: #ffffff; }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: #ffffff; }
  ::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }

  /* Splash Screen San Pedro */
  #san-pedro-intro {
    position: fixed; inset: 0; z-index: 90;
    background: #ffffff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  #san-pedro-intro.hidden-intro {
    opacity: 0; visibility: hidden; pointer-events: none;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in { animation: fadeIn 0.7s ease forwards; }

  /* Nouveau style de bouton minimaliste élégant avec animation de zoom et lueur */
  .btn-minimal {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 22px; border-radius: 9999px;
    background: #153424; color: #ffffff;
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px;
    letter-spacing: 0.02em; cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    box-shadow: 0 4px 12px rgba(21, 52, 36, 0.12);
  }
  .btn-minimal:hover {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 20px rgba(21, 52, 36, 0.22);
    background: #1c4531;
  }
  .btn-minimal:active { transform: scale(0.97); }
  .btn-minimal:disabled { opacity: 0.4; cursor: wait; transform: none; box-shadow: none; }

  /* Puces de filtres (Chips) avec animation subtile */
  .chip {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border: 1px solid #e5e5e5; border-radius: 9999px;
    background: #ffffff; color: #555555;
    font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px;
    cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    white-space: nowrap; flex-shrink: 0;
  }
  .chip svg { width: 14px; height: 14px; color: #777777; transition: all 0.25s ease; flex-shrink: 0; }
  .chip:hover {
    transform: translateY(-2px) scale(1.04);
    border-color: #153424;
    color: #153424;
    box-shadow: 0 4px 12px rgba(21, 52, 36, 0.08);
  }
  .chip:hover svg { color: #153424; }
  .chip.active { background: #153424; border-color: #153424; color: #ffffff; box-shadow: 0 4px 14px rgba(21, 52, 36, 0.2); }
  .chip.active svg { color: #ffffff; }

  /* Options de catégories */
  .cat-option {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; border: 1px solid #e5e5e5; border-radius: 12px;
    background: #ffffff; color: #0f0f0f;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
    cursor: pointer; width: 100%; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .cat-option svg { width: 18px; height: 18px; color: #888888; transition: all 0.25s ease; }
  .cat-option:hover {
    transform: scale(1.02);
    border-color: #153424;
    box-shadow: 0 4px 12px rgba(21, 52, 36, 0.06);
  }
  .cat-option.active { border-color: #153424; background: #153424; color: #ffffff; box-shadow: 0 4px 14px rgba(21, 52, 36, 0.2); }
  .cat-option.active svg { color: #ffffff; }

  .card-delete {
    position: absolute; top: 12px; right: 12px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255, 255, 255, 0.9); color: #0f0f0f;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid #e5e5e5; cursor: pointer;
    z-index: 10; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    transition: transform 0.2s ease, background-color 0.2s;
  }
  .card-delete:hover { transform: scale(1.1); }
  .card-delete:active { background: #e11d48; color: #ffffff; border-color: #e11d48; }
  .card-delete.confirming {
    background: #e11d48 !important; color: #ffffff !important; border-color: #e11d48 !important;
  }
  .card-delete .icon-x, .card-delete .icon-check { position: absolute; width: 14px; height: 14px; }
  .card-delete .icon-check { opacity: 0; }
  .card-delete.confirming .icon-x { opacity: 0; }
  .card-delete.confirming .icon-check { opacity: 1; }

  .card { 
    opacity: 0; transform: translateY(16px); 
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease; 
  }
  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.06);
  }
  .card.revealed { opacity: 1; transform: translateY(0); }
  
  .drawer-backdrop { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
  .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 420px; z-index: 100;
    background: #ffffff; border-left: 1px solid #e5e5e5;
    transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column;
    box-shadow: -15px 0 40px rgba(0,0,0,0.04);
  }
  .drawer.open { transform: translateX(0); }

  .field-label { 
    display: block; font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.06em; color: #0f0f0f; margin-bottom: 6px; 
  }
  .field-input { 
    width: 100%; padding: 12px 16px; background: #fafafa;
    border: 1px solid #e5e5e5; border-radius: 12px; color: #0f0f0f;
    font-size: 15px; font-family: 'Inter', sans-serif;
    transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s; 
  }
  .field-input:focus { outline: none; border-color: #153424; background: #ffffff; box-shadow: 0 0 0 3px rgba(21,52,36,0.06); }

  .file-drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 28px 16px; border: 1px dashed #dcdcdc; border-radius: 12px;
    background: #fafafa; cursor: pointer; transition: all 0.25s; text-align: center;
  }
  .file-drop:hover { border-color: #153424; background: #f5f8f6; }
  .file-drop input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

  .photo-preview { position: relative; width: 100%; aspect-ratio: 4 / 3; border-radius: 12px; overflow: hidden; border: 1px solid #e5e5e5; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .photo-preview-clear {
    position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 50%;
    background: rgba(0,0,0,0.7); color: #ffffff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; border: none;
  }

  .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
</style>
</head>

<script>
(function () {
  'use strict';

  window.addEventListener('load', () => {
    const intro = document.getElementById('san-pedro-intro');
    setTimeout(() => {
      if (intro) intro.classList.add('hidden-intro');
    }, 600);
  });

  const DB_NAME = 'plantouille-db';
  const DB_VERSION = 2;
  const STORE = 'plants';
  const MAX_WIDTH = 800;
  const QUALITY = 0.8;
  const $ = (id) => document.getElementById(id);

  const drawer = $('drawer');
  const drawerBackdrop = $('drawer-backdrop');
  const openDrawerBtn = $('open-drawer-btn');
  const closeDrawerBtn = $('close-drawer-btn');
  const form = $('plant-form');
  const grid = $('plant-grid');
  const emptyState = $('empty-state');
  const toastContainer = $('toast-container');
  const submitBtn = $('submit-btn');

  const plantNameInput = $('plant-name');
  const plantCategoryInput = $('plant-category');
  const plantPhotoInput = $('plant-photo');
  const plantDetailsInput = $('plant-details');
  const fileDrop = $('file-drop');
  const photoPreview = $('photo-preview');
  const photoPreviewImg = $('photo-preview-img');
  const clearPhotoBtn = $('clear-photo');

  const categoryPicker = $('category-picker');
  const categoryButtons = Array.from(categoryPicker.querySelectorAll('.cat-option'));
  const chipButtons = Array.from(document.querySelectorAll('.chip'));

  let plants = [];
  let memFallback = false;
  let currentFilter = 'all';

  function escapeHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  function idbOpenRaw() {
    return new Promise((resolve, reject) => {
      if (!('indexedDB' in window)) return reject(new Error('IndexedDB indisponible'));
      let req;
      try { req = indexedDB.open(DB_NAME, DB_VERSION); }
      catch (e) { return reject(e); }
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('Erreur ouverture DB'));
    });
  }
  async function getDB() {
    if (memFallback) return null;
    try { return await idbOpenRaw(); }
    catch (err) { memFallback = true; return null; }
  }
  async function dbGetAll() {
    const db = await getDB();
    if (!db) return plants.slice();
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readonly');
        const req = tx.objectStore(STORE).getAll();
        req.onsuccess = () => res(req.result || []);
        req.onerror = () => res(plants.slice());
      } catch (e) { res(plants.slice()); }
    });
  }
  async function dbPut(plant) {
    const db = await getDB();
    if (!db) return;
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).put(plant);
        tx.oncomplete = () => res();
      } catch (e) { res(); }
    });
  }
  async function dbDelete(id) {
    const db = await getDB();
    if (!db) return;
    return new Promise((res) => {
      try {
        const tx = db.transaction(STORE, 'readwrite');
        tx.objectStore(STORE).delete(id);
        tx.oncomplete = () => res();
      } catch (e) { res(); }
    });
  }

  function showToast(message) {
    const toast = document.createElement('div');
    toast.className = 'pointer-events-auto px-4 py-2.5 bg-ink text-white text-xs font-normal rounded-full shadow-lg transition-all duration-200';
    toast.textContent = message;
    toastContainer.appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function resizeImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > MAX_WIDTH) {
            h = Math.round((h * MAX_WIDTH) / w);
            w = MAX_WIDTH;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', QUALITY));
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function openDrawer() {
    drawer.classList.add('open');
    drawerBackdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
    plantNameInput.focus();
  }

  function closeDrawer() {
    drawer.classList.remove('open');
    drawerBackdrop.classList.remove('open');
    document.body.style.overflow = '';
  }

  function clearPhotoSelection() {
    plantPhotoInput.value = '';
    photoPreviewImg.src = '';
    photoPreview.classList.add('hidden');
    fileDrop.classList.remove('hidden');
  }

  ['click', 'pointerdown', 'touchstart'].forEach(eventType => {
    if (openDrawerBtn) {
      openDrawerBtn.addEventListener(eventType, (e) => {
        e.preventDefault();
        openDrawer();
      }, { passive: false });
    }
    if (closeDrawerBtn) {
      closeDrawerBtn.addEventListener(eventType, (e) => {
        e.preventDefault();
        closeDrawer();
      }, { passive: false });
    }
    if (drawerBackdrop) {
      drawerBackdrop.addEventListener(eventType, (e) => {
        e.preventDefault();
        closeDrawer();
      }, { passive: false });
    }
  });

  categoryButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      categoryButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      plantCategoryInput.value = btn.getAttribute('data-category');
    });
  });

  chipButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      chipButtons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.getAttribute('data-category');
      renderGrid();
    });
  });

  plantPhotoInput.addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const compressed = await resizeImage(file);
      photoPreviewImg.src = compressed;
      fileDrop.classList.add('hidden');
      photoPreview.classList.remove('hidden');
    } catch (err) {
      showToast("Erreur d'image");
    }
  });

  clearPhotoBtn.addEventListener('click', clearPhotoSelection);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = plantNameInput.value.trim();
    const category = plantCategoryInput.value;
    const details = plantDetailsInput.value.trim();
    const photoSrc = photoPreviewImg.src;

    if (!name || !category || !photoSrc) {
      showToast("Veuillez remplir les champs obligatoires");
      return;
    }

    submitBtn.disabled = true;
    try {
      const newPlant = {
        id: 'p_' + Date.now(),
        name,
        category,
        photo: photoSrc,
        details,
        date: Date.now()
      };

      await dbPut(newPlant);
      plants.unshift(newPlant);
      renderGrid();
      updateStats();
      closeDrawer();
      form.reset();
      clearPhotoSelection();
      categoryButtons.forEach(btn => btn.classList.remove('active'));
      plantCategoryInput.value = '';
      showToast("Spécimen enregistré");
    } catch (err) {
      showToast("Erreur d'enregistrement");
    } finally {
      submitBtn.disabled = false;
    }
  });

  function updateStats() {
    $('stat-total').textContent = plants.length;
  }

  async function deletePlant(id) {
    await dbDelete(id);
    plants = plants.filter(p => p.id !== id);
    renderGrid();
    updateStats();
    showToast("Spécimen retiré");
  }

  function renderGrid() {
    const filtered = currentFilter === 'all' ? plants : plants.filter(p => p.category === currentFilter);
    grid.innerHTML = '';
    if (filtered.length === 0) {
      emptyState.classList.remove('hidden');
      return;
    }
    emptyState.classList.add('hidden');

    filtered.forEach((plant) => {
      const card = document.createElement('article');
      card.className = 'card border border-border rounded-2xl overflow-hidden bg-white flex flex-col relative group shadow-sm';

      card.innerHTML = `
        <div class="relative aspect-[4/3] bg-surface overflow-hidden border-b border-border">
          <img src="${escapeHtml(plant.photo)}" alt="${escapeHtml(plant.name)}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
          <button type="button" class="card-delete" aria-label="Supprimer">
            <svg class="icon-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>
            <svg class="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
        </div>
        <div class="p-5 flex flex-col flex-1 justify-between">
          <div>
            <span class="text-[10px] uppercase tracking-wider text-brand font-semibold">${escapeHtml(plant.category)}</span>
            <h3 class="font-serif text-xl font-normal text-ink leading-tight mt-1">${escapeHtml(plant.name)}</h3>
          </div>
          ${plant.details ? `<p class="text-xs text-muted font-light mt-3 line-clamp-2 leading-relaxed">${escapeHtml(plant.details)}</p>` : ''}
        </div>
      `;

      const delBtn = card.querySelector('.card-delete');
      let confirmTimeout = null;
      delBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!delBtn.classList.contains('confirming')) {
          delBtn.classList.add('confirming');
          clearTimeout(confirmTimeout);
          confirmTimeout = setTimeout(() => delBtn.classList.remove('confirming'), 2500);
        } else {
          deletePlant(plant.id);
        }
      });

      grid.appendChild(card);
      requestAnimationFrame(() => card.classList.add('revealed'));
    });
  }

  async function init() {
    try {
      plants = await dbGetAll();
      plants.sort((a, b) => b.date - a.date);
    } catch (e) { plants = []; }
    renderGrid();
    updateStats();
  }

  init();
})();
</script>

</body>
</html>
