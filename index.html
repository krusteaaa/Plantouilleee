<style>

  .field-input { width: 100%; padding: 12px 16px; background: #f7f7f7; border: none; border-radius: 12px; color: #0f0f0f; font-size: 14px; font-family: 'Jost', sans-serif; }
  .field-input:focus { outline: none; background: #eef2f0; }

  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; }
  .search-minimal { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
  .search-minimal > svg { color: #888888; flex-shrink: 0; }

  .search-clear { flex-shrink: 0; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #888888; background: transparent; border: none; cursor: pointer; }

  main { position: relative; }
  #seasonal-bg { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 92%); -webkit-mask-image: linear-gradient(to bottom, black 0%, black 80%, transparent 92%); }

  .demo-banner { display: none; padding: 10px 16px; background: #fef7e6; border: 1px solid #f3e0b0; border-radius: 12px; color: #7a5e1e; font-size: 12px; font-family: 'Jost', sans-serif; line-height: 1.4; }

<div id="seasonal-bg" aria-hidden="true"></div>

<main class="max-w-6xl mx-auto px-6 w-full flex-1 pb-16">

  <section class="pb-4">

  const lightbox = $('lightbox');
  const lightboxContent = $('lightbox-content');
  const lightboxImg = $('lightbox-img');
  const lightboxBack = $('lightbox-back');
  const lbCat = $('lb-cat'); const lbName = $('lb-name'); const lbFamily = $('lb-family');
  const lbExpoWrap = $('lb-expo-wrap'); const lbExpo = $('lb-expo');
  const lbTempWrap = $('lb-temp-wrap'); const lbTemp = $('lb-temp');
  const lbSubstrateWrap = $('lb-substrate-wrap'); const lbSubstrate = $('lb-substrate');
  const lbOriginWrap = $('lb-origin-wrap'); const lbOrigin = $('lb-origin');

  const filterChipsStep = $('filter-chips-step');
  const filterSpeciesStep = $('filter-species-step');
  const filterBackBtn = $('filter-back-btn');
  const filterSpeciesWrapper = $('filter-species-wrapper');
  const filterSpeciesTrigger = $('filter-species-trigger');
  const filterSpeciesLabel = filterSpeciesTrigger.querySelector('.trigger-label');
  const filterSpeciesDropdown = $('filter-species-dropdown');
  const filterGenreCustomInput = $('filter-genre-custom-input');
  const filterChipButtons = Array.from(document.querySelectorAll('#filter-chips-step .chip'));

  let plants = [];
  let currentFilter = 'all';

  const escapeHtml = (str) => String(str ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const normalize = (str) => String(str ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

  function updateBackdrop() { pageBackdrop.classList.toggle('visible', filterSpeciesWrapper.classList.contains('open')); }
  pageBackdrop.addEventListener('click', () => { document.querySelectorAll('main .custom-select-wrapper.open').forEach(w => w.classList.remove('open')); updateBackdrop(); });

  function showChipsStep() {
    filterSpeciesStep.classList.add('step-hidden');
    filterChipsStep.classList.remove('step-hidden');
    filterChipsStep.classList.remove('step-fade-in');
    void filterChipsStep.offsetWidth;
    filterChipsStep.classList.add('step-fade-in');
    filterChipsStep.style.position = '';
    filterSpeciesStep.style.position = 'absolute';
    currentFilter = 'all';
    filterChipButtons.forEach(b => b.classList.toggle('active', b.getAttribute('data-category') === 'all'));
    filterSpeciesWrapper.classList.remove('open');
    filterGenreCustomInput.value = '';
    filterSpeciesLabel.textContent = 'Sélectionner un genre...';
    filterSpeciesTrigger.classList.add('placeholder');
    updateBackdrop();
  }

  function showSpeciesStep(category) {
    filterChipsStep.classList.add('step-hidden');
    filterSpeciesStep.classList.remove('step-hidden');
    filterSpeciesStep.classList.remove('step-fade-in');
    void filterSpeciesStep.offsetWidth;
    filterSpeciesStep.classList.add('step-fade-in');
    filterSpeciesStep.style.position = '';
    filterChipsStep.style.position = 'absolute';
    currentFilter = category;
    let html = '<div class="custom-option-group-label">' + category + '</div>';
    SPECIES[category].forEach(sp => {
      html += '<div class="custom-option" data-species="' + escapeHtml(sp) + '">' + escapeHtml(sp) + '</div>';
    });
    filterSpeciesDropdown.innerHTML = html;
    filterSpeciesLabel.textContent = 'Sélectionner un genre...';
    filterSpeciesTrigger.classList.add('placeholder');
    filterSpeciesWrapper.classList.remove('open');
    filterGenreCustomInput.value = '';
    renderGrid();
    updateBackdrop();
  }

  filterChipButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const cat = btn.getAttribute('data-category');
      if (cat === 'all') {
        filterChipButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = 'all';
        renderGrid();
      } else {
        showSpeciesStep(cat);
      }
    });
  });

  filterBackBtn.addEventListener('click', showChipsStep);

  filterSpeciesTrigger.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-select-wrapper.open').forEach(w => { if (w !== filterSpeciesWrapper) w.classList.remove('open'); });

  function formatTemp(t) { if (t === undefined || t === null || t === '') return null; const n = Number(t); return (n > 0 ? '+' + n : n) + ' °C'; }

  function fillLightboxInfo(plant) {
    lbCat.textContent = plant.category || '';
    lbName.textContent = plant.name || '';
    lbFamily.textContent = plant.family || '';
    lbFamily.style.display = plant.family ? 'block' : 'none';
    if (plant.exposure) { lbExpoWrap.style.display = 'flex'; lbExpo.textContent = plant.exposure; } else { lbExpoWrap.style.display = 'none'; }
    const tempStr = formatTemp(plant.minTemp);
    if (tempStr) { lbTempWrap.style.display = 'flex'; lbTemp.textContent = tempStr; } else { lbTempWrap.style.display = 'none'; }
    if (plant.substrate) { lbSubstrateWrap.style.display = 'flex'; lbSubstrate.textContent = plant.substrate; } else { lbSubstrateWrap.style.display = 'none'; }
    if (plant.origin) { lbOriginWrap.style.display = 'flex'; lbOrigin.textContent = plant.origin; } else { lbOriginWrap.style.display = 'none'; }
  }

  function openLightbox(plant) {
    lightboxContent.classList.remove('is-portrait', 'is-landscape');
    fillLightboxInfo(plant);
    lightboxImg.onload = function () {
      const w = lightboxImg.naturalWidth || 0; const h = lightboxImg.naturalHeight || 0;
      lightboxContent.classList.remove('is-portrait', 'is-landscape');
      lightboxContent.classList.add(h > w ? 'is-portrait' : 'is-landscape');
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      lightbox.scrollTop = 0;
    };
    lightboxImg.onerror = function () {
      lightboxContent.classList.remove('is-portrait', 'is-landscape');
      lightboxContent.classList.add('is-landscape');
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    };
    lightboxImg.alt = plant.name || '';
    lightboxImg.src = plant.photo;
  }

  function closeLightbox() {
    lightbox.classList.remove('open');
    lightbox.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  lightboxBack.addEventListener('click', (e) => { e.stopPropagation(); closeLightbox(); });
  lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lightbox.classList.contains('open')) closeLightbox(); });

  function updateSearchClear() { clearSearchBtn.classList.toggle('hidden', searchInput.value.length === 0); }

  function getFilteredPlants() {
    const term = normalize(searchInput.value.trim());
    const genreTerm = normalize(filterGenreCustomInput.value.trim());
    return plants.filter(p => {
      if (currentFilter !== 'all' && p.category !== currentFilter) return false;
      if (genreTerm && !normalize(p.name).includes(genreTerm)) return false;
      if (term) {
        const haystack = normalize((p.name || '') + ' ' + (p.family || '') + ' ' + (p.substrate || '') + ' ' + (p.exposure || '') + ' ' + (p.origin || '') + ' ' + (p.category || ''));
        if (!haystack.includes(term)) return false;
      }
      return true;
    });
  }

  searchInput.addEventListener('input', () => { updateSearchClear(); renderGrid(); });
  clearSearchBtn.addEventListener('click', () => {
    searchInput.value = ''; updateSearchClear(); searchInput.focus(); renderGrid();
  });

  function renderGrid() {
    const filtered = getFilteredPlants();
    grid.innerHTML = '';

    if (filtered.length === 0) {
      const message = plants.length === 0
        ? "Aucun spécimen dans la collection pour l'instant."
        : "Aucun spécimen ne correspond à votre recherche.";
      grid.innerHTML = '<div class="col-span-full flex flex-col items-center text-center py-20 gap-3">' +
        '<svg class="w-9 h-9 text-muted/60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12 21V11"/><path d="M12 13c-3.5 0-6-2.5-6-6 3.5 0 6 2.5 6 6z"/></svg>' +
        '<p class="text-sm text-muted font-light">' + message + '</p></div>';
      return;
    }

    filtered.forEach((plant) => {
      const card = document.createElement('article');
      card.className = 'card border border-border rounded-2xl overflow-hidden bg-white flex flex-col relative group shadow-sm';
      const tempFormatted = formatTemp(plant.minTemp);

      let infoHtml = '';
      if (plant.exposure) infoHtml += '<div><span class="font-medium text-ink">Expo:</span> ' + escapeHtml(plant.exposure) + '</div>';
      if (tempFormatted) infoHtml += '<div><span class="font-medium text-ink">Min:</span> ' + escapeHtml(tempFormatted) + '</div>';
      if (plant.substrate) infoHtml += '<div class="col-span-2"><span class="font-medium text-ink">Substrat:</span> ' + escapeHtml(plant.substrate) + '</div>';
      if (plant.origin) infoHtml += '<div class="col-span-2"><span class="font-medium text-ink">Origine:</span> ' + escapeHtml(plant.origin) + '</div>';

      card.innerHTML =
        '<div class="relative aspect-[4/3] bg-[#fafafa] overflow-hidden border-b border-border">' +
          '<img class="card-photo w-full h-full object-cover" src="' + escapeHtml(plant.photo) + '" alt="' + escapeHtml(plant.name) + '" loading="lazy">' +
        '</div>' +
        '<div class="p-5 flex flex-col flex-1 justify-between gap-3">' +
          '<div>' +
            '<span class="text-[10px] uppercase tracking-wider text-brand font-semibold">' + escapeHtml(plant.category) + '</span>' +
            '<h3 class="font-serif text-xl font-normal text-ink leading-tight mt-0.5">' + escapeHtml(plant.name) + '</h3>' +
            (plant.family ? '<p class="text-xs italic text-muted mt-0.5">' + escapeHtml(plant.family) + '</p>' : '') +
          '</div>' +
          '<div class="grid grid-cols-2 gap-2 pt-2 border-t border-border/60 text-[11px] text-muted">' + infoHtml + '</div>' +
        '</div>';

      const imgEl = card.querySelector('.card-photo');
      if (imgEl) imgEl.addEventListener('click', () => openLightbox(plant));

      grid.appendChild(card);
      requestAnimationFrame(() => card.classList.add('revealed'));
    });
  }

  async function loadCollection() {
    try {
      const res = await fetch('./collection.json', { cache: 'no-cache' });
      if (!res.ok) throw new Error('introuvable');
      const data = await res.json();
      let arr = null;
      if (Array.isArray(data)) arr = data;
      else if (data && Array.isArray(data.plants)) arr = data.plants;
      if (!arr || arr.length === 0) throw new Error('vide');
      return { plants: arr, isFallback: false };
    } catch (err) {
      return { plants: FALLBACK_PLANTS.slice(), isFallback: true };
    }
  }

  async function init() {
    const result = await loadCollection();
    plants = result.plants;
    plants.sort((a, b) => (b.date || 0) - (a.date || 0));
    if (result.isFallback) demoBanner.classList.add('visible');
    document.getElementById('stat-total').textContent = plants.length;
    updateSearchClear();
    showChipsStep();
    renderGrid();
  }
  init();
})();
</script>

<script>
(function () {
  const container = document.getElementById('seasonal-bg');
  if (!container) return;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const rnd = (min, max) => Math.random() * (max - min) + min;
  const month = new Date().getMonth() + 1;
  let season;
  if (month >= 3 && month <= 5) season = 'spring';
  else if (month >= 6 && month <= 8) season = 'summer';
  else if (month >= 9 && month <= 11) season = 'autumn';
  else season = 'winter';
  const forced = new URLSearchParams(window.location.search).get('season');
  if (forced && ['spring','summer','autumn','winter'].includes(forced)) season = forced;
  if (season === 'autumn') {
    const COLORS = ['#7a9e4b','#8fae5d','#6b8e3e','#9bb874','#8a8a52'];
    const SHAPE = '<svg viewBox="0 0 20 30" xmlns="http://www.w3.org/2000/svg"><path d="M10 1 C 4.5 10, 4.5 21, 10 29 C 15.5 21, 15.5 10, 10 1 Z" fill="currentColor"/></svg>';
    for (let i = 0; i < 5; i++) {
      const leaf = document.createElement('div');
      leaf.className = 'season-leaf';
      const size = rnd(6, 10);
      leaf.style.left = rnd(-5, 105) + '%';
      leaf.style.width = size + 'px';
      leaf.style.height = (size * 1.4) + 'px';
      leaf.style.color = COLORS[Math.floor(Math.random() * COLORS.length)];
      leaf.style.setProperty('--drift', rnd(-15, 25).toFixed(1) + 'vw');
      leaf.style.setProperty('--opacity', rnd(0.20, 0.40).toFixed(2));
      leaf.style.animationDuration = rnd(22, 32).toFixed(2) + 's';
      leaf.style.animationDelay = '-' + rnd(0, 32).toFixed(2) + 's';
      leaf.innerHTML = SHAPE;
      container.appendChild(leaf);
    }
  } else if (season === 'winter') {
    for (let i = 0; i < 14; i++) {
      const flake = document.createElement('div');
      flake.className = 'season-snow';
      const size = rnd(1.2, 2.2);
      flake.style.left = rnd(0, 100) + '%';
      flake.style.width = size + 'px';
      flake.style.height = size + 'px';
      flake.style.setProperty('--drift', rnd(-12, 12).toFixed(1) + 'vw');
      flake.style.setProperty('--opacity', rnd(0.20, 0.40).toFixed(2));
      flake.style.animationDuration = rnd(20, 30).toFixed(2) + 's';
      flake.style.animationDelay = '-' + rnd(0, 30).toFixed(2) + 's';
      container.appendChild(flake);
    }
  } else if (season === 'spring') {
    function burst() {
      for (let i = 0; i < 4 + Math.floor(Math.random() * 3); i++) {
        setTimeout(() => {
          const drop = document.createElement('div');
          drop.className = 'season-rain';
          drop.style.left = rnd(0, 100) + '%';
          drop.style.setProperty('--drift', rnd(-3, 3).toFixed(1) + 'vw');
          drop.style.animationDuration = rnd(2.2, 3.5).toFixed(2) + 's';
          container.appendChild(drop);
          setTimeout(() => drop.remove(), 4000);
        }, Math.random() * 3500);
      }
    }
    setTimeout(burst, 2200);
    (function next() { setTimeout(() => { burst(); next(); }, 15000 + Math.random() * 8000); })();
  }
})();
</script>
