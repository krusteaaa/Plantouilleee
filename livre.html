<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Livre d'or — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --bronze: #b8860b;
    --hairline: rgba(45, 74, 43, 0.16);
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  .page-content {
    max-width: 800px;
    margin: 0 auto;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .brand-title-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter {
    display: inline-block;
    font-style: normal;
    will-change: transform;
  }

  h1.wave-text .l-bronze {
    color: #b8860b;
    -webkit-text-fill-color: #b8860b;
  }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: #b8860b !important;
    -webkit-text-fill-color: #b8860b !important;
    background: transparent !important;
    font-style: normal !important;
  }

  /* ----- Barre de recherche ----- */
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--f); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  /* ----- Actions en haut à droite + Menu + absolu ----- */
  .header-actions {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
    padding-top: 0.4rem;
  }

  .plus-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    cursor: pointer;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    padding: 0;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .plus-btn .plus {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-size: 1.3rem;
    margin-right: 0.3rem;
    vertical-align: -0.05em;
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .plus-btn:hover,
  .plus-btn:focus {
    color: var(--ch);
  }

  .plus-btn[aria-expanded="true"] .plus {
    transform: rotate(45deg);
  }

  .plus-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 0.5rem;
    background: var(--bg);
    border: 1px solid var(--hairline);
    padding: 0.65rem 0.9rem;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
    min-width: 165px;
    z-index: 40;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .plus-menu.is-open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .menu-item-link {
    display: inline-block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--cd);
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.35s ease, opacity 0.8s ease, transform 0.8s ease;
  }

  .menu-item-link:hover,
  .menu-item-link:focus {
    color: var(--ch);
  }

  .menu-item-link .word {
    display: inline-flex;
    align-items: baseline;
  }

  .menu-item-link .word > span {
    display: inline-block;
    will-change: transform;
  }

  .menu-item-link.is-fading {
    opacity: 0;
    pointer-events: none;
  }

  .menu-item-link.is-leaving {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-14px);
  }

  /* ===================== LOGO ===================== */
  .brand-logo {
    display: block;
    margin: 1rem auto 2.5rem;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 600px;
    object-fit: contain;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  /* ===================== LIVRE D'OR ===================== */
  .guestbook-section {
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  }

  .guestbook-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 1.75rem;
  }

  .guestbook-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 4.5vw, 2.75rem);
    line-height: 1.1;
    color: var(--cd);
  }

  .lock-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--cd);
    cursor: pointer;
    padding: 0;
    transition: color 0.3s ease;
  }

  .lock-btn:hover,
  .lock-btn:focus {
    color: var(--ch);
  }

  .lock-btn.is-unlocked {
    color: var(--bronze);
  }

  .guestbook-form {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    padding-bottom: 2rem;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 2rem;
  }

  .form-row {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
  }

  .field-input,
  .field-select,
  .field-textarea {
    background: none;
    border: none;
    border-bottom: 1px solid var(--hairline);
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--cd);
    padding: 0.35rem 0;
    transition: border-color 0.3s ease;
  }

  .field-input {
    flex: 1;
    min-width: 180px;
  }

  .field-select {
    min-width: 185px;
    cursor: pointer;
  }

  .field-textarea {
    width: 100%;
    min-height: 78px;
    resize: vertical;
    line-height: 1.45;
  }

  .field-input:focus,
  .field-select:focus,
  .field-textarea:focus {
    border-bottom-color: var(--cd);
  }

  .field-input::placeholder,
  .field-textarea::placeholder {
    color: var(--f);
  }

  .form-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .form-hint {
    font-size: 0.78rem;
    color: var(--f);
  }

  .submit-note-btn {
    background: none;
    border: 1px solid var(--cd);
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--cd);
    padding: 0.3rem 1rem;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .submit-note-btn:hover,
  .submit-note-btn:focus {
    background: var(--cd);
    color: var(--bg);
  }

  .entries-list {
    display: flex;
    flex-direction: column;
    gap: 1.65rem;
  }

  .entry-item {
    padding-bottom: 1.4rem;
    border-bottom: 1px solid var(--hairline);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 1rem;
  }

  .entry-meta {
    font-size: 0.78rem;
    color: var(--f);
    letter-spacing: 0.03em;
    margin-bottom: 0.3rem;
  }

  .entry-mention {
    color: var(--bronze);
    font-style: italic;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 0.95rem;
  }

  .entry-author {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.45rem;
    color: var(--cd);
    font-weight: 400;
    margin-bottom: 0.25rem;
  }

  .entry-message {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    line-height: 1.45;
    color: var(--cd);
    max-width: 580px;
  }

  .delete-entry-btn {
    display: none;
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--bronze);
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }

  body.is-unlocked .delete-entry-btn {
    display: inline-block;
  }

  .empty-entries {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--f);
    padding: 0.75rem 0;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 768px) {
    .brand-logo {
      display: block;
      width: 150vw;
      max-width: none;
      max-height: none;
      height: auto;
      margin-left: calc(50% - 75vw);
      margin-right: calc(50% - 75vw);
      object-fit: contain;
    }
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.5rem; }
    .header { margin-bottom: 1.5rem; gap: 1.5rem; }
    h1.wave-text { font-size: 2.75rem; }
    .subtitle { font-size: 1.1rem; }
    .search { max-width: none; width: 100%; }
    .plus-btn { font-size: 1rem; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .guestbook-section, .brand-logo { animation: none !important; opacity: 1; transform: none; }
    .plus-menu, .menu-item-link { transition: none; }
    .plus-btn[aria-expanded="true"] .plus { transform: none; }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <a href="page2.html" class="brand-title-link" aria-label="Retour à Plantouille (page2.html)">
        <h1 class="wave-text"><span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter l-bronze">l</span><span class="wave-letter">l</span><span class="wave-letter">e</span></h1>

            <span>A</span><span>j</span><span>o</span><span>u</span><span>t</span><span>e</span><span>r</span><span> </span><span>p</span><span>l</span><span>a</span><span>n</span><span>t</span><span>e</span><span>s</span>
          </span>
        </a>

        </a>
        <a href="galerie.html" class="menu-item-link">
          <span class="word" aria-label="Galerie">
            <span>G</span><span>a</span><span>l</span><span>e</span><span>r</span><span>i</span><span>e</span>
          </span>
        </a>
        <a href="shopping.html" class="menu-item-link">
          <span class="word" aria-label="Shopping">
            <span>S</span><span>h</span><span>o</span><span>p</span><span>p</span><span>i</span><span>n</span><span>g</span>
          </span>
        </a>
        <a href="livre.html" class="menu-item-link">

            <span>L</span><span>i</span><span>v</span><span>r</span><span>e</span><span> </span><span>d</span><span>'</span><span>o</span><span>r</span>

  <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">

    <div class="entries-list" id="entriesList"></div>

</div>

<script>
// ==================== ANIMATION VAGUE TITRE (h1) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el.closest('button, a') || el));

// ==================== MENU + ET LIENS ====================
(function () {
  var plusToggle = document.getElementById('plusToggle');
  var plusMenu = document.getElementById('plusMenu');

  function setMenuOpen(open) {
    plusToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    plusMenu.classList.toggle('is-open', open);
  }

  plusToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = plusToggle.getAttribute('aria-expanded') === 'true';
    setMenuOpen(!isOpen);
  });

  document.addEventListener('click', function (e) {
    if (!plusMenu.contains(e.target) && !plusToggle.contains(e.target)) {
      setMenuOpen(false);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setMenuOpen(false);
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var PERIOD = 1600, STAGGER = 110, EASING = 0.12, EPSILON = 0.05;
  var animItems = document.querySelectorAll('.menu-item-link');

  animItems.forEach(function (item) {
    var spans = item.querySelectorAll('.word > span');
    var fontSize = parseFloat(getComputedStyle(item).fontSize) || 17;
    var maxAmplitude = fontSize * 0.18;
    var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

    function tick(now) {
      if (phaseStart === null) phaseStart = now;
      amplitude += (targetAmplitude - amplitude) * EASING;
      if (Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;

      var elapsed = now - phaseStart;
      for (var i = 0; i < spans.length; i++) {
        var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
        spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
      }
      if (amplitude === 0 && targetAmplitude === 0) {
        for (var j = 0; j < spans.length; j++) spans[j].style.transform = '';
        phaseStart = null;
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function ensureRunning() { if (rafId === null) rafId = requestAnimationFrame(tick); }
    function start() { targetAmplitude = maxAmplitude; ensureRunning(); }
    function stop() { targetAmplitude = 0; ensureRunning(); }

    item.addEventListener('mouseenter', start);
    item.addEventListener('mouseleave', stop);
    item.addEventListener('focus', start);
    item.addEventListener('blur', stop);
    item.addEventListener('touchstart', start, { passive: true });
    item.addEventListener('touchend', stop, { passive: true });
  });

  var navigating = false;
  animItems.forEach(function (item) {
    item.addEventListener('click', function (e) {
      if (navigating) { e.preventDefault(); return; }
      var href = item.getAttribute('href');
      if (!href || href === '#') return;
      navigating = true;
      e.preventDefault();

      animItems.forEach(function (other) {
        if (other !== item) other.classList.add('is-fading');
      });

      setTimeout(function () {
        item.classList.add('is-leaving');
      }, 450);

      setTimeout(function () {
        window.location.href = href;
      }, 1150);
    });
  });
})();

// ==================== LIVRE D'OR (LOCALSTORAGE + VERROU) ====================
(function () {
  var STORAGE_KEY = 'plantouille_livre_dor_v1';

  var defaultEntries = [
    {
      id: 'ld-1',
      author: 'Camille D.',
      mention: 'Constat',
      date: '14 octobre 2026',
      message: 'J’ai promis à mon cactus de ne plus l’arroser par culpabilité. Il semble soulagé.'
    },
    {
      id: 'ld-2',
      author: 'Henri B.',
      mention: 'Hypothèse',
      date: '29 octobre 2026',
      message: 'Les plantes poussent mieux lorsqu’on cesse de leur demander chaque matin si elles sont heureuses.'
    },
    {
      id: 'ld-3',
      author: 'Sonia M.',
      mention: 'Ordonnance',
      date: '12 novembre 2026',
      message: 'Deux heures de soleil sans déplacer le pot tous les trois jours. À renouveler.'
    }
  ];

  function loadEntries() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return defaultEntries.slice();
  }

  function saveEntries(list) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function formatTodayFr() {
    try {
      return new Date().toLocaleDateString('fr-FR', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      });
    } catch (e) {
      return 'aujourd’hui';
    }
  }

  var entries = loadEntries();
  var searchQuery = '';

  var form = document.getElementById('guestbookForm');
  var authorInput = document.getElementById('authorInput');
  var mentionSelect = document.getElementById('mentionSelect');
  var messageInput = document.getElementById('messageInput');
  var formStatus = document.getElementById('formStatus');
  var entriesList = document.getElementById('entriesList');
  var searchInput = document.getElementById('guestbookSearch');
  var lockBtn = document.getElementById('lockBtn');

  function renderEntries() {
    var q = searchQuery.trim().toLowerCase();
    var filtered = entries.filter(function (entry) {
      return !q ||
        entry.author.toLowerCase().indexOf(q) !== -1 ||
        entry.message.toLowerCase().indexOf(q) !== -1 ||
        entry.mention.toLowerCase().indexOf(q) !== -1;
    });

    if (!filtered.length) {
      entriesList.innerHTML = '<p class="empty-entries">Aucune inscription correspondante dans le registre.</p>';
      return;
    }

    entriesList.innerHTML = filtered.map(function (entry) {
      return (
        '<article class="entry-item" data-id="' + escapeHtml(entry.id) + '">' +
          '<div>' +
            '<div class="entry-meta"><span class="entry-mention">' + escapeHtml(entry.mention) + '</span> · ' + escapeHtml(entry.date) + '</div>' +
            '<h3 class="entry-author">' + escapeHtml(entry.author) + '</h3>' +
            '<p class="entry-message">' + escapeHtml(entry.message) + '</p>' +
          '</div>' +
          '<button type="button" class="delete-entry-btn" data-delete="' + escapeHtml(entry.id) + '" aria-label="Supprimer cette inscription">Supprimer</button>' +
        '</article>'
      );
    }).join('');
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var author = authorInput.value.trim();
    var message = messageInput.value.trim();
    var mention = mentionSelect.value;

    if (!author || !message) return;

    entries.unshift({
      id: 'ld-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
      author: author,
      mention: mention,
      date: formatTodayFr(),
      message: message
    });

    saveEntries(entries);
    renderEntries();

    authorInput.value = '';
    messageInput.value = '';
    formStatus.textContent = 'Inscription versée au livre d’or.';
  });

  searchInput.addEventListener('input', function () {
    searchQuery = searchInput.value;
    renderEntries();
  });

  lockBtn.addEventListener('click', function () {
    var unlocked = document.body.classList.toggle('is-unlocked');
    lockBtn.classList.toggle('is-unlocked', unlocked);
    lockBtn.setAttribute('aria-pressed', unlocked ? 'true' : 'false');
    lockBtn.textContent = unlocked ? 'Déverrouillé' : 'Verrou';
  });

  entriesList.addEventListener('click', function (e) {
    var delId = e.target.getAttribute('data-delete');
    if (delId && document.body.classList.contains('is-unlocked')) {
      entries = entries.filter(function (entry) { return entry.id !== delId; });
      saveEntries(entries);
      renderEntries();
    }
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&')
      .replace(/</g, '<')
      .replace(/>/g, '>')
      .replace(/"/g, '"');
  }

  renderEntries();
})();
</script>

</body>
</html>
