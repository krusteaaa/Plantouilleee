
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    --cactus-dark: #2d4a2b;
    --cactus-hover: #4a6b3d;
    --bg: #ffffff;
    --faint: rgba(45, 74, 43, 0.4);
  }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cactus-dark);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* =====================  HEADER  ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 7rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .brand h1 {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 300;
    font-size: 1.9rem;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .brand .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--faint);
    margin-top: 0.4rem;
    letter-spacing: 0.03em;
  }

  /* ----- Barre de recherche sous le sous-titre ----- */
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--faint); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.9rem;
    color: var(--cactus-dark);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--faint); font-style: italic; }

  /* ----- Bouton Ajouter ----- */
  .add-link {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--cactus-dark);
    text-decoration: none;
    letter-spacing: 0.02em;
    position: relative;
    padding-top: 0.4rem;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .add-link .plus {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: normal;
    font-size: 1.2rem;
    margin-right: 0.3rem;
    vertical-align: -0.05em;
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .add-link:hover,
  .add-link:focus {
    color: var(--cactus-hover);
    outline: none;
  }

  .add-link:hover .plus,
  .add-link:focus .plus {
    transform: rotate(90deg);
  }

  /* =====================  NAVIGATION  ===================== */
  .categories {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  }

  .category {
    display: inline-block;
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.4;
    letter-spacing: -0.02em;
    color: var(--cactus-dark);
    text-decoration: none;
    transition: color 0.5s ease,
                opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .category:hover,
  .category:focus {
    color: var(--cactus-hover);
    outline: none;
  }

  .category.is-fading {
    opacity: 0;
    pointer-events: none;
  }

  .category.is-leaving {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-18px);
    transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .category .word {
    display: inline-flex;
    align-items: baseline;
  }

  .category .word > span {
    display: inline-block;
    will-change: transform;
  }

  /* =====================  RESPONSIVE  ===================== */
  @media (max-width: 640px) {
    body { padding: 2rem 1.5rem; }
    .header { margin-bottom: 4rem; gap: 1.5rem; }
    .brand h1 { font-size: 1.6rem; }
    .search { max-width: none; width: 100%; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .categories { animation: none !important; opacity: 1; transform: none; }
    .category { transition: none; }
    .category.is-leaving { transform: none; }
    .add-link:hover .plus, .add-link:focus .plus { transform: none; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <h1>Plantouille</h1>
    <p class="subtitle">Cabinet du Dr-Cactus</p>

    <form class="search" role="search" onsubmit="event.preventDefault();">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
           stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <circle cx="7" cy="7" r="5"/>
        <line x1="11" y1="11" x2="14" y2="14"/>
      </svg>
      <input type="search" placeholder="chercher…" aria-label="Rechercher">
    </form>
  </div>

  <a href="ajouter.html" class="add-link">
    <span class="plus">+</span>Ajouter
  </a>
</header>

<nav class="categories">

  <a href="plantes.html" class="category">
    <span class="word" aria-label="Plantes">
      <span>P</span><span>l</span><span>a</span><span>n</span><span>t</span><span>e</span><span>s</span>
    </span>
  </a>

  <a href="graines.html" class="category">
    <span class="word" aria-label="Graines">
      <span>G</span><span>r</span><span>a</span><span>i</span><span>n</span><span>e</span><span>s</span>
    </span>
  </a>

  <a href="spores.html" class="category">
    <span class="word" aria-label="Spores">
      <span>S</span><span>p</span><span>o</span><span>r</span><span>e</span><span>s</span>
    </span>
  </a>

  <a href="bonsais.html" class="category">
    <span class="word" aria-label="Bonsaïs">
      <span>B</span><span>o</span><span>n</span><span>s</span><span>a</span><span>ï</span><span>s</span>
    </span>
  </a>

</nav>

<script>
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var AMPLITUDE = 8, PERIOD = 1200, STAGGER = 100, EASING = 0.12, EPSILON = 0.05;

  document.querySelectorAll('.category').forEach(function (cat) {
    var spans = cat.querySelectorAll('.word > span');
    var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

    function tick(now) {
      if (phaseStart === null) phaseStart = now;
      amplitude += (targetAmplitude - amplitude) * EASING;
      if (Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;

      var elapsed = now - phaseStart;
      for (var i = 0; i < spans.length; i++) {
        var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
        spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
      }
      if (amplitude === 0 && targetAmplitude === 0) {
        for (var j = 0; j < spans.length; j++) spans[j].style.transform = '';
        phaseStart = null;
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function ensureRunning() { if (rafId === null) rafId = requestAnimationFrame(tick); }
    function start() { targetAmplitude = AMPLITUDE; ensureRunning(); }
    function stop() { targetAmplitude = 0; ensureRunning(); }

    cat.addEventListener('mouseenter', start);
    cat.addEventListener('mouseleave', stop);
    cat.addEventListener('focus', start);
    cat.addEventListener('blur', stop);
    cat.addEventListener('touchstart', start, { passive: true });
    cat.addEventListener('touchend', stop, { passive: true });
  });

  var navigating = false;

  var T_CLICKED_START = 800;
  var T_CLICKED_FADE  = 1400;
  var T_PAUSE_AFTER   = 800;

  document.querySelectorAll('.category').forEach(function (cat) {
    cat.addEventListener('click', function (e) {
      if (navigating) { e.preventDefault(); return; }

      var href = cat.getAttribute('href');
      if (!href || href === '#') return;

      navigating = true;
      e.preventDefault();

      document.querySelectorAll('.category').forEach(function (other) {
        if (other !== cat) other.classList.add('is-fading');
      });

      setTimeout(function () {
        cat.classList.add('is-leaving');
      }, T_CLICKED_START);

      setTimeout(function () {
        window.location.href = href;
      }, T_CLICKED_START + T_CLICKED_FADE + T_PAUSE_AFTER);
    });
  });
})();
</script>

</body>
</html>
