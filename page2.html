<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --bronze: #b8860b;
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  /* ===================== INITIAL "SAN PEDRO" FADE-IN ===================== */
  .san-pedro-splash {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    pointer-events: none;
    animation: san-pedro-overlay-out 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  .san-pedro-splash__label {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2.5rem, 6vw, 4.5rem);
    color: var(--cd);
    letter-spacing: 0.04em;
    opacity: 0;
    animation: san-pedro-text-in-out 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }

  @keyframes san-pedro-text-in-out {
    0% {
      opacity: 0;
      transform: translateY(10px);
    }
    35% {
      opacity: 1;
      transform: translateY(0);
    }
    70% {
      opacity: 1;
      transform: translateY(0);
    }
    100% {
      opacity: 0;
      transform: translateY(-8px);
    }
  }

  @keyframes san-pedro-overlay-out {
    0%, 72% {
      opacity: 1;
      visibility: visible;
    }
    100% {
      opacity: 0;
      visibility: hidden;
    }
  }

  .page-content {
    max-width: 800px;
    margin: 0 auto;
    opacity: 0;
    animation: page-settle-in 1.1s cubic-bezier(0.4, 0, 0.2, 1) 1.05s forwards;
  }

  @keyframes page-settle-in {
    from {
      opacity: 0;
      transform: translateY(8px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter { font-style: normal; }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: #b8860b !important;
    -webkit-text-fill-color: #b8860b !important;
    background: transparent !important;
    font-style: normal !important;
  }

  /* ----- Barre de recherche ----- */
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--f); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  /* ----- Actions en haut à droite (+ Menu regroupant Ajouter plantes, Cactus-Hunters, Galerie, Shopping & Livre d'or) ----- */
  .header-actions {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
    padding-top: 0.4rem;
    z-index: 20;
  }

  .plus-trigger {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-size: 1.75rem;
    line-height: 1;
    color: var(--cd);
    padding: 0.15rem 0.35rem;
    transition: color 0.35s ease, transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .plus-trigger:hover,
  .plus-trigger:focus {
    color: var(--ch);
    outline: none;
  }

  .plus-trigger.is-open {
    transform: rotate(45deg);
    color: var(--ch);
  }

  .plus-menu {
    position: absolute;
    top: 100%;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.35rem;
    padding-top: 0.35rem;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                transform 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.28s ease;
  }

  .plus-menu.is-open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  .add-link,
  .plus-sublink,
  .dr-link {
    display: inline-block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--cd);
    text-decoration: none;
    transition: color 0.5s ease,
                opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
  }

  .add-link:hover,
  .add-link:focus,
  .plus-sublink:hover,
  .plus-sublink:focus,
  .dr-link:hover,
  .dr-link:focus {
    color: var(--ch);
    outline: none;
  }

  .add-link.is-fading,
  .plus-sublink.is-fading,
  .dr-link.is-fading {
    opacity: 0;
    pointer-events: none;
  }

  .add-link.is-leaving,
  .plus-sublink.is-leaving,
  .dr-link.is-leaving {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-18px);
    transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .add-link .word,
  .plus-sublink .word,
  .dr-link .word {
    display: inline-flex;
    align-items: baseline;
  }

  .add-link .word > span,
  .plus-sublink .word > span,
  .dr-link .word > span {
    display: inline-block;
    will-change: transform;
  }

  .dr-link .cactus-word {
    color: #b8860b;
    -webkit-text-fill-color: #b8860b;
  }

  /* ===================== LOGO ===================== */
  .brand-logo{
    display: block;
    margin: 1rem auto 3rem;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 600px;
    object-fit: contain;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  /* ===================== NAVIGATION ===================== */
  .categories {
    display: flex;
    flex-direction: column;
    gap: 0.2rem;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  }

  .category {
    display: inline-block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.4;
    letter-spacing: -0.01em;
    color: var(--cd);
    text-decoration: none;
    transition: color 0.5s ease,
                opacity 1s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .category:hover,
  .category:focus {
    color: var(--ch);
    outline: none;
  }

  .category.is-fading {
    opacity: 0;
    pointer-events: none;
  }

  .category.is-leaving {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-18px);
    transition: opacity 1.4s cubic-bezier(0.4, 0, 0.2, 1),
                transform 1.6s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .category .word {
    display: inline-flex;
    align-items: baseline;
  }

  .category .word > span {
    display: inline-block;
    will-change: transform;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 768px) {
    .brand-logo{
      display: block;
      width: 150vw;
      max-width: none;
      max-height: none;
      height: auto;
      margin-left: calc(50% - 75vw);
      margin-right: calc(50% - 75vw);
      object-fit: contain;
    }
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.5rem; }
    .header { margin-bottom: 1.5rem; gap: 1.5rem; }
    h1.wave-text { font-size: 2.75rem; }
    .subtitle { font-size: 1.1rem; }
    .search { max-width: none; width: 100%; }
    .add-link, .plus-sublink, .dr-link { font-size: 1.05rem; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .san-pedro-splash { display: none !important; }
    .page-content { opacity: 1 !important; transform: none !important; animation: none !important; }
    .header, .categories, .brand-logo { animation: none !important; opacity: 1; transform: none; }
    .plus-menu, .plus-menu.is-open { transition: none; transform: none; }
    .category, .add-link, .plus-sublink, .dr-link { transition: none; }
    .category.is-leaving, .add-link.is-leaving, .plus-sublink.is-leaving, .dr-link.is-leaving { transform: none; }
    .plus-trigger, .plus-trigger.is-open { transform: none; }
  }
</style>
</head>
<body>

<div class="san-pedro-splash" aria-hidden="true">
  <span class="san-pedro-splash__label">San Pedro</span>
</div>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <h1 class="wave-text"><span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter">i</span><span class="wave-letter">l</span><span class="wave-letter">l</span><span class="wave-letter">e</span></h1>
      <p class="subtitle">Cabinet du <span class="dr">Dr</span>-Cactus</p>

      <form class="search" role="search" onsubmit="event.preventDefault();">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <circle cx="7" cy="7" r="5"/>
          <line x1="11" y1="11" x2="14" y2="14"/>
        </svg>
        <input type="search" placeholder="chercher…" aria-label="Rechercher">
      </form>
    </div>

    <div class="header-actions" id="headerActions">
      <button type="button" class="plus-trigger" id="plusTrigger" aria-expanded="false" aria-controls="plusMenu" aria-label="Ouvrir le menu d'actions">+</button>
      <div class="plus-menu" id="plusMenu" role="menu">
        <a href="ajouter.html" class="add-link" role="menuitem">
          <span class="word" aria-label="Ajouter plantes">
            <span>A</span><span>j</span><span>o</span><span>u</span><span>t</span><span>e</span><span>r</span><span>&nbsp;</span><span>p</span><span>l</span><span>a</span><span>n</span><span>t</span><span>e</span><span>s</span>
          </span>
        </a>
        <a href="cactushunter.html" class="dr-link" role="menuitem">
          <span class="word" aria-label="Cactus-Hunters">
            <span class="cactus-word">C</span><span class="cactus-word">a</span><span class="cactus-word">c</span><span class="cactus-word">t</span><span class="cactus-word">u</span><span class="cactus-word">s</span><span>-</span><span>H</span><span>u</span><span>n</span><span>t</span><span>e</span><span>r</span><span>s</span>
          </span>
        </a>
        <a href="galerie.html" class="plus-sublink" role="menuitem">
          <span class="word" aria-label="Galerie">
            <span>G</span><span>a</span><span>l</span><span>e</span><span>r</span><span>i</span><span>e</span>
          </span>
        </a>
        <a href="shopping.html" class="plus-sublink" role="menuitem">
          <span class="word" aria-label="Shopping">
            <span>S</span><span>h</span><span>o</span><span>p</span><span>p</span><span>i</span><span>n</span><span>g</span>
          </span>
        </a>
        <a href="livre.html" class="plus-sublink" role="menuitem">
          <span class="word" aria-label="Livre d'or">
            <span>L</span><span>i</span><span>v</span><span>r</span><span>e</span><span>&nbsp;</span><span>d</span><span>'</span><span>o</span><span>r</span>
          </span>
        </a>
      </div>
    </div>
  </header>

  <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">

  <nav class="categories">

    <a href="plantes.html" class="category">
      <span class="word" aria-label="Plantes">
        <span>P</span><span>l</span><span>a</span><span>n</span><span>t</span><span>e</span><span>s</span>
      </span>
    </a>

    <a href="graines.html" class="category">
      <span class="word" aria-label="Graines">
        <span>G</span><span>r</span><span>a</span><span>i</span><span>n</span><span>e</span><span>s</span>
      </span>
    </a>

    <a href="spores.html" class="category">
      <span class="word" aria-label="Spores">
        <span>S</span><span>p</span><span>o</span><span>r</span><span>e</span><span>s</span>
      </span>
    </a>

    <a href="bonsais.html" class="category">
      <span class="word" aria-label="Bonsaïs">
        <span>B</span><span>o</span><span>n</span><span>s</span><span>a</span><span>ï</span><span>s</span>
      </span>
    </a>

  </nav>

</div>

<script>
// ==================== MENU + (AJOUTER PLANTES, CACTUS-HUNTERS, GALERIE, SHOPPING & LIVRE D'OR) ====================
(function () {
  var trigger = document.getElementById('plusTrigger');
  var menu = document.getElementById('plusMenu');
  var container = document.getElementById('headerActions');
  if (!trigger || !menu || !container) return;

  function setMenuOpen(isOpen) {
    trigger.classList.toggle('is-open', isOpen);
    menu.classList.toggle('is-open', isOpen);
    trigger.setAttribute('aria-expanded', String(isOpen));
  }

  trigger.addEventListener('click', function (e) {
    e.stopPropagation();
    setMenuOpen(!menu.classList.contains('is-open'));
  });

  document.addEventListener('click', function (e) {
    if (menu.classList.contains('is-open') && !container.contains(e.target)) {
      setMenuOpen(false);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && menu.classList.contains('is-open')) {
      setMenuOpen(false);
    }
  });
})();

// ==================== ANIMATION VAGUE (h1 — charte modèle) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el.closest('button, a') || el));

// ==================== CATEGORIES, PLUS-SUBLINK & DR-LINK : wave + navigation ====================
(function () {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var PERIOD = 1600, STAGGER = 110, EASING = 0.12, EPSILON = 0.05;
  var animItems = document.querySelectorAll('.category, .add-link, .plus-sublink, .dr-link');

  animItems.forEach(function (item) {
    var spans = item.querySelectorAll('.word > span');
    var fontSize = parseFloat(getComputedStyle(item).fontSize) || 24;
    var maxAmplitude = fontSize * 0.18;
    var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

    function tick(now) {
      if (phaseStart === null) phaseStart = now;
      amplitude += (targetAmplitude - amplitude) * EASING;
      if (Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;

      var elapsed = now - phaseStart;
      for (var i = 0; i < spans.length; i++) {
        var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
        spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
      }
      if (amplitude === 0 && targetAmplitude === 0) {
        for (var j = 0; j < spans.length; j++) spans[j].style.transform = '';
        phaseStart = null;
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function ensureRunning() { if (rafId === null) rafId = requestAnimationFrame(tick); }
    function start() { targetAmplitude = maxAmplitude; ensureRunning(); }
    function stop() { targetAmplitude = 0; ensureRunning(); }

    item.addEventListener('mouseenter', start);
    item.addEventListener('mouseleave', stop);
    item.addEventListener('focus', start);
    item.addEventListener('blur', stop);
    item.addEventListener('touchstart', start, { passive: true });
    item.addEventListener('touchend', stop, { passive: true });
  });

  var navigating = false;
  var T_CLICKED_START = 800;
  var T_CLICKED_FADE  = 1400;
  var T_PAUSE_AFTER   = 800;

  animItems.forEach(function (item) {
    item.addEventListener('click', function (e) {
      if (navigating) { e.preventDefault(); return; }
      var href = item.getAttribute('href');
      if (!href || href === '#') return;
      navigating = true;
      e.preventDefault();

      animItems.forEach(function (other) {
        if (other !== item) other.classList.add('is-fading');
      });

      setTimeout(function () {
        item.classList.add('is-leaving');
      }, T_CLICKED_START);

      setTimeout(function () {
        window.location.href = href;
      }, T_CLICKED_START + T_CLICKED_FADE + T_PAUSE_AFTER);
    });
  });
})();
</script>

</body>
</html>
