<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Galerie — Plantouille</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}
  :root{color-scheme: light;--cd:#2d4a2b;--ch:#4a6b3d;--bg:#fff;--f:rgba(45,74,43,.4);--tint:rgba(45,74,43,.04)}
  body{font-family:"Inter",sans-serif;background:var(--bg);color:var(--cd);min-height:100vh;padding:3rem;-webkit-font-smoothing:antialiased}

  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem;flex-wrap:wrap;gap:1rem}
  .brand h1{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:2.8rem;line-height:1}
  .back-link{display:inline-flex;align-items:center;gap:.5rem;font-family:"Instrument Serif",serif;font-style:italic;font-size:1.1rem;color:var(--f);text-decoration:none;transition:color .3s}
  .back-link:hover{color:var(--cd)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem;max-width:1200px;margin:0 auto}
  
  .card{
    background:var(--tint);border-radius:8px;overflow:hidden;
    display:flex;flex-direction:column;
    transition:transform .3s;
  }
  .card:hover{transform:translateY(-5px)}
  
  .card-img{width:100%;height:250px;object-fit:cover;display:block}
  .card-content{padding:1.5rem;display:flex;flex-direction:column;gap:0.5rem}
  
  .card-cat{font-family:"Inter",sans-serif;font-size:.6rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase;color:var(--f)}
  .card-title{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:1.8rem;line-height:1.1}
  .card-sub{font-family:"Instrument Serif",serif;font-style:italic;font-size:1rem;color:var(--f)}
  
  .card-info{font-size:0.85rem;margin-top:0.5rem;display:flex;flex-direction:column;gap:0.2rem}
  .card-info span{color:var(--f);font-weight:500}
  
  .empty-msg{text-align:center;font-family:"Instrument Serif",serif;font-style:italic;font-size:1.5rem;color:var(--f);margin-top:5rem}
</style>
</head>
<body>

<div class="header">
  <div class="brand">
    <h1>Galerie</h1>
  </div>
  <a href="ajouter.html" class="back-link">← Retour au formulaire</a>
</div>

<div id="gallery" class="grid">
  <!-- Les cartes vont s'afficher ici -->
</div>

<script>
  const gallery = document.getElementById('gallery');
  
  // On récupère les données sauvegardées
  const savedData = JSON.parse(localStorage.getItem('plantouille_data')) || [];

  if (savedData.length === 0) {
    gallery.innerHTML = '<p class="empty-msg">Aucun spécimen pour le moment.<br>Ajoute-en un depuis le formulaire !</p>';
  } else {
    // On boucle sur chaque spécimen
    savedData.forEach(specimen => {
      const card = document.createElement('div');
      card.className = 'card';
      
      // On affiche l'image si elle existe
      const imgHtml = specimen.photo 
        ? `<img src="${specimen.photo}" alt="${specimen.genre}" class="card-img">` 
        : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;background:#ddd;color:#666">Pas de photo</div>`;

      card.innerHTML = `
        ${imgHtml}
        <div class="card-content">
          <div class="card-cat">${specimen.categorie || 'Catégorie'}</div>
          <h2 class="card-title">${specimen.genre || 'Genre inconnu'}</h2>
          <div class="card-sub">${specimen.famille || 'Famille inconnue'}</div>
          
          <div class="card-info">
            <div><span>Exposition :</span> ${specimen.exposition || '-'}</div>
            <div><span>Froid :</span> ${specimen.temperature || '-'}</div>
            <div><span>Substrat :</span> ${specimen.substrat || '-'}</div>
          </div>
        </div>
      `;
      
      gallery.appendChild(card);
    });
  }
</script>
</body>
</html>
