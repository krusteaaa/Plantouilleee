<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Shopping — Plantouille</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  :root {
    color-scheme: light;
    --cd: #2d4a2b;
    --ch: #4a6b3d;
    --bg: #ffffff;
    --f: rgba(45, 74, 43, 0.4);
    --bronze: #b8860b;
    --hairline: rgba(45, 74, 43, 0.16);
  }

  *{-webkit-tap-highlight-color:transparent}
  *:focus,*:focus-visible{outline:none}

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--cd);
    min-height: 100vh;
    padding: 3rem;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
  }

  .page-content {
    max-width: 800px;
    margin: 0 auto;
  }

  /* ===================== HEADER ===================== */
  .header {
    position: relative;
    z-index: 60;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 2rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
    animation: fade-in 1s ease-out 0.1s both;
  }

  .brand {
    display: flex;
    flex-direction: column;
  }

  .brand-title-link {
    text-decoration: none;
    color: inherit;
    display: inline-block;
  }

  h1.wave-text {
    display: inline-flex;
    align-items: baseline;
    flex-wrap: wrap;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-weight: 400;
    font-size: clamp(2.75rem, 5.5vw, 4rem);
    line-height: 0.9;
    letter-spacing: .01em;
    color: var(--cd);
    margin-bottom: 0.2rem;
  }

  h1.wave-text .wave-letter {
    display: inline-block;
    font-style: normal;
    will-change: transform;
  }

  h1.wave-text .l-bronze {
    color: #b8860b;
    -webkit-text-fill-color: #b8860b;
  }

  .subtitle {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--cd);
    margin-top: 0.4rem;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }

  .dr {
    color: #b8860b !important;
    -webkit-text-fill-color: #b8860b !important;
    background: transparent !important;
    font-style: normal !important;
  }

  /* ----- Barre de recherche ----- */
  .search {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.4rem;
    max-width: 220px;
  }

  .search svg { color: var(--f); flex-shrink: 0; }

  .search input {
    flex: 1;
    border: none;
    outline: none;
    background: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    padding: 0.1rem 0;
    min-width: 0;
  }

  .search input::placeholder { color: var(--f); font-style: italic; }

  /* ----- Actions en haut à droite + Menu + sans cadre ----- */
  .header-actions {
    position: relative;
    z-index: 80;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.5rem;
    padding-top: 0.4rem;
  }

  .plus-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--cd);
    cursor: pointer;
    letter-spacing: 0.02em;
    display: inline-flex;
    align-items: center;
    padding: 0;
    transition: color 0.35s ease;
    white-space: nowrap;
  }

  .plus-btn .plus {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: normal;
    font-size: 1.3rem;
    margin-right: 0.3rem;
    vertical-align: -0.05em;
    display: inline-block;
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .plus-btn:hover,
  .plus-btn:focus {
    color: var(--ch);
  }

  .plus-btn[aria-expanded="true"] .plus {
    transform: rotate(45deg);
  }

  .plus-menu {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 0.45rem;
    background: var(--bg);
    padding: 0.25rem 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 0.3rem;
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transform: translateY(-6px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .plus-menu.is-open {
    opacity: 1;
    pointer-events: auto;
    transform: translateY(0);
  }

  .menu-item-link {
    display: inline-block;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1.05rem;
    line-height: 1.4;
    letter-spacing: 0.02em;
    color: var(--cd);
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.35s ease, opacity 0.8s ease, transform 0.8s ease;
  }

  .menu-item-link:hover,
  .menu-item-link:focus {
    color: var(--ch);
  }

  .menu-item-link .word {
    display: inline-flex;
    align-items: baseline;
  }

  .menu-item-link .word > span {
    display: inline-block;
    will-change: transform;
  }

  .menu-item-link.is-fading {
    opacity: 0;
    pointer-events: none;
  }

  .menu-item-link.is-leaving {
    opacity: 0;
    pointer-events: none;
    transform: translateY(-14px);
  }

  /* ===================== LOGO ===================== */
  .brand-logo {
    position: relative;
    z-index: 10;
    display: block;
    margin: 1rem auto 2.5rem;
    width: auto;
    height: auto;
    max-width: 100%;
    max-height: 600px;
    object-fit: contain;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.2s both;
  }

  /* ===================== SHOPPING ===================== */
  .shop-section {
    position: relative;
    z-index: 15;
    animation: fade-up 1s cubic-bezier(0.4, 0, 0.2, 1) 0.3s both;
  }

  .shop-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 1rem;
    padding-bottom: 0.85rem;
    border-bottom: 1px solid var(--hairline);
    margin-bottom: 2rem;
  }

  .shop-filters {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 1.25rem;
  }

  .filter-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.35rem;
    color: var(--f);
    cursor: pointer;
    padding: 0;
    transition: color 0.3s ease;
  }

  .filter-btn:hover,
  .filter-btn:focus,
  .filter-btn.is-active {
    color: var(--cd);
  }

  .filter-btn.is-active {
    text-decoration: underline;
    text-underline-offset: 5px;
    text-decoration-thickness: 1px;
  }

  .toolbar-right {
    display: flex;
    align-items: baseline;
    gap: 1.25rem;
  }

  .cart-toggle-btn,
  .lock-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.15rem;
    color: var(--cd);
    cursor: pointer;
    padding: 0;
    transition: color 0.3s ease;
  }

  .cart-toggle-btn:hover,
  .cart-toggle-btn:focus,
  .lock-btn:hover,
  .lock-btn:focus {
    color: var(--ch);
  }

  .lock-btn.is-unlocked {
    color: var(--bronze);
  }

  .catalog-list {
    display: flex;
    flex-direction: column;
    gap: 1.75rem;
  }

  .product-item {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 0.35rem 1.5rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid var(--hairline);
    transition: opacity 0.35s ease;
  }

  .product-meta {
    font-size: 0.78rem;
    letter-spacing: 0.04em;
    color: var(--f);
    text-transform: lowercase;
  }

  .product-meta .price {
    color: var(--bronze);
    font-weight: 500;
  }

  .product-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.65rem;
    line-height: 1.2;
    color: var(--cd);
    font-weight: 400;
  }

  .product-note {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.08rem;
    line-height: 1.45;
    color: var(--cd);
    max-width: 540px;
  }

  .product-actions {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: space-between;
    gap: 0.5rem;
  }

  .add-cart-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.1rem;
    color: var(--cd);
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: color 0.3s ease;
    white-space: nowrap;
  }

  .add-cart-btn:hover,
  .add-cart-btn:focus {
    color: var(--ch);
  }

  .delete-item-btn {
    display: none;
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 0.95rem;
    color: var(--bronze);
    cursor: pointer;
    padding: 0;
  }

  body.is-unlocked .delete-item-btn {
    display: inline-block;
  }

  /* ----- Panier sans cadre ----- */
  .cart-panel {
    margin-top: 2.25rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--hairline);
    display: none;
  }

  .cart-panel.is-open {
    display: block;
  }

  .cart-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 1.25rem;
    padding-bottom: 0.6rem;
    border-bottom: 1px solid var(--hairline);
  }

  .cart-title {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.5rem;
    font-weight: 400;
  }

  .cart-clear-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1rem;
    color: var(--f);
    cursor: pointer;
  }

  .cart-clear-btn:hover {
    color: var(--cd);
  }

  .cart-items {
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
    margin-bottom: 1.25rem;
  }

  .cart-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
    font-size: 0.9rem;
  }

  .cart-row-name {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--cd);
  }

  .cart-qty-controls {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
  }

  .qty-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-size: 1.2rem;
    color: var(--cd);
    cursor: pointer;
    padding: 0 0.25rem;
    line-height: 1;
  }

  .qty-btn:hover {
    color: var(--ch);
  }

  .cart-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--hairline);
  }

  .cart-total {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.4rem;
  }

  .checkout-btn {
    background: none;
    border: none;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--cd);
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
    transition: color 0.25s ease;
  }

  .checkout-btn:hover {
    color: var(--ch);
  }

  .checkout-feedback {
    margin-top: 0.85rem;
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    color: var(--bronze);
    min-height: 1.4rem;
  }

  .empty-state {
    font-family: "Instrument Serif", Georgia, serif;
    font-style: italic;
    font-size: 1.2rem;
    color: var(--f);
    padding: 1rem 0;
  }

  /* ===================== RESPONSIVE ===================== */
  @media (max-width: 768px) {
    .brand-logo {
      display: block;
      width: 150vw;
      max-width: none;
      max-height: none;
      height: auto;
      margin-left: calc(50% - 75vw);
      margin-right: calc(50% - 75vw);
      object-fit: contain;
    }
  }

  @media (max-width: 640px) {
    body { padding: 2rem 1.5rem; }
    .header { margin-bottom: 1.5rem; gap: 1.5rem; }
    h1.wave-text { font-size: 2.75rem; }
    .subtitle { font-size: 1.1rem; }
    .search { max-width: none; width: 100%; }
    .plus-btn { font-size: 1rem; }
    .product-item { grid-template-columns: 1fr; }
    .product-actions { align-items: flex-start; flex-direction: row; margin-top: 0.4rem; }
  }

  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .header, .shop-section, .brand-logo { animation: none !important; opacity: 1; transform: none; }
    .plus-menu, .menu-item-link { transition: none; }
    .plus-btn[aria-expanded="true"] .plus { transform: none; }
  }
</style>
</head>
<body>

<div class="page-content">

  <header class="header">
    <div class="brand">
      <a href="page2.html" class="brand-title-link" aria-label="Retour à Plantouille (page2.html)">
        <h1 class="wave-text"><span class="wave-letter">P</span><span class="wave-letter">l</span><span class="wave-letter">a</span><span class="wave-letter">n</span><span class="wave-letter">t</span><span class="wave-letter">o</span><span class="wave-letter">u</span><span class="wave-letter l-bronze">l</span><span class="wave-letter">l</span><span class="wave-letter">e</span></h1>

      <form class="search" role="search" onsubmit="event.preventDefault();">

        <a href="galerie.html" class="menu-item-link">

          <span class="word" aria-label="Shopping">

          </span>
        </a>
        <a href="livre.html" class="menu-item-link">
          <span class="word" aria-label="Livre d'or">
            <span>L</span><span>i</span><span>v</span><span>r</span><span>e</span><span> </span><span>d</span><span>'</span><span>o</span><span>r</span>
          </span>
        </a>
      </nav>
    </div>
  </header>

  <img src="logo.png" alt="Logo Dr-Cactus" class="brand-logo">

  <main class="shop-section" aria-label="Boutique Plantouille">
    <div class="shop-toolbar">
      <div class="shop-filters" role="tablist" aria-label="Rayons de la boutique">
        <button type="button" class="filter-btn is-active" data-category="tout">Tout</button>
        <button type="button" class="filter-btn" data-category="plantes">Plantes</button>
        <button type="button" class="filter-btn" data-category="graines">Graines</button>
        <button type="button" class="filter-btn" data-category="spores">Spores</button>
        <button type="button" class="filter-btn" data-category="bonsais">Bonsaïs</button>

      <div class="toolbar-right">

          Panier (<span id="cartCount">0</span>)

          Verrou

    <section class="cart-panel" id="cartPanel" aria-label="Panier d'achat">

        <h2 class="cart-title">Panier du cabinet</h2>

      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <span class="cart-total" id="cartTotal">Total : 0,00 €</span>
        <button type="button" class="checkout-btn" id="checkoutBtn">Valider la commande</button>
      </div>
      <p class="checkout-feedback" id="checkoutFeedback" role="status"></p>
    </section>
  </main>

</div>

<script>
// ==================== ANIMATION VAGUE TITRE (h1) ====================
function initWave(el) {
  const spans = el.querySelectorAll('.wave-letter');
  if (!spans.length) return;
  const fontSize = parseFloat(getComputedStyle(el).fontSize) || 18;
  const AMPLITUDE = fontSize * 0.20;
  const PERIOD = 2500;
  const STAGGER = 150;
  let amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

  function tick(now) {
    if (phaseStart === null) phaseStart = now;
    amplitude += (targetAmplitude - amplitude) * 0.08;
    if (Math.abs(targetAmplitude - amplitude) < 0.05) amplitude = targetAmplitude;
    const elapsed = now - phaseStart;
    spans.forEach((span, i) => {
      const phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
      span.style.transform = `translateY(${(-Math.sin(phase) * amplitude).toFixed(2)}px)`;
    });
    if (amplitude === 0 && targetAmplitude === 0) {
      spans.forEach(s => s.style.transform = '');
      phaseStart = null; rafId = null; return;
    }
    rafId = requestAnimationFrame(tick);
  }
  el.addEventListener('mouseenter', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('mouseleave', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); });
  el.addEventListener('touchstart', () => { targetAmplitude = AMPLITUDE; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
  el.addEventListener('touchend', () => { targetAmplitude = 0; if (!rafId) rafId = requestAnimationFrame(tick); }, { passive: true });
}
document.querySelectorAll('.wave-text').forEach(el => initWave(el.closest('button, a') || el));

// ==================== MENU + ET LIENS ====================
(function () {
  var plusToggle = document.getElementById('plusToggle');
  var plusMenu = document.getElementById('plusMenu');

  function setMenuOpen(open) {
    plusToggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    plusMenu.classList.toggle('is-open', open);
  }

  plusToggle.addEventListener('click', function (e) {
    e.stopPropagation();
    var isOpen = plusToggle.getAttribute('aria-expanded') === 'true';
    setMenuOpen(!isOpen);
  });

  document.addEventListener('click', function (e) {
    if (!plusMenu.contains(e.target) && !plusToggle.contains(e.target)) {
      setMenuOpen(false);
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') setMenuOpen(false);
  });

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  var PERIOD = 1600, STAGGER = 110, EASING = 0.12, EPSILON = 0.05;
  var animItems = document.querySelectorAll('.menu-item-link');

  animItems.forEach(function (item) {
    var spans = item.querySelectorAll('.word > span');
    var fontSize = parseFloat(getComputedStyle(item).fontSize) || 17;
    var maxAmplitude = fontSize * 0.18;
    var amplitude = 0, targetAmplitude = 0, phaseStart = null, rafId = null;

    function tick(now) {
      if (phaseStart === null) phaseStart = now;
      amplitude += (targetAmplitude - amplitude) * EASING;
      if (Math.abs(targetAmplitude - amplitude) < EPSILON) amplitude = targetAmplitude;

      var elapsed = now - phaseStart;
      for (var i = 0; i < spans.length; i++) {
        var phase = ((elapsed - i * STAGGER) / PERIOD) * Math.PI * 2;
        spans[i].style.transform = 'translateY(' + (-Math.sin(phase) * amplitude).toFixed(2) + 'px)';
      }
      if (amplitude === 0 && targetAmplitude === 0) {
        for (var j = 0; j < spans.length; j++) spans[j].style.transform = '';
        phaseStart = null;
        rafId = null;
        return;
      }
      rafId = requestAnimationFrame(tick);
    }

    function ensureRunning() { if (rafId === null) rafId = requestAnimationFrame(tick); }
    function start() { targetAmplitude = maxAmplitude; ensureRunning(); }
    function stop() { targetAmplitude = 0; ensureRunning(); }

    item.addEventListener('mouseenter', start);
    item.addEventListener('mouseleave', stop);
    item.addEventListener('focus', start);
    item.addEventListener('blur', stop);
    item.addEventListener('touchstart', start, { passive: true });
    item.addEventListener('touchend', stop, { passive: true });
  });

  var navigating = false;
  animItems.forEach(function (item) {
    item.addEventListener('click', function (e) {
      if (navigating) { e.preventDefault(); return; }
      var href = item.getAttribute('href');
      if (!href || href === '#') return;
      navigating = true;
      e.preventDefault();

      animItems.forEach(function (other) {
        if (other !== item) other.classList.add('is-fading');
      });

      setTimeout(function () {
        item.classList.add('is-leaving');
      }, 450);

      setTimeout(function () {
        window.location.href = href;
      }, 1150);
    });
  });
})();

// ==================== BOUTIQUE & PANIER (LOCALSTORAGE) ====================
(function () {
  var CATALOG_KEY = 'plantouille_shopping_catalog_v1';
  var CART_KEY = 'plantouille_shopping_cart_v1';

  var defaultProducts = [
    {
      id: 'pl-1',
      title: 'Echinopsis pachanoi — spécimen de consultation',
      category: 'plantes',
      price: 28.00,
      note: 'Pousse lente, silhouette stoïque et tolérance remarquable aux oublis d’arrosage du lundi.'
    },
    {
      id: 'gr-1',
      title: 'Lot de graines arides — mélange de serre',
      category: 'graines',
      price: 9.50,
      note: 'Pour celles et ceux qui aiment attendre trois semaines en regardant un pot vide avec espoir.'
    },
    {
      id: 'sp-1',
      title: 'Empreinte stérile — souche d’herbier',
      category: 'spores',
      price: 14.00,
      note: 'Conditionnée sous pli sec pour observations microscopiques et notes de laboratoire.'
    },
    {
      id: 'bo-1',
      title: 'Genévrier taillé — port balayé par le vent',
      category: 'bonsais',
      price: 46.00,
      note: 'Tronc travaillé sur coupe peu profonde ; exige du calme, de la lumière et peu d’improvisation.'
    }
  ];

  function loadCatalog() {
    try {
      var raw = localStorage.getItem(CATALOG_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return defaultProducts.slice();
  }

  function saveCatalog(items) {
    try { localStorage.setItem(CATALOG_KEY, JSON.stringify(items)); } catch (e) {}
  }

  function loadCart() {
    try {
      var raw = localStorage.getItem(CART_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return [];
  }

  function saveCart(items) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(items)); } catch (e) {}
  }

  function formatEuro(amount) {
    return amount.toFixed(2).replace('.', ',') + ' €';
  }

  var products = loadCatalog();
  var cart = loadCart();
  var activeCategory = 'tout';
  var searchQuery = '';

  var catalogList = document.getElementById('catalogList');
  var searchInput = document.getElementById('shopSearch');
  var filterButtons = document.querySelectorAll('.filter-btn');
  var cartToggle = document.getElementById('cartToggle');
  var cartPanel = document.getElementById('cartPanel');
  var cartItemsEl = document.getElementById('cartItems');
  var cartCountEl = document.getElementById('cartCount');
  var cartTotalEl = document.getElementById('cartTotal');
  var cartClearBtn = document.getElementById('cartClear');
  var checkoutBtn = document.getElementById('checkoutBtn');
  var checkoutFeedback = document.getElementById('checkoutFeedback');
  var lockBtn = document.getElementById('lockBtn');

  function renderCatalog() {
    var filtered = products.filter(function (p) {
      var matchCat = activeCategory === 'tout' || p.category === activeCategory;
      var q = searchQuery.trim().toLowerCase();
      var matchSearch = !q ||
        p.title.toLowerCase().indexOf(q) !== -1 ||
        p.note.toLowerCase().indexOf(q) !== -1 ||
        p.category.toLowerCase().indexOf(q) !== -1;
      return matchCat && matchSearch;
    });

    if (!filtered.length) {
      catalogList.innerHTML = '<p class="empty-state">Aucune référence ne correspond à ce filtre.</p>';
      return;
    }

    catalogList.innerHTML = filtered.map(function (p) {
      return (
        '<article class="product-item" data-id="' + p.id + '">' +
          '<div>' +
            '<div class="product-meta">' + p.category + ' · <span class="price">' + formatEuro(p.price) + '</span></div>' +
            '<h2 class="product-title">' + escapeHtml(p.title) + '</h2>' +
            '<p class="product-note">' + escapeHtml(p.note) + '</p>' +
          '</div>' +
          '<div class="product-actions">' +
            '<button type="button" class="add-cart-btn" data-add="' + p.id + '">Ajouter au panier</button>' +
            '<button type="button" class="delete-item-btn" data-delete="' + p.id + '">Supprimer</button>' +
          '</div>' +
        '</article>'
      );
    }).join('');
  }

  function renderCart() {
    var totalQty = 0;
    var totalPrice = 0;

    if (!cart.length) {
      cartItemsEl.innerHTML = '<p class="empty-state">Le panier est vide.</p>';
      cartCountEl.textContent = '0';
      cartTotalEl.textContent = 'Total : 0,00 €';
      saveCart(cart);
      return;
    }

    var rowsHtml = cart.map(function (entry) {
      var prod = products.find(function (p) { return p.id === entry.id; });
      if (!prod) return '';
      var lineTotal = prod.price * entry.qty;
      totalQty += entry.qty;
      totalPrice += lineTotal;

      return (
        '<div class="cart-row">' +
          '<span class="cart-row-name">' + escapeHtml(prod.title) + ' — ' + formatEuro(lineTotal) + '</span>' +
          '<div class="cart-qty-controls">' +
            '<button type="button" class="qty-btn" data-dec="' + entry.id + '" aria-label="Diminuer la quantité">−</button>' +
            '<span>' + entry.qty + '</span>' +
            '<button type="button" class="qty-btn" data-inc="' + entry.id + '" aria-label="Augmenter la quantité">+</button>' +
          '</div>' +
        '</div>'
      );
    }).join('');

    cartItemsEl.innerHTML = rowsHtml || '<p class="empty-state">Le panier est vide.</p>';
    cartCountEl.textContent = String(totalQty);
    cartTotalEl.textContent = 'Total : ' + formatEuro(totalPrice);
    saveCart(cart);
  }

  function addToCart(id) {
    checkoutFeedback.textContent = '';
    var existing = cart.find(function (item) { return item.id === id; });
    if (existing) {
      existing.qty += 1;
    } else {
      cart.push({ id: id, qty: 1 });
    }
    renderCart();
  }

  filterButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterButtons.forEach(function (b) { b.classList.remove('is-active'); });
      btn.classList.add('is-active');
      activeCategory = btn.getAttribute('data-category');
      renderCatalog();
    });
  });

  searchInput.addEventListener('input', function () {
    searchQuery = searchInput.value;
    renderCatalog();
  });

  catalogList.addEventListener('click', function (e) {
    var addId = e.target.getAttribute('data-add');
    if (addId) {
      addToCart(addId);
      return;
    }
    var delId = e.target.getAttribute('data-delete');
    if (delId && document.body.classList.contains('is-unlocked')) {
      products = products.filter(function (p) { return p.id !== delId; });
      cart = cart.filter(function (c) { return c.id !== delId; });
      saveCatalog(products);
      renderCatalog();
      renderCart();
    }
  });

  cartToggle.addEventListener('click', function () {
    var isOpen = cartPanel.classList.contains('is-open');
    cartPanel.classList.toggle('is-open', !isOpen);
    cartToggle.setAttribute('aria-expanded', !isOpen ? 'true' : 'false');
  });

  cartItemsEl.addEventListener('click', function (e) {
    var incId = e.target.getAttribute('data-inc');
    var decId = e.target.getAttribute('data-dec');
    if (incId) {
      var itemInc = cart.find(function (c) { return c.id === incId; });
      if (itemInc) { itemInc.qty += 1; renderCart(); }
    } else if (decId) {
      var idx = cart.findIndex(function (c) { return c.id === decId; });
      if (idx !== -1) {
        if (cart[idx].qty > 1) {
          cart[idx].qty -= 1;
        } else {
          cart.splice(idx, 1);
        }
        renderCart();
      }
    }
  });

  cartClearBtn.addEventListener('click', function () {
    cart = [];
    checkoutFeedback.textContent = '';
    renderCart();
  });

  checkoutBtn.addEventListener('click', function () {
    if (!cart.length) {
      checkoutFeedback.textContent = 'Impossible d’enregistrer une ordonnance vide.';
      return;
    }
    checkoutFeedback.textContent = 'Commande enregistrée localement au cabinet (aucun prélèvement effectué).';
    cart = [];
    renderCart();
  });

  lockBtn.addEventListener('click', function () {
    var unlocked = document.body.classList.toggle('is-unlocked');
    lockBtn.classList.toggle('is-unlocked', unlocked);
    lockBtn.setAttribute('aria-pressed', unlocked ? 'true' : 'false');
    lockBtn.textContent = unlocked ? 'Déverrouillé' : 'Verrou';
  });

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&')
      .replace(/</g, '<')
      .replace(/>/g, '>')
      .replace(/"/g, '"');
  }

  renderCatalog();
  renderCart();
})();
</script>

</body>
